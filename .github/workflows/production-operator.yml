# One-shot operator actions on production, dispatched by hand, so no person or
# agent holds a production credential on a laptop. Each action is one job bound
# to the `production` GitHub Environment: it waits for that Environment's
# reviewer, and the Environment admits `main` alone. The logic is in
# scripts/production-operator.ts; its header says what each action sends.
#
#   | Action                 | Holds                      | Writes                                   |
#   |------------------------|----------------------------|------------------------------------------|
#   | count-deletion-fanouts | the production Cloudflare  | nothing; prints two counts from          |
#   |                        | account pair               | zap-db-prod's zap_account_purges         |
#   | register-cire-arc      | INTERNAL_SERVICE_SECRET    | cire-api's scopes at production osn-api; |
#   |                        |                            | while osn-api there predates the scope   |
#   |                        |                            | renewal, one expired, revoked throwaway  |
#   |                        |                            | key too (englishstreetventures/osn#2432) |
#   | send-change-notice     | OSN_CHANGE_NOTICE_SECRET   | a change notice to every account, sent   |
#   |                        |                            | by production osn-api, at most max_sends |
#   |                        |                            | this run; with dry_run, nothing: counts  |
#
# Rules every action keeps:
#   - The job that holds a secret runs under `environment: production`, after
#     the `check` job, and only for its own action. `check` holds no secret and
#     shows the approver what the action will do before anyone approves. It is
#     not a gate: a dispatch from another branch runs that branch's file, and
#     the Environment's `main`-only branch policy is what stops it.
#   - Inputs and secrets reach a script through `env:`, never inside `run:`.
#   - Nothing is installed: each script runs with `bun --no-install` and
#     imports only Bun, Node built-ins and repository files, so the only code
#     beside a production secret is this repository's.
#   - Run logs on this repository are public. A script prints counts, HTTP
#     statuses, commit SHAs and scope names; never a token, a bearer, an
#     account id, a row or a response body.
#
# register-cire-arc reads, at the commit production cire-api runs, the scopes
# cire-api signs with, and refuses unless production osn-api permits each. It
# also reads how osn-api at its commit takes them: `renew`, one PUT of the
# scopes with no key, once that commit has the route; `fallback`, a throwaway
# key registered already expired and then revoked, before. The register job
# reads both again when it runs and refuses unless cire-api's commit and the
# method are still the ones `check` showed, so an approval given after a
# release sends nothing. A 200 shows osn-api stored the scopes; osn-api
# isolates keep a key's scopes for up to five minutes. Registering a new key of
# cire-api's own, the first time or in a rotation, needs its public half, which
# this workflow never holds: that stays the hand POST in
# wiki/shared/production-deploy.md §6.2.
#
# send-change-notice mails a notice from osn-api's reviewed registry
# (osn/api/src/services/change-notices.json) to every account. The check job
# reads the registry at the commit production osn-api runs and shows the
# approver the notice in full and its digest; the send job refuses unless
# production still runs that commit, and every call carries the digest, which
# osn-api refuses unless its own notice matches. osn-api reads the addresses
# and sends; the runner sees counts only. Run it with dry_run first. max_sends
# caps the addresses one run sends, so a run cannot use up the Resend quota
# sign-in mail needs; a run stopped by it, by Resend or by a failure resumes
# where it stopped when dispatched again. resend_unconfirmed sends again the
# one batch osn-api could not confirm, and some in it may get the notice twice.
# wiki/osn/change-notices.md is the runbook.
#
# count-deletion-fanouts' window defaults to the one the account-deletion
# follow-up asked about: from the production release of 2026-11-16T02:17:49Z to
# the one of 2026-11-17T00:59:22Z. Both ends are included.
#
# ADDING AN ACTION. Add an option to `action`, a job of the same id with the
# same shape, and an action to the script with its tests in
# scripts/tests/production-operator.test.ts, which holds the rules above. A
# Worker secret on osn-api belongs in set-osn-api-secret.yml instead.
name: Production operator action (one-shot)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Which action to run. Each waits for the production Environment's reviewer.
        required: true
        type: choice
        options:
          - count-deletion-fanouts
          - register-cire-arc
          - send-change-notice
      window_start:
        description: "count-deletion-fanouts: the window's start, YYYY-MM-DDTHH:MM:SSZ, included. The default is the 2026-11-16 release."
        required: false
        type: string
        default: "2026-11-16T02:17:49Z"
      window_end:
        description: "count-deletion-fanouts: the window's end, YYYY-MM-DDTHH:MM:SSZ, included. The default is the 2026-11-17 release."
        required: false
        type: string
        default: "2026-11-17T00:59:22Z"
      notice_id:
        description: "send-change-notice: the notice's id in osn-api's registry."
        required: false
        type: string
      dry_run:
        description: "send-change-notice: count the accounts it would reach, and send nothing."
        required: false
        type: boolean
        default: true
      max_sends:
        description: "send-change-notice: the most addresses this run sends, 1 to 100000. Keep it inside the Resend quota left after sign-in mail."
        required: false
        type: string
      resend_unconfirmed:
        description: "send-change-notice: send again the one batch osn-api could not confirm; some in it may get the notice twice."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check the inputs, and what the action will do
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block replaces the workflow's, so `contents` is restated.
    # `deployments` and `actions` let the release planner's lookup read which
    # commit production cire-api and osn-api run, as the release's plan job does.
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      scopes: ${{ steps.plan.outputs.scopes }}
      method: ${{ steps.plan.outputs.method }}
      osn_commit: ${{ steps.notice.outputs.osn_commit }}
      notice_digest: ${{ steps.notice.outputs.notice_digest }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this workflow from main; the production Environment admits main alone."
          exit 1

      # Full history for the registration and the change notice, whose scopes
      # and notice are read at whichever commit production runs; one commit
      # for the count. `0` is false in an expression, so the condition names
      # the action that needs 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.action != 'register-cire-arc' && inputs.action != 'send-change-notice' && 1 || 0 }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check the window
        if: inputs.action == 'count-deletion-fanouts'
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: bun --no-install scripts/production-operator.ts check-window

      - name: Read the scopes production cire-api signs with
        id: plan
        if: inputs.action == 'register-cire-arc'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-install scripts/production-operator.ts plan-register

      - name: Read the notice production osn-api would send
        id: notice
        if: inputs.action == 'send-change-notice'
        env:
          NOTICE_ID: ${{ inputs.notice_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESEND_UNCONFIRMED: ${{ inputs.resend_unconfirmed }}
          MAX_SENDS: ${{ inputs.max_sends }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-install scripts/production-operator.ts check-notice

  register-cire-arc:
    name: Renew cire-api's ARC scopes at production osn-api
    needs: check
    if: inputs.action == 'register-cire-arc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    # One run at a time: each run reads production's scopes, then sets them
    # whole, so two runs in step could store the older list last.
    concurrency:
      group: production-operator-register-cire-arc
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Renew the registration
        env:
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          # What the approver saw; the script refuses if production moved on.
          EXPECTED_COMMIT: ${{ needs.check.outputs.commit }}
          EXPECTED_METHOD: ${{ needs.check.outputs.method }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-install scripts/production-operator.ts register-cire-arc

  count-deletion-fanouts:
    name: Count Zap's recorded erasures in the window
    needs: check
    if: inputs.action == 'count-deletion-fanouts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Count
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_END: ${{ inputs.window_end }}
        run: bun --no-install scripts/production-operator.ts count-deletion-fanouts

  send-change-notice:
    name: Send a change notice through production osn-api
    needs: check
    if: inputs.action == 'send-change-notice'
    runs-on: ubuntu-latest
    # At most 100,000 addresses: about 1,000 calls a second or more apart.
    timeout-minutes: 120
    environment: production
    # One run at a time: two would answer each other busy, batch by batch.
    concurrency:
      group: production-operator-send-change-notice
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      # Full history: the notice is read again at the commit production runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Send
        env:
          OSN_CHANGE_NOTICE_SECRET: ${{ secrets.OSN_CHANGE_NOTICE_SECRET }}
          NOTICE_ID: ${{ inputs.notice_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESEND_UNCONFIRMED: ${{ inputs.resend_unconfirmed }}
          MAX_SENDS: ${{ inputs.max_sends }}
          # What the approver saw; the script refuses if production moved on.
          EXPECTED_OSN_COMMIT: ${{ needs.check.outputs.osn_commit }}
          EXPECTED_NOTICE_DIGEST: ${{ needs.check.outputs.notice_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun --no-install scripts/production-operator.ts send-change-notice
