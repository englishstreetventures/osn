name: Changeset Check

on:
  # No `branches:` filter. This repo ships stacked PRs, so a PR's base is often
  # the branch below it rather than `main` — and because this check is REQUIRED,
  # filtering to `main` did not merely skip it, it left every stacked PR blocked
  # on a status that could never report. Same reasoning, and the same fix, as
  # `ci-swift.yml`.
  pull_request:
  # The merge queue requires every required check to report on its group
  # commit too. A changeset belongs to a pull request, and each one in the
  # group passed this check on its own, so on a group the job reports a pass
  # without re-deciding it.
  merge_group:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# It checks out the code and diffs it; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Require changeset
    runs-on: ubuntu-latest
    steps:
      - name: A merge-queue group was decided pull request by pull request
        if: github.event_name == 'merge_group'
        run: echo "✅ Every pull request in this group passed this check on its own."

      - uses: actions/checkout@v4
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0

      # Self-test the allowlist before trusting it, so a parser regression fails
      # here rather than silently waving PRs through with no changelog.
      - name: Test changeset-required allowlist
        if: github.event_name != 'merge_group'
        run: bash scripts/tests/changeset-required.test.sh

      - name: Check for changeset
        if: github.event_name != 'merge_group'
        env:
          # The PR's own base, not `main` — on a stacked PR those differ, and
          # diffing against `main` would attribute every commit from the branches
          # below to this PR. `fetch-depth: 0` above is what makes `origin/<base>`
          # resolvable for a base that isn't the default branch.
          BASE_REF: ${{ github.base_ref }}
        run: |
          diff=$(git diff --name-only "origin/$BASE_REF...HEAD")

          # A PR touching nothing any versioned package ships — Swift/Xcode
          # scaffolding, CI, wiki — has no honest package to name in a
          # changeset. Skip the requirement rather than force a false changelog
          # entry against an unrelated package. The allowlist and its reasoning
          # live in scripts/changeset-required.sh.
          if [ "$(printf '%s\n' "$diff" | bash scripts/changeset-required.sh)" = "skip" ]; then
            echo "✅ Nothing versioned touched — changeset not required."
            exit 0
          fi

          files=$(echo "$diff" | grep '^\.changeset/.*\.md$' | grep -v README.md || true)
          if [ -z "$files" ]; then
            echo "❌ No changeset found. Run 'bun run changeset' to add one."
            exit 1
          fi
          echo "✅ Changeset found:"
          echo "$files"

      # Validate that every package name referenced in any .changeset/*.md
      # frontmatter matches a real workspace `name` field. The validator is a
      # self-contained shell+jq script (no bun, no @changesets/cli, no network)
      # so it runs identically here and locally — see scripts/validate-changesets.sh
      # for the rationale and the bug class it guards against.
      # Self-test the validator's logic against fixture changesets before trusting
      # it on the real tree, so a regression in the parser fails loudly here
      # rather than silently letting a bad package name through.
      - name: Test changeset validator
        if: github.event_name != 'merge_group'
        run: bash scripts/tests/validate-changesets.test.sh

      - name: Validate changeset package names
        if: github.event_name != 'merge_group'
        run: bash scripts/validate-changesets.sh
