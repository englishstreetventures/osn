name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      # Cheap on a clean checkout, and load-bearing the moment a macOS iOS
      # build job runs before it — see scripts/check-gen-apple-diff.sh.
      - name: Guard the committed iOS Xcode project
        run: bash scripts/check-gen-apple-diff.test.sh

      - name: Check for a regenerated iOS Xcode project
        run: bash scripts/check-gen-apple-diff.sh

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-check-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # The four d1-integration.test.ts files live outside the vitest `include`
      # glob (`tests/**/*.test.ts`), so `bun run test` never reaches them. They
      # are the only coverage of the ASYNCHRONOUS D1 driver that dev/staging/prod
      # actually run on, and going unrun let zap's rot into a stale fixture that
      # had been failing silently. Serial by necessity — concurrent Miniflare
      # workerd instances contend and fail spuriously (the root script pins
      # --concurrency=1).
      - name: D1 integration tests
        run: bun run test:d1

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All CI jobs passed"
