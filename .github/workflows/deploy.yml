name: Deploy

# Two-tier deploy pipeline: dev automatically, production behind an approval.
#
# Triggers:
#   - push to `main` (after a merge)
#   - manual `workflow_dispatch`
#
# Shape of a run:
#
#   changes ──┐
#             ├──> deploy-<surface>-dev ──> deploy-<surface>-prod
#   build ────┘        (automatic)            (waits for approval)
#
# `build` re-runs the same install + build + test CI does, so nothing ships from
# a broken tree. `changes` computes one boolean per deployable surface from the
# push diff, so a landing-page tweak does not redeploy seven things. Every dev
# job runs unattended; every prod job sits behind the `production` GitHub
# Environment's required reviewer, so the run pauses and waits for a human.
#
# Two Environments, two Cloudflare credential NAMES:
#
#   dev         -> CLOUDFLARE_API_TOKEN_DEV, held only by the `dev` Environment,
#                  falling back to CLOUDFLARE_API_TOKEN while that is unset
#   production  -> CLOUDFLARE_API_TOKEN, reachable only from an approved job
#
# The names differ so the day a dev-only credential exists, every dev job picks
# it up with no change here. The fallback is what makes today work: dev and
# production share ONE Cloudflare account (decided 2026-08-14 — ship the dev
# tier now, split accounts later), and inside a single account a second token
# grants exactly what the first one already does, for the reason below. Secret
# VALUES are never embedded here.
#
# What the split does NOT buy: `Workers Scripts:Edit` and `D1:Edit` are
# ACCOUNT-level permissions — Cloudflare has no per-script or per-database
# resource filter (only R2 scopes per bucket). So CLOUDFLARE_API_TOKEN_DEV can
# technically write production Workers too. The boundary here is the approval
# gate and the separate credential, not a narrower grant. A real boundary means
# a separate Cloudflare account; tracked as `S-M` in xchromo/osn-tracker (#190).
#
# The dev tier is fully isolated — own Workers, own D1, own R2, own OSN identity
# origin — and its database is wiped and re-seeded on every deploy. See
# [[wiki/runbooks/dev-environment]].
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow deploys to Cloudflare, it never writes to the repo.
permissions:
  contents: read

# NOTE: concurrency is set PER JOB (below), not here. A workflow-level group
# would make the whole run the unit of exclusion, and since prod jobs park
# waiting for an approval click, the next merge's *dev* deploy would queue
# behind a human — exactly the automation the dev tier exists to provide. Each
# job instead takes a group named for its own surface AND tier, so two runs
# never deploy the same thing at once while unrelated surfaces stay parallel.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Path filter ────────────────────────────────────────────────────────────
  # One boolean per deployable surface. Same plain-`git diff` approach as the
  # `changes` job in ci-swift.yml, including its fail-open branch: a diff that
  # cannot be computed must mean "deploy", not "skip".
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      cire_api: ${{ steps.filter.outputs.cire_api }}
      cire_invites: ${{ steps.filter.outputs.cire_invites }}
      cire_host: ${{ steps.filter.outputs.cire_host }}
      cire_vendor: ${{ steps.filter.outputs.cire_vendor }}
      cire_landing: ${{ steps.filter.outputs.cire_landing }}
      osn_api: ${{ steps.filter.outputs.osn_api }}
      osn_social: ${{ steps.filter.outputs.osn_social }}
      zap_api: ${{ steps.filter.outputs.zap_api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          # `all=true` means "deploy every surface". Two ways to get there: a
          # trigger with no diff base (workflow_dispatch — an operator asking for
          # a deploy wants all of it), or a diff that failed to compute (GitHub
          # sets event.before to the all-zero SHA on a branch's first push and to
          # an orphaned commit after a force-push; `git diff` exits 128 on both).
          # A wasted deploy costs a minute; a silently skipped one ships a
          # half-updated tier.
          all=false
          changed=""
          if [ "$EVENT_NAME" != "push" ]; then
            echo "event '$EVENT_NAME' has no diff base — deploying every surface."
            all=true
          elif changed=$(git diff --name-only "$BEFORE_SHA" HEAD 2>&1); then
            echo "changed files:"
            echo "$changed"
          else
            echo "cannot diff against '$BEFORE_SHA': $changed"
            echo "assuming every surface changed"
            all=true
            changed=""
          fi

          # Anything shared sits under everything: the shared/ packages, the
          # lockfile, the root build config, and this workflow itself. Rather
          # than map each shared package to its consumers (a mapping that rots
          # the first time an import is added), treat any of them as "all".
          if [ "$all" != "true" ] && echo "$changed" | grep -qE '^(shared/|bun\.lock$|package\.json$|turbo\.json$|tsconfig\.json$|\.github/workflows/deploy\.yml$)'; then
            echo "a shared package or root build file changed — deploying every surface."
            all=true
          fi

          emit() {
            if [ "$all" = "true" ] || echo "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "  $1: true"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "  $1: false"
            fi
          }

          # cire-api owns the D1 migrations + the seed scripts, so a change to
          # either has to redeploy it (the dev job resets and re-seeds).
          emit cire_api     '^(cire/api/|cire/db/|cire/invite-designs/|cire/theme/|scripts/(cire-db-|cire-dev-db-guard|check-d1-database-id))'
          emit cire_invites '^(cire/invites/|cire/invite-designs/|cire/theme/)'
          emit cire_host    '^(cire/host/|cire/invite-designs/|cire/theme/)'
          emit cire_vendor  '^(cire/vendor/|cire/theme/)'
          emit cire_landing '^cire/landing/'
          emit osn_api      '^(osn/api/|osn/db/)'
          emit osn_social   '^(osn/social/|osn/client/|osn/ui/)'
          emit zap_api      '^zap/'

  # ── Gate ─────────────────────────────────────────────────────────────────
  # Re-run install + build + test before any deploy. If this fails, every
  # deploy job below is skipped (they `needs: build`).
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for why this is keyed on the three
      # astro.config.mjs files rather than bun.lock or github.sha — Astro's
      # font-metadata cache is a function of which families each config
      # asks for, and restoring it here turns this workflow's own `bun run
      # build` into a cache hit against fonts.google.com too
      # (xchromo/osn-tracker#128).
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Gate the deploy on the async-D1-driver lane too — these tests sit
      # outside the vitest include glob, so `bun run test` doesn't reach them,
      # and D1 is exactly what this workflow is about to deploy against.
      # Serial: concurrent Miniflare workerd instances contend.
      - name: D1 integration tests
        run: bun run test:d1

  # ═══ cire API + D1 ═════════════════════════════════════════════════════════
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  # The dev database is DISPOSABLE and is rebuilt from scratch here:
  # reset (drop every table incl. the migration ledger) -> migrate (replay all
  # migrations from 0001 against an empty DB) -> seed -> deploy. Two things fall
  # out of that order: dev data never drifts, and every merge re-tests the whole
  # migration chain, so a migration that only works as an increment fails here
  # rather than in production months later.
  #
  # Both destructive steps route through scripts/ guards that re-derive the
  # target from cire/api/wrangler.toml and refuse anything but `cire-db-dev`.
  deploy-cire-api-dev:
    name: Deploy cire/api — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_api == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Guard against placeholder D1 database_id
        run: bun run scripts/check-d1-database-id.ts

      - name: Reset the dev D1 (drops every table)
        run: bun run --cwd cire/db db:reset:dev

      - name: Replay cire D1 migrations from zero (dev)
        run: bun run --cwd cire/db db:migrate:dev

      # CIRE_DEV_OWNER_PROFILE_ID repoints the seeded wedding at a real dev
      # account. The seed owns it as `usr_dev_bootstrap_owner`, an id no account
      # holds, so without this the sample wedding — its guests, its events and
      # its comped entitlements (registry, vendors, AI) — is invisible to
      # everyone signing in to test, and this job resets the tier on every
      # cire_api change, wiping any wedding a tester made by hand. It is a
      # VARIABLE, not a secret: an OSN profile id is not a credential, and a
      # masked value would only make the seed log unreadable. Unset, the seed
      # says so and carries on.
      - name: Seed the dev D1
        run: bun run --cwd cire/db db:seed:dev
        env:
          CIRE_DEV_OWNER_PROFILE_ID: ${{ vars.CIRE_DEV_OWNER_PROFILE_ID }}

      - name: Deploy cire/api Worker (dev)
        run: bunx wrangler deploy --env dev
        working-directory: cire/api

  # ── production ─────────────────────────────────────────────────────────────
  # Migrations are applied to the REMOTE prod DB FIRST, then the Worker is
  # deployed — both in a single job so the order is guaranteed and the migration
  # runs exactly once. `--env production` selects the prod D1 binding explicitly;
  # the top-level block carries the same id today, but naming the env means a
  # future split of the two cannot silently retarget this step.
  #
  # `needs: deploy-cire-api-dev` is the promotion edge: prod ships only what dev
  # already accepted, and the run parks here for the approval click.
  deploy-cire-api:
    name: Deploy cire/api — production
    needs: [build, changes, deploy-cire-api-dev]
    if: needs.changes.outputs.cire_api == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-cire-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      # Fail the deploy if cire/api/wrangler.toml still carries the placeholder
      # (or empty) D1 database_id — deploying against a non-existent DB would
      # silently break every D1 read/write in prod. Wired correctly today; this
      # is a regression guard (grep-only, no creds needed).
      - name: Guard against placeholder D1 database_id
        run: bun run scripts/check-d1-database-id.ts

      # Idempotent: wrangler skips already-applied migrations, so re-running the
      # workflow is safe. Production is never reset and never seeded.
      - name: Apply cire D1 migrations (remote prod)
        run: bun run --cwd cire/db db:migrate:prod

      - name: Deploy cire/api Worker
        run: bunx wrangler deploy --env production
        working-directory: cire/api

  # ═══ cire invites (Astro SSR → Cloudflare Worker) ══════════════════════════
  # The guest site is Astro SSR on Cloudflare (output: "server", the
  # @astrojs/cloudflare adapter). It resolves which wedding to render FROM THE
  # PATH per request — there is NO PUBLIC_WEDDING_SLUG any more. The adapter
  # emits a Cloudflare Worker with Static Assets: `dist/server/entry.mjs` (the
  # SSR Worker), `dist/client/` (prerendered legal pages + JS/CSS), and a
  # generated `dist/server/wrangler.json` that EXTENDS the committed
  # cire/invites/wrangler.jsonc (worker name + custom-domain route).
  # PUBLIC_API_URL / PUBLIC_SITE_URL are read both server-side (per request) and
  # by the client islands; they bake in at build time, which is why dev needs its
  # own build and cannot re-point the prod bundle.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-cire-invites-dev:
    name: Deploy cire/invites — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_invites == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-invites
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install

      - name: Build cire/invites (dev)
        run: bun run build --filter=@cire/invites
        env:
          PUBLIC_API_URL: https://api.dev.cireweddings.com
          PUBLIC_SITE_URL: https://invite.dev.cireweddings.com
          PUBLIC_MARKETING_URL: https://dev.cireweddings.com
          # One Turnstile widget serves both tiers — the dev hostnames are added
          # to its Domains list (dashboard step, see the dev runbook). Whether
          # the gate actually enforces depends on the API side: cire-api-dev only
          # verifies if TURNSTILE_SECRET_KEY is set on that Worker (key-optional).
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_EMBED_KEY }}

      # Two edits to the adapter's generated config, in one pass:
      #
      #  1. drop `legacy_env` — @astrojs/cloudflare still writes it, wrangler
      #     4.111+ hard-errors on it, and removing it is a behavioural no-op
      #     (`true` WAS the default). See the prod job for the full history.
      #  2. retarget name + routes at the dev Worker. The committed
      #     wrangler.jsonc names the PRODUCTION worker and its custom domain;
      #     rewriting here keeps one checked-in config instead of a near-copy
      #     that would drift.
      - name: Retarget the generated config at dev
        run: |
          node -e "
            const fs = require('fs');
            const f = 'dist/server/wrangler.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            delete c.legacy_env;
            c.name = 'cire-invites-dev';
            c.routes = [{ pattern: 'invite.dev.cireweddings.com', custom_domain: true }];
            fs.writeFileSync(f, JSON.stringify(c));
          "
        working-directory: cire/invites

      - name: Deploy cire/invites (dev Worker)
        run: bunx wrangler deploy --config dist/server/wrangler.json
        working-directory: cire/invites

  # ── production ─────────────────────────────────────────────────────────────
  deploy-cire-invites:
    name: Deploy cire/invites — production
    needs: [build, changes, deploy-cire-invites-dev]
    if: needs.changes.outputs.cire_invites == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-cire-invites
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install

      #   PUBLIC_GOOGLE_MAPS_EMBED_KEY is an optional referrer-restricted Embed
      #   key — wire it from a secret/var only if/when one exists.
      #   PUBLIC_TURNSTILE_SITEKEY is the optional Cloudflare Turnstile sitekey
      #   (public, bot protection). The build omits it cleanly when absent (no
      #   widget, no gate — key-optional). The matching TURNSTILE_SECRET_KEY is a
      #   `wrangler secret` on the cire-api Worker (see production-deploy.md).
      - name: Build cire/invites
        run: bun run build --filter=@cire/invites
        env:
          PUBLIC_API_URL: https://api.cireweddings.com
          # Domain reshuffle 2026-07-16: the guest site now lives on the `invite.`
          # subdomain (apex serves the marketing landing site).
          PUBLIC_SITE_URL: https://invite.cireweddings.com
          # Where the guest bare domain (`/`) sends visitors. A multi-tenant guest
          # site has no single wedding to show at its root, so it hands off to the
          # apex marketing landing. Matches the in-code default; set explicitly so
          # the destination is visible in the deploy config.
          PUBLIC_MARKETING_URL: https://cireweddings.com
          # No OSN issuer var: since the OIDC swap (2026-07-27) the guest site
          # never talks to the issuer. "Link my Pulse account" navigates to
          # cire-api's /api/auth/oidc/start, and cire-api runs the exchange.
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          # Google Maps Embed API key (public, referrer-restricted to *.cireweddings.com).
          # Present ⇒ real Embed iframe; absent ⇒ CSS-card fallback (key-optional).
          PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_EMBED_KEY }}

      # `@astrojs/cloudflare` writes a top-level `"legacy_env": true` into the
      # generated `dist/server/wrangler.json`. Wrangler 4.111+ REMOVED support for
      # that field and hard-errors on it ("legacy_env field is no longer
      # supported") — and because cire/invites pins no wrangler, `bunx wrangler` below
      # fetches the latest, so this broke the guest-site deploy the moment 4.111
      # shipped (cire-api is unaffected: hand-written wrangler.toml, no legacy_env,
      # wrangler pinned ^4.96). Removing the field is a no-op for behaviour —
      # `legacy_env: true` WAS the default (each env deploys as its own Worker),
      # so stripping it deploys identically. Version-proof: harmless if a future
      # adapter stops emitting it.
      - name: Strip unsupported legacy_env from generated config
        run: node -e "const fs=require('fs'),f='dist/server/wrangler.json',c=JSON.parse(fs.readFileSync(f,'utf8'));delete c.legacy_env;fs.writeFileSync(f,JSON.stringify(c))"
        working-directory: cire/invites

      # Deploy the SSR Worker. The adapter's generated config carries `main`, the
      # ASSETS binding (→ dist/client), the worker name, and the
      # invite.cireweddings.com custom-domain route. NOTE: this replaces the
      # previous Pages deploy (`wrangler pages deploy dist`); the Cloudflare Pages
      # project `cire` is no longer used for the guest site — invite. resolves to
      # this Worker (the apex now serves the cire-landing marketing site).
      - name: Deploy cire/invites (Worker)
        run: bunx wrangler deploy --config dist/server/wrangler.json
        working-directory: cire/invites

  # ═══ cire host (Astro → Cloudflare Pages) ══════════════════════════════════
  # The organiser portal is a separate static Astro build + Pages project from
  # the guest site. Its PUBLIC_* vars (cire-api origin, musubi account origin for
  # the security deep-link, guest-site URL for the preview link) bake in at build
  # time; sign-in itself is a redirect through cire-api, so no issuer var.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-cire-host-dev:
    name: Deploy cire/host — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_host == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-host
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for the reasoning behind this key.
      # `PUBLIC_CIRE_API_URL` differs between this dev build and the
      # production one below, and turbo.json's `build` task hashes
      # `PUBLIC_*` env vars as inputs — so this job's `bun run build` is
      # always a turbo cache MISS against the `build` job above and really
      # runs `astro build` again, hitting fonts.google.com again unless this
      # restores what that fetch produced (xchromo/osn-tracker#128).
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: cire/host/node_modules/.astro
