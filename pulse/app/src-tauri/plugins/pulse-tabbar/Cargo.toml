[package]
name = "tauri-plugin-pulse-tabbar"
version = "0.1.0"
description = "Local (unpublished) Tauri plugin: a native UITabBar for the pulse iOS app"
edition = "2021"
publish = false
links = "tauri-plugin-pulse-tabbar"

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "commands return Unsupported; pulse does not ship on macOS" }
android = { level = "none", notes = "not implemented; pulse is iOS-only" }
ios = { level = "full", notes = "" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
