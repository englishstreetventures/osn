pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      # Chained, not a sibling command: `pre-commit` runs `parallel: true`, so
      # a separate command gives no ordering guarantee against oxlint, and the
      # vendored anti-slop plugin (oxlintrc.json's jsPlugins) could execute
      # unverified anyway. `&&` is the only way this hook enforces order.
      #
      # `.agents/**` is third-party skill text, already in oxlintrc.json's
      # `ignorePatterns`. That alone is not enough here: oxlint does apply
      # `ignorePatterns` to paths named on the command line, but when every
      # named path is ignored it answers "No files found to lint" and exits 1,
      # which blocks the commit. Excluded here so lefthook never names them.
      exclude:
        - ".agents/**"
      run: bash scripts/verify-vendored-anti-slop.sh && bunx --bun oxlint -c oxlintrc.json {staged_files}
    format:
      glob: "*.{js,jsx,ts,tsx}"
      # Vendored upstream source is left byte-identical so re-vendoring a newer
      # anti-slop is a plain copy, not a copy plus a reformat diff. Third-party
      # skills under `.agents/**` are stricter still: `skills-lock.json` pins a
      # hash of each folder, which `scripts/check-skills-lock.ts` recomputes, so
      # a reformat here fails that check, and the next install from upstream
      # throws it away.
      exclude:
        - "tools/oxlint/anti-slop/**"
        - ".agents/**"
      run: bunx --bun oxfmt {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      # Guarded wrapper, not `bun run check` directly: a worktree made with
      # `git worktree add` has no `node_modules`, so `turbo` is absent and the
      # hook failed with exit 127 — which reads like a type error and pushes
      # people towards `LEFTHOOK=0`. The script installs first when it must.
      run: bash scripts/pre-push-typecheck.sh
    audit:
      # Refuse to push if any installed package has a `high` or `critical`
      # advisory. Pairs with `bunfig.toml`'s `minimumReleaseAge` — one stops
      # fresh malice, this one stops known malice.
      #
      # An --ignore entry is allowed ONLY when all of these hold, and only with
      # the owner's approval on the pull request that adds it:
      #   - the advisory is high/critical and no installable version fixes it;
      #   - it is not a malicious-package advisory, which is never ignored:
      #     remove or replace the package;
      #   - no deployed Worker or page contains the package: build each
      #     consumer and search its output for the package's code;
      #   - wherever the package does run (install, build, CI, dev server,
      #     tests), no attacker-controlled input reaches the flawed code, and
      #     the entry names the inputs it does get.
      # Each entry is the full GHSA-xxxx-xxxx-xxxx id: bun matches --ignore
      # against any part of the advisory URL, so `--ignore=GHSA-` or a
      # truncated id silences every advisory. Each names its package, why it
      # cannot be reached, and its drop-trigger. An ignore covers every path
      # to the package, not only the ones checked, so repeat the check when a
      # parent named below is upgraded or a workspace starts to depend on the
      # package, and remove the entry if it fails. `bun audit` cannot see
      # copies bundled inside other packages.
      #
      # Each entry also carries a `# DROP AFTER <GHSA id> <YYYY-MM-DD>`
      # marker, dated no more than 90 days out, and the `audit-ignores`
      # command below fails once the date passes. Then repeat the check: if it
      # holds, move the date; if not, remove the flag and its paragraph.
      #
      # GHSA-vfj7-8cjw-p6xm — braces 3.0.3, stack exhaustion on deeply nested
      # patterns. Installed via @pulse/web › @solidjs/start 2.0.4 › micromatch
      # and fast-glob, which only its Vite plugins call (the route scanner and
      # the server-function scan), at build and dev time, on patterns from
      # repository config; no deployed build contains braces code. Copies
      # bundled in vite, tsx, prettier, oxfmt and playwright-core are build,
      # dev and test tooling. Drop when braces > 3.0.3 ships and bun.lock
      # resolves it, or when @solidjs/start stops depending on micromatch.
      # DROP AFTER GHSA-vfj7-8cjw-p6xm 2027-01-07
      #
      # GHSA-ch52-4w7c-c8xp — http-cache-semantics 4.2.0, max-stale handling
      # in a shared cache. Installed via astro 7.2.10, which uses it only in
      # its build-time remote-image cache (`dist/assets/build/remote.js`) on
      # requests it builds itself, and never calls `evaluateRequest` or
      # `satisfiesWithoutRevalidation`, the flawed path; no deployed build
      # contains it. Miniflare's bundled copy runs only in `wrangler dev` and
      # the D1 test tier, for one developer's own Worker. Drop when
      # http-cache-semantics > 4.2.0 ships and bun.lock resolves it, or when
      # astro stops depending on it.
      # DROP AFTER GHSA-ch52-4w7c-c8xp 2027-01-07
      #
      # Comments stay above `run:`. Inside the folded block a `#` line is part
      # of the command, and the shell would drop every flag after it.
      # Both drops are tracked in englishstventures/osn#1381.
      run: >
        bun audit --audit-level=high
        --ignore=GHSA-vfj7-8cjw-p6xm
        --ignore=GHSA-ch52-4w7c-c8xp
    audit-ignores:
      # Fails when an `--ignore` above has no `DROP AFTER` marker, or one whose
      # date has passed or is more than 90 days out. Also fails unless the
      # `audit` command, whitespace collapsed, is exactly
      # `bun audit --audit-level=high` followed only by `--ignore=<GHSA id>`
      # flags; unless `audit` carries only `run:` and this hook only
      # `parallel:` and `commands:`; and on a top-level `extends`, `remotes`,
      # `rc` or `templates`. CI's `script-tests` job runs the same check on
      # the committed file.
      run: bun run scripts/check-audit-ignores.ts
    release-age:
      # The third guard over the same dependency surface, and the one that
      # covers the soak policy itself rather than the packages under it: every
      # `minimumReleaseAgeExcludes` entry must carry an unexpired
      # `# DROP AFTER <name> <YYYY-MM-DD>` marker, and `minimumReleaseAge`
      # itself must not fall below three days. CI ran this from the start; the
      # local half was missing, so an expired marker was only ever found after
      # a push.
      run: bun run check:release-age-excludes
