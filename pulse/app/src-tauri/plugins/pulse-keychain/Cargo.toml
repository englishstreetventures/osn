[package]
name = "tauri-plugin-pulse-keychain"
version = "0.1.0"
description = "iOS Keychain bridge for Pulse: device-only, non-syncing get/set/delete exposed to Rust only"
edition = "2021"
license = "UNLICENSED"
links = "tauri-plugin-pulse-keychain"

[lib]
name = "tauri_plugin_pulse_keychain"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
