name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job here reads the checkout and reports through the check run the
# workflow already owns. Nothing writes an issue, a comment, a release or a
# package, so the default token — which is write-all on a repository that has
# not been switched over — is far more than the work needs, and a compromised
# dependency running inside a job inherits whatever the token can do. The
# deploy, release and secret workflows already declare their own; this one was
# the gap.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is the job that runs `bun run lint` below, which executes the
      # vendored anti-slop plugin (oxlintrc.json's jsPlugins). `script-tests`
      # runs this same check, but in parallel with this job — so it verifies
      # the tree independently of, not before, the run that matters. This
      # copy has to come before oxlint actually runs it, hence first step
      # after checkout, before install.
      - name: Verify vendored anti-slop matches its checksums
        run: bash scripts/verify-vendored-anti-slop.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      # Tracker #619 — the general half of the tracker #287 finding. Astro
      # routes every file under `src/pages`, so an un-prefixed `*.test.ts`
      # there is built and deployed as a live route (which is exactly how
      # cire/invites' Worker picked up 119 KB gzip of vitest). Needs no build
      # and no per-app baseline, so it belongs in the fast job rather than
      # `build-test`.
      - name: Check for routable test files under src/pages
        run: bun run scripts/check-astro-test-routes.ts

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Keyed on the commit, not the lockfile. `actions/cache` will not
      # overwrite an entry whose key already exists, so a cache keyed on
      # `bun.lock` is written once and then frozen: every later run on the same
      # lockfile restores that first snapshot, misses on everything that has
      # changed since, and saves nothing back. The cache aged out of usefulness
      # while still reporting a hit. A unique primary key forces a save each
      # run and the prefix restore-key still pulls the most recent one, so the
      # cache follows the branch instead of the dependency list.
      #
      # The Chromium cache below is left on `bun.lock` deliberately — the
      # browser version IS a function of the lockfile, so an exact hit there
      # genuinely has nothing new to write.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-check-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

      # `scripts/` is in no workspace, so `turbo check` never reaches it and a
      # type error there ships. One did: `skill-evals.ts` read an optional
      # `scenario.path` unguarded, which crashed `ready`, `compare` and `record`
      # on a payload the API really returns, and inside the eval poll that reads
      # as "the run was never scored" for a run that was.
      #
      # It lives here rather than in `script-tests` because that job does no
      # `bun install` on purpose, and `scripts/tsconfig.json` inherits
      # `types: ["bun-types"]` from the root — without the install, `tsc` fails
      # on the type package rather than on the code.
      - name: Type check the scripts
        run: bunx --bun tsc -p scripts/tsconfig.json

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # The backstop under the per-step timeouts below. Without it the job's
    # ceiling is GitHub's six hours, which is long enough for one stuck runner
    # to hold up a day of review.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      # `@cire/vendor`, `@cire/host` and `@cire/landing` declare
      # `provider: fontProviders.google()`, which makes `astro build` fetch
      # `https://fonts.google.com/metadata/fonts` — Astro's own font
      # metadata cache for that fetch lives at each package's default
      # `cacheDir`, `node_modules/.astro` (xchromo/osn-tracker#128). None of
      # this job's other caches cover it: the bun cache above only holds
      # installed packages, and the turbo cache is keyed per-commit on
      # purpose (see the `typecheck` job's comment on why) so it can't be
      # the thing that survives across runs here. What decides whether this
      # cache is still correct is which font families each config asks for,
      # not the lockfile or the commit — so, following the same reasoning
      # the other caches in this file use (key on whatever the cache's
      # correctness actually depends on), this one is keyed on the three
      # `astro.config.mjs` files. Restoring it turns most CI runs' font
      # fetch into a cache hit, which is directly the fix for #128: a build
      # that never has to call `fonts.google.com` can't be broken by that
      # endpoint 403ing.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Tracker #287: the cire/invites SSR Worker bundle reached 470 KB gzip
      # unnoticed — a whole animation library in the server module graph with
      # nothing there calling it, and three drift-guard tests routed as pages.
      # `bun run build` above already produced every app's `dist/`, so
      # measuring it here costs a few seconds and puts the budget check on the
      # merge gate. The deploy workflow runs the same script, but only after a
      # merge to main — which is one merge too late to stop the regression.
      #
      # The three tests that were routed have since moved to `tests/pages/`,
      # out of `src/pages` entirely, so Astro cannot route them at all — but
      # the guard stays: it is what catches the NEXT library that wanders into
      # the server graph, which is the half of #287 a file move does nothing
      # about.
      #
      # Tracker #619 generalised the script per-app: cire/invites is the only
      # `output: "server"` app (a Worker, `dist/server`); the other five are
      # `output: "static"` (Cloudflare Pages, `dist/_astro/*.js` +
      # `dist/_astro/*.css` only — see scripts/guard-bundle-size.sh's own
      # comment for why static measures an allowlist rather than a directory).
      # Every app's mode and threshold is a row in
      # scripts/bundle-size-budgets.txt, not an argument here — that file is
      # the single source of truth, and `--all` walks every row in it. See
      # that file's own comment for the re-baselining steps, and
      # wiki/conventions/bundle-size-guards.md for every app's reading.
      #
      # This reads the `dist/` each build step already made and takes well
      # under a second per app, so it sits after Test deliberately: a size
      # trip fails the job either way, and running it last means the author
      # still gets the test result in the same round trip.
      - name: Guard Astro app bundle sizes
        run: ./scripts/guard-bundle-size.sh --all

      # The four d1-integration.test.ts files live under `tests/d1/` (cire's
      # under `tests/db/`). The three vitest packages EXCLUDE that path, so the
      # step above never reaches them — they import `bun:test` and boot a real
      # workerd, neither of which vitest can load. cire/api runs a bare
      # `bun test`, which takes no exclude and discovers recursively, so its
      # copy runs in both steps; that is pre-existing and harmless. They are
      # the only coverage of the ASYNCHRONOUS D1 driver that dev/staging/prod
      # actually run on, and going unrun let zap's rot into a stale fixture
      # that had been failing silently. Serial by necessity — concurrent Miniflare
      # workerd instances contend and fail spuriously (the root script pins
      # --concurrency=1).
      - name: D1 integration tests
        run: bun run test:d1

      # The browser tier (`*.browser.test.tsx`) runs in a real Chromium, because
      # jsdom computes no CSS and no layout — so stacking order, sticky
      # positioning, Tailwind's compiled output and the reduced-motion clamp are
      # all invisible to `bun run test`. Split out for the same reason as the D1
      # step above: it needs a dependency the default path doesn't, and keeping
      # it separate leaves the fast tier fast.
      #
      # `--with-deps` used to do both halves of the install in one line: an apt
      # install of Chromium's shared libraries, and a ~150MB download of the
      # browser itself. On ubuntu-latest the browser alone is not enough, so
      # both have to happen — but neither half had a timeout, and a step with no
      # timeout inherits the job's, which is six hours. On 2026-08-19 one of them
      # stalled and every open PR's Build & Test sat in `pending` behind it for
      # most of a day, with no log to read because a job's logs only appear once
      # it ends. Three changes, all aimed at that:
      #
      #   * the halves are separate steps, so a stall names which half stalled;
      #   * each is bounded, so a stall is a red X in ten minutes instead of a
      #     wedged runner;
      #   * the download half is cached on the lockfile, so the usual run never
      #     makes it. The system libraries are not cacheable (apt writes into the
      #     image, not the workspace) and are reinstalled each run.
      #
      # Only chromium is installed — the tier pins a single instance, so pulling
      # Firefox and WebKit too would be ~3x the download for nothing.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Both installs run from `cire/host`, and the working directory is the
      # whole point. `playwright` is a devDependency of `cire/host` and
      # `cire/invites`, not of the root, so `bunx playwright` at the repo root
      # finds nothing local and fetches the latest release from npm — which
      # then installs the browser revision *that* version wants, not ours.
      #
      # That was harmless right up until it wasn't. The workspace pins
      # playwright 1.62.1, and 1.62.1 was npm's latest from 2026-07-30 until
      # 1.63.0 shipped on 2026-09-04 — so for five weeks the wrong lookup
      # returned the right answer. From 1.63.0 on it installs chromium 1243
      # while the tests look for chromium_headless_shell 1234, and
      # `test:browser` fails with "Executable doesn't exist" on a run whose
      # install step just reported success and downloaded 186.8 MiB.
      #
      # Existing branches did not fail, which is the misleading part: GitHub
      # Actions scopes a cache to the branch that wrote it plus the default
      # branch, so every branch with a Chromium cache from before 2026-09-04
      # still restores revision 1234 and passes. Only a branch with no cache
      # of its own falls through to a fresh install and sees this. Those
      # caches expire, so without this fix the failure arrives on every
      # branch in turn, main included.
      - name: Install Chromium's system libraries
        timeout-minutes: 10
        working-directory: cire/host
        run: bunx playwright install-deps chromium

      - name: Install Chromium for browser tests
        timeout-minutes: 10
        working-directory: cire/host
        run: bunx playwright install chromium

      - name: Browser tests
        run: bun run test:browser

  script-tests:
    name: Scripts
    runs-on: ubuntu-latest
    # The backstop under this job's own checks. Without it the job's ceiling
    # is GitHub's six hours — and because the aggregate `ci` job `needs` it,
    # and `CI` is a required check, a wedged runner here holds the merge gate
    # open for that long. Five minutes is generous: the job does a checkout,
    # a shasum, and `bun test ./scripts/` with no install.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No bun needed, so it runs right after checkout. The `lint` job runs
      # this same script too, and that copy is the one that matters for
      # ordering (see the comment there). This one stays because `script-tests`
      # is the job that owns everything under scripts/, and a shasum costs
      # nothing.
      #
      # One script, two halves. Half 1 — the tree matches its own SHA256SUMS —
      # always runs. Half 2 needs a base ref to diff against, so it only runs
      # where there is one: it catches a change to vendored source with no
      # matching move of the pinned upstream commit in that directory's
      # README, which is either an edit to code the README says is never
      # edited or a re-vendor that forgot the pin. Both are invisible to
      # `shasum -c`, because regenerating the manifest certifies whatever the
      # tree now holds.
      - name: Verify vendored anti-slop matches its checksums
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-vendored-anti-slop.sh

      # `actions/checkout` clones at depth 1, so the base commit has to be
      # fetched before the guard can read it. One `--depth=1` fetch of that
      # single commit is enough: the guard diffs two trees, which needs no
      # common ancestor between them.
      - name: Verify vendored anti-slop matches its checksums and pin
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          bash scripts/verify-vendored-anti-slop.sh "$BASE_SHA"

      # The guard's own tests, beside the run that uses it. They exercise it in
      # throwaway git repos rather than this checkout — one case exports
      # GIT_DIR the way git does for every hook, the state that once made the
      # guard list the whole repo instead of the vendored subtree and blocked
      # every local commit; others build a base and a head commit to drive the
      # pin half. They run on every event, unlike the pin half itself.
      - name: Test the vendored anti-slop guard
        run: bash scripts/tests/verify-vendored-anti-slop.test.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # `scripts/` is not a workspace, so `turbo test` never reaches it and the
      # tests under it ran nowhere: `test:migration` was declared in the root
      # package.json and called by no workflow, so the throttle and backfill
      # tests had never run in CI at all. They do now, along with the D1
      # guard's — which is the pair that matters, since that guard decides
      # whether a deploy proceeds.
      #
      # scripts/cire-dev-db-guard.ts is the only thing standing between the
      # unattended `db:reset:dev` step and the live-wedding D1, and a weakened
      # guard's failure mode is *passing* — nothing downstream would notice
      # until the tables were gone. Its own tests therefore run on every PR,
      # not just when someone remembers.
      #
      # (The changeset gate's two shell tests live in changeset-check.yml
      # instead, beside the job whose scripts they self-test.)
      #
      # The `./` in `bun test ./scripts/` is load-bearing. A bare `scripts/` is
      # a SUBSTRING filter on the test path, not a directory, so it also picks
      # up `cire/api/tests/scripts/remint-family-codes.test.ts` — which imports
      # drizzle and effect and therefore needs an install this job does not do.
      # `./scripts/` anchors to the directory.
      #
      # No `bun install` on purpose: the files under scripts/ import nothing
      # but `bun:test`, Bun/Node built-ins, and each other, so an install here
      # would be a minute spent on nothing.
      - name: Test the scripts
        run: bun run test:scripts

      # The guard's own tests run in the step above; this step runs it against
      # this repo's real vitest configs. Both halves are needed — a test suite
      # over synthetic fixtures proves the guard works, not that the tree it is
      # guarding still passes it.
      - name: Check jest-dom suppression markers
        run: bun run check:jest-dom-markers

      # A prior version of this job ran `checkReleaseAgeExcludes` only from
      # `bun test`, which imports the pure function and feeds it synthetic
      # TOML — the `import.meta.main` CLI block (the part that reads the real
      # `bunfig.toml`) is false under `bun test` and so never ran here, while
      # `bunfig.toml`'s own comment and the changeset that added this script
      # both claimed CI enforced it. It did not. This step is what actually
      # makes that true: the CLI test above proves the wiring works in
      # general, this step proves it against this repo's own bunfig.toml.
      - name: Check release-age excludes are marked and bounded
        run: bun run check:release-age-excludes

  openapi-freshness:
    name: OpenAPI Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Regenerate OpenAPI documents
        run: |
          bun run --cwd pulse/api openapi:generate
          bun run --cwd osn/api openapi:generate

      # Fails if a committed document drifts from what the route
      # definitions currently produce — the Swift client generator consumes
      # the committed files directly, so a stale spec would ship silently.
      - name: Check for drift
        run: git diff --exit-code shared/openapi/

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, build-test, script-tests, openapi-freshness]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All CI jobs passed"
