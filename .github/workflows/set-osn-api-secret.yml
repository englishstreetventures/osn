# One-shot operator workflow: set a Worker secret on an osn-api deployment —
# production, or the dev tier — without a Cloudflare token on anyone's laptop.
#
# WHY THIS EXISTS. Several osn-api secrets are FAIL-CLOSED: without them the
# Worker refuses to serve outside local, so a deploy that lands before the
# secret is set leaves the issuer host (id.musubi.social, id.dev.musubi.social
# on dev) down on every route — that is the #315 outage. The deploy pipeline
# already holds the only Cloudflare tokens that may write these Workers, so
# setting a secret belongs here rather than in a shell history.
#
# Two properties every secret here gets, whatever it is:
#   - the job runs under the GitHub Environment matching the chosen tier, so
#     `production` still needs its reviewer before the prod token is reachable;
#   - the value is masked and never printed. Run logs on this repo are public.
#
# Everything else is per-secret policy, in one table in the step below:
#
#   | Secret              | Tiers      | Value comes from | Rotation |
#   |---------------------|------------|------------------|----------|
#   | OSN_PAIRWISE_SALT   | dev, prod  | generated in-job | NEVER    |
#   | DEV_LOGIN_SECRET    | dev only   | Environment secret of the same name | allowed |
#
# The two axes that matter, and why they differ:
#
# WHERE THE VALUE COMES FROM. A secret nobody ever needs to read again is
# generated in-job — that is the salt: it is an HMAC key, it exists only inside
# Cloudflare, and there is nothing to escrow. A secret a human has to USE is
# not: `DEV_LOGIN_SECRET` goes into the sign-in URL an operator opens, so it
# must exist outside Cloudflare too. It is read from the GitHub Environment
# secret of the same name — set that first with
# `gh secret set DEV_LOGIN_SECRET --repo xchromo/osn --env dev`, keeping your
# own copy. It is deliberately NOT a workflow input: dispatch inputs are
# recorded in the run's metadata, which is readable by anyone on a public repo.
#
# ROTATION. The salt must never change once tokens are live — rotation makes
# every relying party see its users as strangers, permanently, and that holds
# on dev too (a rotated dev salt orphans every dev connection, the exact
# failure the dev tier exists to catch before prod, not to reproduce). So the
# job exits successfully without touching an existing salt, and there is no
# force input: if rotation is ever truly required, pre-launch only, do it by
# hand with `wrangler secret put` so the decision cannot be a misclick.
# `DEV_LOGIN_SECRET` is the opposite case — rotating it IS the documented
# response to the sign-in URL leaking, so re-running this overwrites it.
#
# TIERS. Each tier gets its OWN salt; they are unrelated values and must stay
# that way, since a shared salt makes a dev `sub` equal the prod `sub` for the
# same account, so a dev relying party could be pointed at prod and recognise
# real users. `DEV_LOGIN_SECRET` is refused on production outright: the route
# is a passkey-less bypass, the tier gate keeps it unmounted there, and the
# production deploy preflight fails while the secret exists at all.
#
# ADDING A SECRET. Add a row to the `case` below and an option to the `secret`
# input. Anything not in both is rejected — a typo'd name cannot be written.
name: Set an osn-api Worker secret (one-shot)

on:
  workflow_dispatch:
    inputs:
      secret:
        description: Which Worker secret to set
        required: true
        type: choice
        options:
          - OSN_PAIRWISE_SALT
          - DEV_LOGIN_SECRET
      tier:
        description: Which osn-api deployment to set it on
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-secret:
    name: Set ${{ inputs.secret }} on ${{ inputs.tier }}
    runs-on: ubuntu-latest
    # Same Environments the deploy pipeline uses, so `production` still requires
    # its reviewer before a job can reach the prod Cloudflare token.
    environment: ${{ inputs.tier }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: Set the secret
        working-directory: osn/api
        env:
          # Pick the token by tier explicitly rather than relying on the
          # Environment to shadow a repo-level secret: the two are named
          # differently so landing in the wrong Environment fails on an empty
          # token instead of quietly writing to the other tier.
          CLOUDFLARE_API_TOKEN: ${{ inputs.tier == 'dev' && secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIER: ${{ inputs.tier }}
          SECRET_NAME: ${{ inputs.secret }}
          # Supplied-value secrets are read from the tier's Environment. An
          # absent one arrives as the empty string and is caught below.
          SUPPLIED_DEV_LOGIN_SECRET: ${{ secrets.DEV_LOGIN_SECRET }}
        run: |
          set -euo pipefail

          # Per-secret policy. `tiers` is a space-delimited allowlist, `source`
          # is `generate` or `supplied`, `rotate` is `never` or `allow`.
          case "$SECRET_NAME" in
            OSN_PAIRWISE_SALT)
              tiers="dev production"; source="generate"; rotate="never" ;;
            DEV_LOGIN_SECRET)
              tiers="dev";            source="supplied"; rotate="allow" ;;
            *)
              echo "::error::Unknown secret '$SECRET_NAME'. Add a case here and an input option before using it."
              exit 1 ;;
          esac

          case " $tiers " in
            *" $TIER "*) ;;
            *)
              echo "::error::$SECRET_NAME may only be set on: $tiers. Refusing $TIER."
              exit 1 ;;
          esac

          # Capture the listing into a variable FIRST, so a failing `wrangler
          # secret list` aborts here under `set -e`. Piping it straight into an
          # `if` condition would not: a command used as a condition is exempt
          # from `set -e`, and `pipefail` only sets the pipeline's status, which
          # the `if` then swallows. An expired token or a typo'd tier would look
          # exactly like "the secret is absent" — and a never-rotate secret
          # would then be ROTATED. Failing closed is the whole point.
          existing="$(bunx wrangler secret list --env "$TIER")"
          if printf '%s\n' "$existing" | grep -q "\"$SECRET_NAME\""; then
            if [ "$rotate" = "never" ]; then
              echo "$SECRET_NAME is already set on $TIER — refusing to rotate. Nothing to do."
              exit 0
            fi
            echo "$SECRET_NAME is already set on $TIER — overwriting (rotation is allowed for this secret)."
          fi

          if [ "$source" = "generate" ]; then
            echo "Generating $SECRET_NAME for $TIER in-job (the value is never printed)."
            VALUE="$(openssl rand -base64 64 | tr -d '\n')"
          else
            # Indirect through a fixed prefix so only names this workflow knows
            # about can be read, and a new one fails loudly rather than
            # resolving to an empty variable.
            VALUE="$(printenv "SUPPLIED_$SECRET_NAME" || true)"
            if [ -z "$VALUE" ]; then
              echo "::error::$SECRET_NAME is not set as a GitHub Environment secret on '$TIER'. Set it first, keeping your own copy: gh secret set $SECRET_NAME --repo xchromo/osn --env $TIER"
              exit 1
            fi
            echo "Read $SECRET_NAME from the '$TIER' Environment (the value is never printed)."
          fi

          echo "::add-mask::${VALUE}"
          printf '%s' "${VALUE}" | bunx wrangler secret put "$SECRET_NAME" --env "$TIER"
          echo "Done. $SECRET_NAME is set on osn-api ($TIER)."
          echo "Note: deps are built once per isolate, so redeploy osn-api if the change must take effect on warm isolates immediately."
