name: Production release

# Ships main to production. Dev deploys per push in deploy.yml; production
# deploys only from here, every Worker through its product's Alchemy stack
# (musubi, cire, zap), behind two approvals: the stacks' plan, then the
# deploy.
#
# Shape of a run:
#
#   plan ──> build ──┬──> alchemy-plan ──> stack-<stack>-production ──> record-<surface>
#        └─> sites ──┘    (approval 1)     (approval 2, together)
#
# `build` and `sites` run side by side; `alchemy-plan` and every stack job
# need both.
#
# `sites` builds each production site a shipping stack deploys, and the
# guest site's Worker, once, with the values each build bakes in, and passes
# them on as the `production-sites` artifact. A job that holds a credential
# downloads it outside its checkout and lets in only those builds
# (scripts/production-sites-artifact.ts).
# `alchemy-plan` (the `production` Environment's first review) reads, per
# shipping stack, what its adopted API Workers, databases and buckets hold
# live (names and settings, never a secret's value), plans the stack and runs
# the plan guard over the plan, the Workers' custom domains and that live
# read, keeping only the guard's record (names, kinds, actions, and each
# Worker's custom-domain change). Every stack job needs all four, so they
# reach the gate together and one second review releases them. Any job that
# fails stops every deploy job: a guard refusal, a site build, or a state
# store that needs bootstrapping after an Alchemy bump holds the release
# until fixed, or until a dispatch whose `surfaces` leave that stack out.
#
# Each stack job reads the live state again, re-plans, refuses a plan the
# guard refuses or that differs from the one approved at `alchemy-plan`,
# applies its API's D1 migrations with Wrangler when that API ships (one
# migrator per database; the migration runs before the Worker version that
# needs it), deploys, checks every secret live before the deploy is live
# after it, and smoke-checks each surface, rolling back what it deployed
# when a check fails. A record job per surface then leaves the surface's
# Deployment record in the `production-records` Environment, which has no
# reviewer. Production secrets stay on the Workers: no stack uploads one,
# and every upload keeps the ones it does not name.
#
# `plan` runs scripts/release-plan.ts. For each surface it finds the commit
# production last deployed (the GitHub Deployment records the record jobs
# leave, tied to a surface by job name and checked against the run that made
# them), diffs it against this run's commit, and outputs one boolean per
# surface and per stack. Because the baseline is what production runs rather
# than what a push changed, a release that was skipped, cancelled or rejected
# strands nothing: the next one finds the same gap. A changed surface with a
# dev tier ships only if dev already deployed the same content. When nothing
# differs, every deploy job is skipped and nobody is asked to approve
# anything.
#
# `build` re-runs the install + build + test CI does, so nothing ships from a
# broken tree, and it runs before the gate so the approver is never asked to
# release a commit that fails its tests.
#
# One approval per gate: every stack job needs [plan, build, sites,
# alchemy-plan], so they all reach the gate at the same moment, and one review
# releases every job waiting on an Environment. A job reaching the gate later
# would need a review of its own — scripts/tests/deploy-workflows.test.ts
# holds the `needs:` lists.
#
# After each deploy, scripts/smoke-check.ts asks each surface's own host, for
# up to a minute, whether the new version serves. One that answers wrongly is
# rolled back to the version before it, through the Cloudflare API with the
# job's own token, while the deployment this run made is still the newest,
# and its surface records nothing: the planner keeps counting the previous
# release as what production runs, and the next release offers the surface
# again. A rollback restores the Worker's code only — the D1 migrations the
# job applied stay — and never crosses a secret change: Cloudflare refuses
# that, and the script leaves it to a person.
#
# The job names are load-bearing: the planner maps a Deployment record to a
# surface by the name of the job that made it (scripts/deploy-surfaces.ts).
# Rename a job there and here together, or the next release ships that
# surface again because it finds no record for it.
#
# Credentials: CLOUDFLARE_API_TOKEN is held only by the `production`
# Environment, so only an approved job can read it. The `production`
# Environment also allows `main` alone; the plan job refuses any other ref
# before the build starts. In the Alchemy jobs it reaches only the steps that
# check the token, read the state store, snapshot or compare deployments,
# read the Workers' custom domains and the adopted resources' live state,
# plan, migrate, deploy and smoke-check. The jobs that install a narrower
# tree than `sites` and hold a credential restore no dependency cache, which
# jobs holding no secret also write. Every checkout sets
# `persist-credentials: false`: no step fetches or pushes, so the job token
# never sits in .git/config while dependency code runs.
# shared/infra/tests/workflow-secrets.test.ts holds this.
on:
  # 20:17 UTC — 07:17 in Sydney in summer time, 06:17 in winter, so the
  # release waits for approval at the start of the owner's day with the
  # previous day's merges in it. Off the hour: GitHub delays and drops
  # scheduled runs most at the top of the hour.
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      surfaces:
        description: "Surfaces to consider, comma or space separated: cire_api cire_invites cire_host cire_vendor cire_landing osn_api osn_social musubi_landing zap_api. Empty means all."
        type: string
        required: false
        default: ""
      force:
        description: "Ship those surfaces even if production already runs this commit's content, and skip the dev check. For changes no path shows: a repo Variable, or a rollback made by hand."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One release at a time. While a run is in progress — including waiting for
# approval — the next trigger waits as the group's one pending run, and a
# newer trigger replaces that pending run. Never cancel-in-progress: a
# cancelled deploy can leave production's D1 migrated ahead of its Worker.
# The ref is in the name so a dispatch from another branch (which the plan job
# refuses) cannot replace main's pending release.
concurrency:
  group: production-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every Alchemy run sends no telemetry.
  DO_NOT_TRACK: "1"

jobs:
  # ── What production is missing ──────────────────────────────────────────
  plan:
    name: Work out what production is missing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block replaces the workflow's, so `contents` is restated.
    # `deployments` reads the Deployment records and their statuses;
    # `actions` reads the runs and jobs that tie a record to a surface.
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
      cire_api: ${{ steps.plan.outputs.cire_api }}
      cire_invites: ${{ steps.plan.outputs.cire_invites }}
      cire_host: ${{ steps.plan.outputs.cire_host }}
      cire_vendor: ${{ steps.plan.outputs.cire_vendor }}
      cire_landing: ${{ steps.plan.outputs.cire_landing }}
      osn_api: ${{ steps.plan.outputs.osn_api }}
      osn_social: ${{ steps.plan.outputs.osn_social }}
      musubi_landing: ${{ steps.plan.outputs.musubi_landing }}
      zap_api: ${{ steps.plan.outputs.zap_api }}
      stack_musubi: ${{ steps.plan.outputs.stack_musubi }}
      stack_cire: ${{ steps.plan.outputs.stack_cire }}
      stack_zap: ${{ steps.plan.outputs.stack_zap }}
      any_stack: ${{ steps.plan.outputs.any_stack }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A production release runs from main only; this run is on $GITHUB_REF."
          exit 1

      # Full history: the planner diffs against whichever commit each surface
      # last deployed, which can be any distance back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # No install: the planner imports only Bun and Node built-ins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Compare each surface with what production runs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SURFACES: ${{ inputs.surfaces }}
          FORCE: ${{ inputs.force }}
        run: bun run scripts/release-plan.ts

  # ── Gate ─────────────────────────────────────────────────────────────────
  # The same install + build + test as deploy.yml's `build` job. If it fails,
  # every deploy job below is skipped.
  build:
    name: Build & Test
    needs: [plan]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for why this is keyed on the three
      # astro.config.mjs files rather than bun.lock or github.sha.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # The async-D1-driver lane sits outside the vitest include glob, so
      # `bun run test` does not reach it, and D1 is what this deploys against.
      # Serial: concurrent Miniflare workerd instances contend.
      - name: D1 integration tests
        run: bun run test:d1

  # ── The production sites, built once ─────────────────────────────────────
  # Each site a shipping stack deploys, and the guest site's Worker, built
  # with the production values each build bakes in. No Environment and no
  # secret: the build values are public, and nothing here can deploy.
  sites:
    name: Build the production sites
    needs: [plan]
    if: needs.plan.outputs.any_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `astro build` runs on Node, and astro 7.4 requires Node >= 22.23.4.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      # turbo.json's `build` task hashes `PUBLIC_*`, `VITE_*` and `SITE`, and
      # these differ from the `build` job's, so no turbo cache could serve a
      # build here and none is restored: each really runs `astro build`.
      # Restoring the font metadata keeps that from fetching
      # fonts.google.com again; see ci.yml's `build-test` job for the key.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/host/node_modules/.astro
            cire/vendor/node_modules/.astro
            cire/landing/node_modules/.astro
            musubi/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/host/astro.config.mjs', 'cire/vendor/astro.config.mjs', 'cire/landing/astro.config.mjs', 'musubi/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      # The guest site: Astro SSR on a Worker with static assets (the
      # @astrojs/cloudflare adapter writes `dist/server` and `dist/client`),
      # which the cire stack uploads as a prebuilt Worker. PUBLIC_API_URL and
      # PUBLIC_SITE_URL bake in at build time, which is why dev has its own
      # build in deploy.yml and cannot re-point this one.
      #   PUBLIC_GOOGLE_MAPS_EMBED_KEY is an optional referrer-restricted Embed
      #   key. PUBLIC_TURNSTILE_SITEKEY is the optional Cloudflare Turnstile
      #   sitekey (public, bot protection); the build omits the widget cleanly
      #   when it is absent.
      - name: Build cire/invites
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run build --filter=@cire/invites
        env:
          PUBLIC_API_URL: https://api.cireweddings.com
          # The guest site lives on the `invite.` subdomain; the apex serves
          # the marketing landing site.
          PUBLIC_SITE_URL: https://invite.cireweddings.com
          # Where the guest bare domain (`/`) sends visitors: the apex
          # marketing landing. Matches the in-code default; set explicitly so
          # the destination is visible in the deploy config.
          PUBLIC_MARKETING_URL: https://cireweddings.com
          # No OSN issuer var: the guest site never talks to the issuer. "Link
          # my Pulse account" navigates to cire-api's /api/auth/oidc/start,
          # and cire-api runs the exchange.
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          # Google Maps Embed API key (public, referrer-restricted to
          # *.cireweddings.com). Present ⇒ real Embed iframe; absent ⇒ CSS-card
          # fallback.
          PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_EMBED_KEY }}
          # The commit this release is built from. The footer prints its first
          # seven characters as the version, so a report from a phone says
          # which build it was. A `PUBLIC_*` var is in turbo's build hash, so
          # a new commit never replays an older `dist/`.
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Marks a production deploy build: the CSP integration then fails
          # the build unless the cire-api URL is https://api.cireweddings.com.
          # turbo hashes it, so this build never replays the `build` job's
          # tier-less one. A literal, so the tier is always `production` here.
          OSN_DEPLOY_TIER: production

      # The organiser portal. Its PUBLIC_* vars bake in at build time; sign-in
      # is a redirect through cire-api, so no issuer var.
      - name: Build cire/host
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run build --filter=@cire/host
        env:
          PUBLIC_CIRE_API_URL: https://api.cireweddings.com
          # The account pages (passkeys, recovery codes) live on musubi's own
          # origin — the security panel deep-links there.
          PUBLIC_OSN_ACCOUNT_URL: https://musubi.social
          # The organiser's "preview / view live invite" link.
          PUBLIC_CIRE_WEB_URL: https://invite.cireweddings.com
          # The RSVP editor's privacy link: the marketing site's /privacy.
          PUBLIC_MARKETING_URL: https://cireweddings.com
          # The commit this release is built from; the account menu prints its
          # first seven characters as the version, as the guest site's footer
          # does.
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Marks a production deploy build: the CSP integration then fails
          # the build unless the cire-api URL is https://api.cireweddings.com.
          # turbo hashes it, so this build never replays the `build` job's
          # tier-less one. A literal, so the tier is always `production` here.
          OSN_DEPLOY_TIER: production

      # The vendor self-service portal.
      - name: Build cire/vendor
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run build --filter=@cire/vendor
        env:
          PUBLIC_CIRE_API_URL: https://api.cireweddings.com
          # Account management deep link (see the cire/host build above).
          PUBLIC_OSN_ACCOUNT_URL: https://musubi.social
          # The version the account menu prints (see the cire/host build above).
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # A deploy build (see the cire/host build above).
          OSN_DEPLOY_TIER: production

      # The marketing site on the apex cireweddings.com:
      #   PUBLIC_ORGANISER_URL — target of the primary "Create your invitation"
      #     CTA: the organiser portal.
      #   SITE — canonical origin for SEO meta; the apex cireweddings.com.
      #   PUBLIC_BUILD_SHA — the commit this build is made from; the footer
      #     prints its first seven characters as the version, so a report
      #     from a phone says which build it was.
      - name: Build cire/landing
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run build --filter=@cire/landing
        env:
          PUBLIC_ORGANISER_URL: https://host.cireweddings.com
          SITE: https://cireweddings.com
          PUBLIC_BUILD_SHA: ${{ github.sha }}

      # VITE_TURNSTILE_SITEKEY is the client half of the Turnstile gate, and is
      # not optional here: osn-api holds TURNSTILE_SECRET_KEY, so
      # `/register/begin` and the identifier-bound `/login/passkey/begin` fail
      # closed (400 turnstile_failed) on any request without a token. An unset
      # or renamed repo Variable expands to "", the app reads that as "no
      # widget", and every register and login fails — with a green build and a
      # green deploy, which the unit tests cannot see. Fail the build instead.
      # Same repo Variable as the cire builds (one widget, one sitekey);
      # musubi.social must be in the widget's Domains list.
      - name: Require the Turnstile sitekey
        if: needs.plan.outputs.stack_musubi == 'true'
        run: |
          if [ -z "${VITE_TURNSTILE_SITEKEY}" ]; then
            echo "::error::Repo Variable PUBLIC_TURNSTILE_SITEKEY is empty or unset."
            echo "osn-api has TURNSTILE_SECRET_KEY set, so a build without the sitekey"
            echo "fails closed on every sign-in and registration. See wiki/shared/turnstile.md."
            exit 1
          fi
        env:
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      # The identity web app, including `/authorize`, the OIDC consent screen
      # osn-api redirects to. VITE_OSN_ISSUER_URL bakes in at build time;
      # without it the bundle falls back to http://localhost:4000 and every
      # call from the deployed app dials the user's own machine.
      - name: Build musubi/social
        if: needs.plan.outputs.stack_musubi == 'true'
        run: bun run build --filter=@musubi/social
        env:
          VITE_OSN_ISSUER_URL: https://id.musubi.social
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      # musubi's marketing site on www.musubi.social; its sign-in and
      # get-started links go to the app.
      - name: Build musubi/landing
        if: needs.plan.outputs.stack_musubi == 'true'
        run: bun run build --filter=@musubi/landing
        env:
          SITE: https://www.musubi.social
          PUBLIC_APP_URL: https://musubi.social

      # Each warns when its bundle is over its budget, and fails, stopping the
      # release, on a source map anywhere in `dist`, which is served whole.
      # Each `build` script chains this guard too, but a turbo cache replay
      # skips the chained call; this checks what uploads either way
      # (wiki/conventions/bundle-size-guards.md).
      - name: Check cire/invites SSR bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true'
        run: ./scripts/guard-bundle-size.sh cire/invites

      - name: Check cire/host bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true'
        run: ./scripts/guard-bundle-size.sh cire/host

      - name: Check cire/vendor bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true'
        run: ./scripts/guard-bundle-size.sh cire/vendor

      - name: Check cire/landing bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true'
        run: ./scripts/guard-bundle-size.sh cire/landing

      - name: Check musubi/landing bundle size and refuse public source maps
        if: needs.plan.outputs.stack_musubi == 'true'
        run: ./scripts/guard-bundle-size.sh musubi/landing

      # A file at the root, so the artifact's paths start at the repository
      # root however many sites were built, and a reader can see which.
      - name: List the built sites
        run: |
          for dir in cire/invites/dist cire/host/dist cire/vendor/dist cire/landing/dist musubi/social/dist musubi/landing/dist; do
            if [ -d "$dir" ]; then echo "$dir"; fi
          done > production-sites.txt
          cat production-sites.txt

      # Hidden files included: musubi social's `.well-known/apple-app-site-association`
      # is what iOS reads to offer the app's passkeys, and a dot-directory is
      # left out otherwise.
      - name: Keep the built sites
        uses: actions/upload-artifact@v4
        with:
          name: production-sites
          path: |
            production-sites.txt
            cire/invites/dist
            cire/host/dist
            cire/vendor/dist
            cire/landing/dist
            musubi/social/dist
            musubi/landing/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ── Approval 1: the Alchemy plan ─────────────────────────────────────────
  # Runs only when a stack ships, in the `production` Environment, so its
  # review is the first of two. For each shipping stack it reads what the
  # adopted resources hold live, plans the stack, the log kept in a file
  # because raw Alchemy output can carry account values, and runs the plan
  # guard, keeping only its record: resource names, kinds, actions and
  # counts. The guard holds no credential.
  alchemy-plan:
    name: Plan the Alchemy stacks
    needs: [plan, build, sites]
    if: needs.plan.outputs.any_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The production stacks' trees and the API Workers they bundle, no
      # other workspace's, and no cache: the cache is shared with jobs that
      # hold no secret.
      - name: Install the production stacks' dependencies
        run: bun install --frozen-lockfile --filter @cire/infra --filter @cire/api --filter @musubi/infra --filter @osn/api --filter @osn/db --filter @zap/infra --filter @zap/api

      # The stacks check each site's build for the production origins it
      # bakes in before they declare it.
      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      # The production token must reach the production account and no other.
      # Every step below that holds it runs only after this passes.
      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A plan reads the state store; an Alchemy bump that changed the store's
      # version leaves it unreadable until the store is bootstrapped again.
      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Alchemy plans against its own state; a Worker a smoke check rolled
      # back still matches it, so --force re-uploads what the commit declares,
      # here and in the stack job alike.
      - name: Record the musubi Workers' newest deployments
        id: snapshot_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments-musubi.json" --tier production osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains each of the stack's Workers holds now: the guard
      # shows and judges the change the plan makes to them, which its text
      # does not.
      - name: Read the musubi Workers' custom domains
        id: worker_domains_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains-musubi.json" --tier production osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # What the stack's adopted API Workers, databases and buckets hold
      # live: secret names, crons, Durable Object classes, storage settings.
      # Names and settings only; no secret's value is read.
      - name: Read the musubi stack's adopted resources live
        id: live_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        working-directory: musubi/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live-musubi.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan the musubi stack
        id: plan_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        working-directory: musubi/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/musubi.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot_musubi.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi plan log, as the step failed
        if: ${{ failure() && steps.plan_musubi.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/musubi.log"

      # Names, kinds, actions and counts to the run summary; fails on a plan,
      # a domain change or a live state the guard refuses. Its record is what
      # the stack job's re-plan must equal.
      - name: Guard the musubi plan
        id: guard_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        working-directory: musubi/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/musubi.log" --out "$RUNNER_TEMP/alchemy-plan/musubi.json" --domains "$RUNNER_TEMP/domains-musubi.json" --live "$RUNNER_TEMP/live-musubi.json" ${SCHEDULED:+--scheduled}
        env:
          # A release started by its schedule adds no host to a Worker.
          SCHEDULED: ${{ github.event_name == 'schedule' && 'yes' || '' }}

      # Alchemy plans against its own state; a Worker a smoke check rolled
      # back still matches it, so --force re-uploads what the commit declares,
      # here and in the stack job alike.
      - name: Record the cire Workers' newest deployments
        id: snapshot_cire
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments-cire.json" --tier production cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains each of the stack's Workers holds now: the guard
      # shows and judges the change the plan makes to them, which its text
      # does not.
      - name: Read the cire Workers' custom domains
        id: worker_domains_cire
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains-cire.json" --tier production cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # What the stack's adopted API Workers, databases and buckets hold
      # live: secret names, crons, Durable Object classes, storage settings.
      # Names and settings only; no secret's value is read.
      - name: Read the cire stack's adopted resources live
        id: live_cire
        if: needs.plan.outputs.stack_cire == 'true'
        working-directory: cire/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live-cire.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan the cire stack
        id: plan_cire
        if: needs.plan.outputs.stack_cire == 'true'
        working-directory: cire/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/cire.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot_cire.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire plan log, as the step failed
        if: ${{ failure() && steps.plan_cire.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/cire.log"

      # Names, kinds, actions and counts to the run summary; fails on a plan,
      # a domain change or a live state the guard refuses. Its record is what
      # the stack job's re-plan must equal.
      - name: Guard the cire plan
        id: guard_cire
        if: needs.plan.outputs.stack_cire == 'true'
        working-directory: cire/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/cire.log" --out "$RUNNER_TEMP/alchemy-plan/cire.json" --domains "$RUNNER_TEMP/domains-cire.json" --live "$RUNNER_TEMP/live-cire.json" ${SCHEDULED:+--scheduled}
        env:
          # A release started by its schedule adds no host to a Worker.
          SCHEDULED: ${{ github.event_name == 'schedule' && 'yes' || '' }}

      # Alchemy plans against its own state; a Worker a smoke check rolled
      # back still matches it, so --force re-uploads what the commit declares,
      # here and in the stack job alike.
      - name: Record the zap Workers' newest deployments
        id: snapshot_zap
        if: needs.plan.outputs.stack_zap == 'true'
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments-zap.json" --tier production zap_api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains each of the stack's Workers holds now: the guard
      # shows and judges the change the plan makes to them, which its text
      # does not.
      - name: Read the zap Workers' custom domains
        id: worker_domains_zap
        if: needs.plan.outputs.stack_zap == 'true'
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains-zap.json" --tier production zap_api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # What the stack's adopted API Workers, databases and buckets hold
      # live: secret names, crons, Durable Object classes, storage settings.
      # Names and settings only; no secret's value is read.
      - name: Read the zap stack's adopted resources live
        id: live_zap
        if: needs.plan.outputs.stack_zap == 'true'
        working-directory: zap/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live-zap.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan the zap stack
        id: plan_zap
        if: needs.plan.outputs.stack_zap == 'true'
        working-directory: zap/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/zap.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot_zap.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the zap plan log, as the step failed
        if: ${{ failure() && steps.plan_zap.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/zap.log"

      # Names, kinds, actions and counts to the run summary; fails on a plan,
      # a domain change or a live state the guard refuses. Its record is what
      # the stack job's re-plan must equal.
      - name: Guard the zap plan
        id: guard_zap
        if: needs.plan.outputs.stack_zap == 'true'
        working-directory: zap/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/zap.log" --out "$RUNNER_TEMP/alchemy-plan/zap.json" --domains "$RUNNER_TEMP/domains-zap.json" --live "$RUNNER_TEMP/live-zap.json" ${SCHEDULED:+--scheduled}
        env:
          # A release started by its schedule adds no host to a Worker.
          SCHEDULED: ${{ github.event_name == 'schedule' && 'yes' || '' }}

      - name: Keep the approved plans
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/alchemy-plan/
          if-no-files-found: error
          retention-days: 7

  # ═══ The stack jobs ═════════════════════════════════════════════════════
  #
  # One job per production stack, so a failure in one leaves the others to
  # finish, and each `if:` reads its own output. Every stack job:
  #   - needs [plan, build, sites, alchemy-plan] — the gate rule above —
  #     and runs only when all four succeeded;
  #   - takes the group `deploy-production-<stack>` without cancelling, so two
  #     production deploys of one stack never overlap, and they run in the
  #     order they were created, which is what lets the planner read the
  #     newest successful record as what production runs.

  # ═══ musubi stack, production: osn-api with its database, musubi social and musubi landing ═══
  stack-musubi-production:
    name: Alchemy musubi stack — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.stack_musubi == 'true' && needs.build.result == 'success' && needs.sites.result == 'success' && needs.alchemy-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production-musubi
      cancel-in-progress: false
    outputs:
      # False when the deploy, the compare or the secret check after it
      # failed: a Worker whose new version may not have uploaded, or that
      # lost a secret, must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' && steps.kept.outcome == 'success' }}
      osn_api_healthy: ${{ steps.smoke_osn_api.outcome == 'success' }}
      osn_social_healthy: ${{ steps.smoke_osn_social.outcome == 'success' }}
      musubi_landing_healthy: ${{ steps.smoke_musubi_landing.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The musubi stack's tree and the API Worker it bundles and migrates,
      # and no cache: the cache is shared with jobs that hold no secret.
      - name: Install the musubi stack's dependencies
        run: bun install --frozen-lockfile --filter @musubi/infra --filter @osn/api --filter @osn/db

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Fetch the approved plans
        uses: actions/download-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/approved

      # Each surface's production host, which its smoke check asks.
      - name: Production hosts
        id: hosts
        run: bun run --cwd shared/infra production-hosts

      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # `deploy --yes` upgrades or bootstraps the state store without asking;
      # this refuses one that is not as this Alchemy expects before the plan
      # reads it. The plan itself runs without --yes, so it upgrades nothing.
      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" --tier production osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains the Workers hold now: the guard holds the domain
      # change to the one approved, as it holds the plan.
      - name: Read the musubi Workers' custom domains
        id: worker_domains
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains.json" --tier production osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The adopted resources as they are now; the check after the deploy
      # compares the secret names live then with these.
      - name: Read the musubi stack's adopted resources live
        id: live
        working-directory: musubi/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The plan approved at alchemy-plan may be hours old. Plan again, with
      # the force the deploy uses, and deploy only what the guard allows and
      # what equals the approved plan.
      - name: Plan the musubi stack again
        id: plan
        working-directory: musubi/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/musubi.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi plan log, as the step failed
        if: ${{ failure() && steps.plan.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/musubi.log"

      # A refusal fails the job here, before anything writes.
      - name: Guard the plan, and hold it to the approved one
        id: guard
        working-directory: musubi/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/musubi.log" --out "$RUNNER_TEMP/plan-guard/musubi.json" --domains "$RUNNER_TEMP/domains.json" --live "$RUNNER_TEMP/live.json" --approved "$RUNNER_TEMP/approved/musubi.json" ${SCHEDULED:+--scheduled}
        env:
          # A release started by its schedule adds no host to a Worker.
          SCHEDULED: ${{ github.event_name == 'schedule' && 'yes' || '' }}

      # Wrangler is the database's one migrator, and applies what is pending
      # before the Worker version that needs it uploads. A migration file is
      # in osn_api's own paths, so a release that does not ship it has nothing
      # to apply. Idempotent; production is never reset and never seeded.
      - name: Apply osn D1 migrations (remote prod)
        id: migrate
        if: needs.plan.outputs.osn_api == 'true'
        run: bun run --cwd osn/db db:migrate:prod
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The stack refuses to deploy unless OSN_DEPLOY_TIER and both
      # credentials are set, and each build was made for production. It
      # uploads no secret: production's stay on the Workers.
      - name: Deploy the musubi stack
        id: deploy
        working-directory: musubi/infra
        run: bun run deploy:production ${FORCE:+--force} > "$RUNNER_TEMP/alchemy.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi deploy log, as the step failed
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/alchemy.log"

      # Change counts alone to the run summary, never a line of the log.
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack musubi "$RUNNER_TEMP/alchemy.log"

      # Runs after a deploy that failed part-way too, so a Worker it managed
      # to upload is still checked, and rolled back if it fails.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" --tier production osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Every secret name live before the deploy must be live after it: the
      # upload keeps the secrets it does not name. Cloudflare returns no
      # value, so a lost secret cannot be put back from here; this names it
      # at once and stops every record.
      - name: Check every secret live before the deploy is live after it
        id: kept
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        working-directory: musubi/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live-after.json" --kept "$RUNNER_TEMP/live.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Five minutes: a check, its rollback and the re-check, with every
      # request at its timeout, take 186 s. A site PRODUCTION_HOST_HOLDS
      # holds off probes nothing: its check reads that the held host is off
      # its Worker (scripts/smoke-check.ts).
      - name: Smoke check osn/api, rolling back on failure
        id: smoke_osn_api
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts osn_api production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.osn_api_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.osn_api_deployment }}
          # The coordination probe answers only the bearer the Worker holds.
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check musubi/social, rolling back on failure
        id: smoke_osn_social
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts osn_social production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.osn_social_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.osn_social_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check musubi/landing, rolling back on failure
        id: smoke_musubi_landing
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts musubi_landing production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.musubi_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.musubi_landing_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.kept.outcome == 'failure' || steps.smoke_osn_api.outcome == 'failure' || steps.smoke_osn_social.outcome == 'failure' || steps.smoke_musubi_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check or the secret check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── musubi stack's record jobs ──────────────────────────────────────────────
  # One per surface. Each runs when the stack job deployed, kept every
  # secret, and its surface's check passed, and leaves that surface's
  # Deployment record in `production-records`, named for the surface:
  # scripts/release-plan.ts reads records by job name.
  record-osn-api:
    name: Record osn/api — production
    needs: [stack-musubi-production]
    if: ${{ !cancelled() && needs.stack-musubi-production.outputs.deployed == 'true' && needs.stack-musubi-production.outputs.osn_api_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "osn-api deployed and passed its smoke check in this run's musubi stack job."

  record-osn-social:
    name: Record musubi/social — production
    needs: [stack-musubi-production]
    if: ${{ !cancelled() && needs.stack-musubi-production.outputs.deployed == 'true' && needs.stack-musubi-production.outputs.osn_social_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "osn-social deployed and passed its smoke check in this run's musubi stack job."

  record-musubi-landing:
    name: Record musubi/landing — production
    needs: [stack-musubi-production]
    if: ${{ !cancelled() && needs.stack-musubi-production.outputs.deployed == 'true' && needs.stack-musubi-production.outputs.musubi_landing_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "musubi-landing deployed and passed its smoke check in this run's musubi stack job."


  # ═══ cire stack, production: cire-api with its database and buckets, the guest site, and the organiser portal, the vendor portal and the marketing site ═══
  stack-cire-production:
    name: Alchemy cire stack — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.stack_cire == 'true' && needs.build.result == 'success' && needs.sites.result == 'success' && needs.alchemy-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production-cire
      cancel-in-progress: false
    outputs:
      # False when the deploy, the compare or the secret check after it
      # failed: a Worker whose new version may not have uploaded, or that
      # lost a secret, must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' && steps.kept.outcome == 'success' }}
      cire_api_healthy: ${{ steps.smoke_cire_api.outcome == 'success' }}
      cire_invites_healthy: ${{ steps.smoke_cire_invites.outcome == 'success' }}
      cire_host_healthy: ${{ steps.smoke_cire_host.outcome == 'success' }}
      cire_vendor_healthy: ${{ steps.smoke_cire_vendor.outcome == 'success' }}
      cire_landing_healthy: ${{ steps.smoke_cire_landing.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The cire stack's tree and the API Worker it bundles and migrates,
      # and no cache: the cache is shared with jobs that hold no secret.
      - name: Install the cire stack's dependencies
        run: bun install --frozen-lockfile --filter @cire/infra --filter @cire/api

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Fetch the approved plans
        uses: actions/download-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/approved

      # Each surface's production host, which its smoke check asks.
      - name: Production hosts
        id: hosts
        run: bun run --cwd shared/infra production-hosts

      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # `deploy --yes` upgrades or bootstraps the state store without asking;
      # this refuses one that is not as this Alchemy expects before the plan
      # reads it. The plan itself runs without --yes, so it upgrades nothing.
      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" --tier production cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains the Workers hold now: the guard holds the domain
      # change to the one approved, as it holds the plan.
      - name: Read the cire Workers' custom domains
        id: worker_domains
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains.json" --tier production cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The adopted resources as they are now; the check after the deploy
      # compares the secret names live then with these.
      - name: Read the cire stack's adopted resources live
        id: live
        working-directory: cire/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The plan approved at alchemy-plan may be hours old. Plan again, with
      # the force the deploy uses, and deploy only what the guard allows and
      # what equals the approved plan.
      - name: Plan the cire stack again
        id: plan
        working-directory: cire/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/cire.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire plan log, as the step failed
        if: ${{ failure() && steps.plan.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/cire.log"

      # A refusal fails the job here, before anything writes.
      - name: Guard the plan, and hold it to the approved one
        id: guard
        working-directory: cire/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/cire.log" --out "$RUNNER_TEMP/plan-guard/cire.json" --domains "$RUNNER_TEMP/domains.json" --live "$RUNNER_TEMP/live.json" --approved "$RUNNER_TEMP/approved/cire.json" ${SCHEDULED:+--scheduled}
        env:
          # A release started by its schedule adds no host to a Worker.
          SCHEDULED: ${{ github.event_name == 'schedule' && 'yes' || '' }}

      # Wrangler is the database's one migrator, and applies what is pending
      # before the Worker version that needs it uploads. A migration file is
      # in cire_api's own paths, so a release that does not ship it has nothing
      # to apply. Idempotent; production is never reset and never seeded.
      - name: Apply cire D1 migrations (remote prod)
        id: migrate
        if: needs.plan.outputs.cire_api == 'true'
        run: bun run --cwd cire/db db:migrate:prod
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The stack refuses to deploy unless OSN_DEPLOY_TIER and both
      # credentials are set, and each build was made for production. It
      # uploads no secret: production's stay on the Workers.
      - name: Deploy the cire stack
        id: deploy
        working-directory: cire/infra
        run: bun run deploy:production ${FORCE:+--force} > "$RUNNER_TEMP/alchemy.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire deploy log, as the step failed
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/alchemy.log"

      # Change counts alone to the run summary, never a line of the log.
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack cire "$RUNNER_TEMP/alchemy.log"

      # Runs after a deploy that failed part-way too, so a Worker it managed
      # to upload is still checked, and rolled back if it fails.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" --tier production cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Every secret name live before the deploy must be live after it: the
      # upload keeps the secrets it does not name. Cloudflare returns no
      # value, so a lost secret cannot be put back from here; this names it
      # at once and stops every record.
      - name: Check every secret live before the deploy is live after it
        id: kept
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        working-directory: cire/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live-after.json" --kept "$RUNNER_TEMP/live.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Five minutes: a check, its rollback and the re-check, with every
      # request at its timeout, take 186 s. A site PRODUCTION_HOST_HOLDS
      # holds off probes nothing: its check reads that the held host is off
      # its Worker (scripts/smoke-check.ts).
      - name: Smoke check cire/api, rolling back on failure
        id: smoke_cire_api
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_api production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_api_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_api_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/invites, rolling back on failure
        id: smoke_cire_invites
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_invites production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_invites_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_invites_deployment }}
          SMOKE_MARKETING_ORIGIN: ${{ steps.hosts.outputs.cire_landing_origin }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/host, rolling back on failure
        id: smoke_cire_host
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_host production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_host_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_host_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/vendor, rolling back on failure
        id: smoke_cire_vendor
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_vendor production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_vendor_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_vendor_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/landing, rolling back on failure
        id: smoke_cire_landing
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_landing production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_landing_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.kept.outcome == 'failure' || steps.smoke_cire_api.outcome == 'failure' || steps.smoke_cire_invites.outcome == 'failure' || steps.smoke_cire_host.outcome == 'failure' || steps.smoke_cire_vendor.outcome == 'failure' || steps.smoke_cire_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check or the secret check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── cire stack's record jobs ──────────────────────────────────────────────
  # One per surface. Each runs when the stack job deployed, kept every
  # secret, and its surface's check passed, and leaves that surface's
  # Deployment record in `production-records`, named for the surface:
  # scripts/release-plan.ts reads records by job name.
  record-cire-api:
    name: Record cire/api — production
    needs: [stack-cire-production]
    if: ${{ !cancelled() && needs.stack-cire-production.outputs.deployed == 'true' && needs.stack-cire-production.outputs.cire_api_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "cire-api deployed and passed its smoke check in this run's cire stack job."

  record-cire-invites:
    name: Record cire/invites — production
    needs: [stack-cire-production]
    if: ${{ !cancelled() && needs.stack-cire-production.outputs.deployed == 'true' && needs.stack-cire-production.outputs.cire_invites_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "cire-invites deployed and passed its smoke check in this run's cire stack job."

  record-cire-host:
    name: Record cire/host — production
    needs: [stack-cire-production]
    if: ${{ !cancelled() && needs.stack-cire-production.outputs.deployed == 'true' && needs.stack-cire-production.outputs.cire_host_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "cire-host deployed and passed its smoke check in this run's cire stack job."

  record-cire-vendor:
    name: Record cire/vendor — production
    needs: [stack-cire-production]
    if: ${{ !cancelled() && needs.stack-cire-production.outputs.deployed == 'true' && needs.stack-cire-production.outputs.cire_vendor_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "cire-vendor deployed and passed its smoke check in this run's cire stack job."

  record-cire-landing:
    name: Record cire/landing — production
    needs: [stack-cire-production]
    if: ${{ !cancelled() && needs.stack-cire-production.outputs.deployed == 'true' && needs.stack-cire-production.outputs.cire_landing_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "cire-landing deployed and passed its smoke check in this run's cire stack job."


