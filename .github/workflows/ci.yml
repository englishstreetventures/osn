name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each group of pull requests on the commit it would
  # land as. Migrations from two pull requests meet for the first time there,
  # so the migration order check below has to run on it.
  merge_group:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job here reads the checkout and reports through the check run the
# workflow already owns. Nothing writes an issue, a comment, a release or a
# package, so the default token — which is write-all on a repository that has
# not been switched over — is far more than the work needs, and a compromised
# dependency running inside a job inherits whatever the token can do. The
# deploy, release and secret workflows already declare their own; this one was
# the gap.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    # Bounded because the lint-warning guard installs a second dependency tree
    # on pull requests, which can wait on the registry.
    timeout-minutes: 10
    steps:
      # Depth 2 so a pull request's merge commit arrives with both parents:
      # the lint-warning guard below compares it with HEAD^1, the base it
      # was merged against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # This is the job that runs `bun run lint` below, which executes the
      # vendored anti-slop plugin (oxlintrc.json's jsPlugins). `script-tests`
      # runs this same check, but in parallel with this job — so it verifies
      # the tree independently of, not before, the run that matters. This
      # copy has to come before oxlint actually runs it, hence first step
      # after checkout, before install.
      - name: Verify vendored anti-slop matches its checksums
        run: bash scripts/verify-vendored-anti-slop.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      # The Alchemy tree (@shared/infra and the @<product>/infra stacks) is
      # about 100 packages and over 1 GB unpacked, and only a job that builds,
      # tests or type-checks those packages loads it; every other job installs
      # without them.
      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      - name: Lint
        run: bun run lint

      # The step above exits 0 whatever the warning count is — oxlintrc.json
      # puts every non-correctness category at `warn`, so it only proves no
      # error-level rule fired. This is its own step, after Lint rather than
      # folded into it, so "a rule errored" and "the warning count moved"
      # read as two different failures rather than one step failing for
      # either reason. scripts/lint-warning-ceiling.txt is the single source
      # of truth for the number; see that file and
      # scripts/guard-lint-warnings.sh's own comment.
      #
      # On a pull request it also holds the merge to the warning count of
      # its first parent, HEAD^1 (measured with that commit's own toolchain),
      # so a branch fails when it adds warnings even while the ceiling on
      # main has not yet been lowered. A count below the ceiling passes;
      # release.yml lowers the ceiling on main after the merge.
      - name: Guard the lint-warning ceiling
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash scripts/guard-lint-warnings.sh --base HEAD^1
          else
            bash scripts/guard-lint-warnings.sh
          fi

      # The guard's own test, run against small fixture projects and git
      # repositories with fixture ceiling files (LINT_WARNING_ROOT /
      # LINT_WARNING_CEILING_FILE) rather than this repo's real tree, so it
      # neither depends on nor perturbs the real warning count. It still runs
      # the REAL oxlint binary from this checkout's own node_modules
      # (LINT_WARNING_OXLINT_BIN), and two cases install oxlint into a
      # fixture, which is why it lives here — after Install dependencies —
      # rather than in the script-tests job, which does no `bun install` on
      # purpose. Those installs can reach the registry, so on a pull request
      # it runs only when something it exercises changed; it runs on every
      # push to main. A merge-queue group skips it: each pull request in the
      # group already ran it when it touched what the test exercises.
      - name: Test the lint-warning ceiling guard
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            echo "Merge-queue group: each pull request ran this when it needed to; skipped."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 HEAD -- \
            scripts/guard-lint-warnings.sh scripts/lint-warning-count.ts \
            scripts/tests/guard-lint-warnings.test.sh package.json bun.lock .bun-version; then
            echo "Nothing the guard's test exercises changed in this pull request; skipped."
            exit 0
          fi
          bash scripts/tests/guard-lint-warnings.test.sh

      - name: Format check
        run: bun run fmt:check

      # Astro routes every file under `src/pages`, so an un-prefixed `*.test.ts`
      # there is built and deployed as a live route (which is exactly how
      # cire/invites' Worker picked up 119 KB gzip of vitest). Needs no build
      # and no per-app baseline, so it belongs in the fast job rather than
      # `build-test`.
      - name: Check for routable test files under src/pages
        run: bun run scripts/check-astro-test-routes.ts

      # Tests live in tests/ at each package root. A test under a workspace's
      # src/ either runs where nobody looks for it or, in a Vitest project that
      # includes only tests/**, runs nowhere while reading as coverage. A
      # directory walk over every workspace: no build, no baseline.
      - name: Check for test files under any workspace's src/
        run: bun run scripts/check-tests-outside-src.ts

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The Astro sites' `typecheck` runs `tsc --runExternalCode`, which starts
      # `@astrojs/ts-content-mapper` as `node dist/server.js`. Pinned here so the
      # mapper runs on a known Node rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Keyed on the commit, not the lockfile. `actions/cache` will not
      # overwrite an entry whose key already exists, so a cache keyed on
      # `bun.lock` is written once and then frozen: every later run on the same
      # lockfile restores that first snapshot, misses on everything that has
      # changed since, and saves nothing back. The cache aged out of usefulness
      # while still reporting a hit. A unique primary key forces a save each
      # run and the prefix restore-key still pulls the most recent one, so the
      # cache follows the branch instead of the dependency list.
      #
      # The Chromium cache below is left on `bun.lock` deliberately — the
      # browser version IS a function of the lockfile, so an exact hit there
      # genuinely has nothing new to write.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-check-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      # `scripts/` is in no workspace, so `turbo typecheck` never reaches it and a
      # type error there ships.
      #
      # It lives here rather than in `script-tests` because that job does no
      # `bun install` on purpose, and `scripts/tsconfig.json` inherits
      # `types: ["bun-types"]` from the root — without the install, `bun check` fails
      # on the missing type package rather than on the code.
      - name: Type check the scripts
        run: bun check --no-script -p scripts/tsconfig.json

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # The backstop under the per-step timeouts below. Without it the job's
    # ceiling is GitHub's six hours, which is long enough for one stuck runner
    # to hold up a day of review.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      # `@cire/vendor`, `@cire/host` and `@cire/landing` declare
      # `provider: fontProviders.google()`, which makes `astro build` fetch
      # `https://fonts.google.com/metadata/fonts` — Astro's own font
      # metadata cache for that fetch lives at each package's default
      # `cacheDir`, `node_modules/.astro`. None of
      # this job's other caches cover it: the bun cache above only holds
      # installed packages, and the turbo cache is keyed per-commit on
      # purpose (see the `typecheck` job's comment on why) so it can't be
      # the thing that survives across runs here. What decides whether this
      # cache is still correct is which font families each config asks for,
      # not the lockfile or the commit — so, following the same reasoning
      # the other caches in this file use (key on whatever the cache's
      # correctness actually depends on), this one is keyed on the three
      # `astro.config.mjs` files. Restoring it turns most CI runs' font
      # fetch into a cache hit, which is directly the fix for #128: a build
      # that never has to call `fonts.google.com` can't be broken by that
      # endpoint 403ing.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # A bundle can grow by a whole library with nobody noticing: the
      # cire/invites SSR Worker bundle once reached 470 KB gzip, with an
      # animation library in the server module graph that nothing there
      # called. `bun run build` above already produced every app's `dist/`, so
      # checking it here costs a few seconds and shows the result on the pull
      # request, before it merges.
      #
      # Two different outcomes. An app over its budget gets a ::warning::
      # annotation on this run and the job stays green: the budget watches
      # growth and is not a hard cap, so a warning is read and acted on (find
      # what is newly reachable, or re-baseline) rather than blocking the
      # merge. Everything else the script refuses fails the job, and with it
      # the `ci` gate: a source map anywhere an app is served publicly, a
      # missing or empty `dist/`, a symlink in what it measures, a missing or
      # malformed budgets file.
      #
      # cire/invites is the only `output: "server"` app (a Worker,
      # `dist/server`); the other five are `output: "static"` (Cloudflare
      # Pages, `dist/_astro/*.js` + `dist/_astro/*.css` only — see
      # scripts/guard-bundle-size.sh's own comment for why static measures an
      # allowlist rather than a directory). Every app's mode and threshold is
      # a row in scripts/bundle-size-budgets.txt, not an argument here — that
      # file is the single source of truth, and `--all` walks every row in it.
      # See that file's own comment for the re-baselining steps, and
      # wiki/conventions/bundle-size-guards.md for every app's reading.
      #
      # This reads the `dist/` each build step already made and takes well
      # under a second per app, so it sits after Test deliberately: a refusal
      # fails the job either way, and running it last means the author still
      # gets the test result in the same round trip.
      - name: Check Astro app bundle sizes and refuse public source maps
        run: ./scripts/guard-bundle-size.sh --all

      # Each API's d1-integration.test.ts lives under `tests/d1/` (cire's under
      # `tests/db/`); `@shared/realtime`'s tests/d1/hub.test.ts joins this lane
      # for the same reason, though it covers TopicHub on workerd rather than
      # D1. The vitest packages EXCLUDE that path, so the step above never
      # reaches them — they import `bun:test` and boot a real workerd, neither
      # of which vitest can load. cire/api runs a bare `bun test`, which takes
      # no exclude and discovers recursively, so its copy runs in both steps;
      # that is pre-existing and harmless. The D1 files are the only coverage
      # of the ASYNCHRONOUS D1 driver that dev/staging/prod actually run on,
      # and going unrun let zap's rot into a stale fixture that had been
      # failing silently. Serial by necessity — concurrent Miniflare workerd
      # instances contend and fail spuriously (the root script pins
      # --concurrency=1).
      - name: D1 integration tests
        run: bun run test:d1

      # The browser tier (`*.browser.test.tsx`) runs in a real Chromium, because
      # jsdom computes no CSS and no layout — so stacking order, sticky
      # positioning, Tailwind's compiled output and the reduced-motion clamp are
      # all invisible to `bun run test`. Split out for the same reason as the D1
      # step above: it needs a dependency the default path doesn't, and keeping
      # it separate leaves the fast tier fast.
      #
      # `--with-deps` used to do both halves of the install in one line: an apt
      # install of Chromium's shared libraries, and a ~150MB download of the
      # browser itself. On ubuntu-latest the browser alone is not enough, so
      # both have to happen — but neither half had a timeout, and a step with no
      # timeout inherits the job's, which is six hours. On 2026-08-19 one of them
      # stalled and every open PR's Build & Test sat in `pending` behind it for
      # most of a day, with no log to read because a job's logs only appear once
      # it ends. Three changes, all aimed at that:
      #
      #   * the halves are separate steps, so a stall names which half stalled;
      #   * each is bounded, so a stall is a red X in ten minutes instead of a
      #     wedged runner;
      #   * the download half is cached on the lockfile, so the usual run never
      #     makes it. The system libraries are not cacheable (apt writes into the
      #     image, not the workspace) and are reinstalled each run.
      #
      # Only chromium is installed — the tier pins a single instance, so pulling
      # Firefox and WebKit too would be ~3x the download for nothing.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Both installs run from `cire/host`, and the working directory is the
      # whole point. `playwright` is a devDependency of `cire/host` and
      # `cire/invites`, not of the root, so `bunx playwright` at the repo root
      # finds nothing local and fetches the latest release from npm — which
      # then installs the browser revision *that* version wants, not ours.
      #
      # That was harmless right up until it wasn't. The workspace pins
      # playwright 1.62.1, and 1.62.1 was npm's latest from 2026-07-30 until
      # 1.63.0 shipped on 2026-09-04 — so for five weeks the wrong lookup
      # returned the right answer. From 1.63.0 on it installs chromium 1243
      # while the tests look for chromium_headless_shell 1234, and
      # `test:browser` fails with "Executable doesn't exist" on a run whose
      # install step just reported success and downloaded 186.8 MiB.
      #
      # Existing branches did not fail, which is the misleading part: GitHub
      # Actions scopes a cache to the branch that wrote it plus the default
      # branch, so every branch with a Chromium cache from before 2026-09-04
      # still restores revision 1234 and passes. Only a branch with no cache
      # of its own falls through to a fresh install and sees this. Those
      # caches expire, so without this fix the failure arrives on every
      # branch in turn, main included.
      - name: Install Chromium's system libraries
        timeout-minutes: 10
        working-directory: cire/host
        run: bunx playwright install-deps chromium

      - name: Install Chromium for browser tests
        timeout-minutes: 10
        working-directory: cire/host
        run: bunx playwright install chromium

      - name: Browser tests
        run: bun run test:browser

  script-tests:
    name: Scripts
    runs-on: ubuntu-latest
    # The backstop under this job's own checks. Without it the job's ceiling
    # is GitHub's six hours — and because the aggregate `ci` job `needs` it,
    # and `CI` is a required check, a wedged runner here holds the merge gate
    # open for that long. Five minutes is generous: the job does a checkout,
    # a shasum, and `bun test ./scripts/` with no install.
    timeout-minutes: 5
    steps:
      # Two commits deep so a pull request's merge commit has its base,
      # `HEAD^1`, for the migration order check below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # No bun needed, so it runs right after checkout. The `lint` job runs
      # this same script too, and that copy is the one that matters for
      # ordering (see the comment there). This one stays because `script-tests`
      # is the job that owns everything under scripts/, and a shasum costs
      # nothing.
      #
      # One script, two halves. Half 1 — the tree matches its own SHA256SUMS —
      # always runs. Half 2 needs a base ref to diff against, so it only runs
      # where there is one: it catches a change to vendored source with no
      # matching move of the pinned upstream commit in that directory's
      # README, which is either an edit to code the README says is never
      # edited or a re-vendor that forgot the pin. Both are invisible to
      # `shasum -c`, because regenerating the manifest certifies whatever the
      # tree now holds.
      - name: Verify vendored anti-slop matches its checksums
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-vendored-anti-slop.sh

      # `actions/checkout` clones at depth 1, so the base commit has to be
      # fetched before the guard can read it. One `--depth=1` fetch of that
      # single commit is enough: the guard diffs two trees, which needs no
      # common ancestor between them.
      - name: Verify vendored anti-slop matches its checksums and pin
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          bash scripts/verify-vendored-anti-slop.sh "$BASE_SHA"

      # The guard's own tests, beside the run that uses it. They exercise it in
      # throwaway git repos rather than this checkout — one case exports
      # GIT_DIR the way git does for every hook, the state that once made the
      # guard list the whole repo instead of the vendored subtree and blocked
      # every local commit; others build a base and a head commit to drive the
      # pin half. They run on every event, unlike the pin half itself.
      - name: Test the vendored anti-slop guard
        run: bash scripts/tests/verify-vendored-anti-slop.test.sh

      # release.yml's commit step runs only on main, after a merge, so this is
      # the one place its staging and message choice are seen to work before
      # then. Throwaway repositories with a bare remote; git only.
      - name: Test the release commit script
        run: bash scripts/tests/release-commit.test.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # A migration is named by when it was generated, so one generated before
      # another can merge after it: the dev tier then applies it after main's
      # files, while a database built from zero, or a daily release catching
      # up, applies everything in name order. Both orders must apply and leave
      # one schema. On a pull request the files it adds are those on its merge
      # commit's second side (`HEAD^1` is the base it merges into); in the merge
      # queue they are everything since the queue's base. No install: the
      # script imports bun:sqlite and sibling scripts only.
      - name: Check new migrations apply in either order
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$QUEUE_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
            base="$QUEUE_BASE"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          bun run scripts/check-migration-orders.ts --base "$base"

      # `scripts/` is not a workspace, so `turbo test` never reaches it and the
      # tests under it ran nowhere: `test:migration` was declared in the root
      # package.json and called by no workflow, so the throttle and backfill
      # tests had never run in CI at all. They do now, along with the tests of
      # every deploy guard under scripts/ — the D1 ledger and database-id
      # checks, the smoke check and the release planner — whose failure mode
      # when weakened is *passing*, so they run on every PR, not just when
      # someone remembers.
      #
      # (The changeset gate's two shell tests live in changeset-check.yml
      # instead, beside the job whose scripts they self-test.)
      #
      # The `./` in `bun test ./scripts/` is load-bearing. A bare `scripts/` is
      # a SUBSTRING filter on the test path, not a directory, so it also picks
      # up `cire/api/tests/scripts/remint-family-codes.test.ts` — which imports
      # drizzle and effect and therefore needs an install this job does not do.
      # `./scripts/` anchors to the directory.
      #
      # No `bun install` on purpose: the files under scripts/ import nothing
      # but `bun:test`, Bun/Node built-ins, and each other, so an install here
      # would be a minute spent on nothing.
      - name: Test the scripts
        run: bun run test:scripts

      # The guard's own tests run in the step above; this step runs it against
      # this repo's real vitest configs. Both halves are needed — a test suite
      # over synthetic fixtures proves the guard works, not that the tree it is
      # guarding still passes it.
      - name: Check jest-dom suppression markers
        run: bun run check:jest-dom-markers

      # A prior version of this job ran `checkReleaseAgeExcludes` only from
      # `bun test`, which imports the pure function and feeds it synthetic
      # TOML — the `import.meta.main` CLI block (the part that reads the real
      # `bunfig.toml`) is false under `bun test` and so never ran here, while
      # `bunfig.toml`'s own comment and the changeset that added this script
      # both claimed CI enforced it. It did not. This step is what actually
      # makes that true: the CLI test above proves the wiring works in
      # general, this step proves it against this repo's own bunfig.toml.
      - name: Check release-age excludes are marked and bounded
        run: bun run check:release-age-excludes

      # The guard's own tests run in "Test the scripts"; this runs it against
      # the committed package scripts, workflows and stack files.
      - name: Check Alchemy usage
        run: bun run check:alchemy-usage

      # The pre-push hook's `audit-ignores` check, run against the committed
      # lefthook.yml: it fails once a `--ignore` in the `audit` command has
      # outlived its `# DROP AFTER <GHSA id> <YYYY-MM-DD>` marker, or when the
      # command or the keys around it change shape. It reads the file only. It
      # does not run `bun audit`, which runs nowhere but the local pre-push
      # hook, so a push with `--no-verify` or from a machine without lefthook
      # is not audited. Invoked by path for the reason given at the D1 guard
      # below.
      - name: Check audit ignores are marked and bounded
        run: bun run scripts/check-audit-ignores.ts

      # The same split as the step above, for the same reason. The tests in the
      # step further up feed the guard synthetic migration chains and prove it
      # measures and fails correctly; this runs it against the chain the repo
      # really ships, which is the thing a pull request changes.
      #
      # What it guards: a from-zero rebuild of the cire D1 costs rows in
      # proportion to the number of schema statements in the chain, not to the
      # amount of data, and that number only grows. Thirteen merges spent
      # 104,091 rows written on 2026-09-09 against a free-tier ceiling of
      # 100,000 a day account-wide, with no commit doing anything wrong
      # (englishstreetventures/osn#979). The budget is a row in
      # scripts/d1-migration-cost-budgets.txt, not an argument here.
      #
      # It needs no install: the script imports bun:sqlite and Node built-ins
      # and nothing else, which is why it belongs in this job rather than in
      # build-test. Invoked by path, like guard-bundle-size.sh, rather than
      # through a root package.json script — root package.json is off the
      # changeset allowlist on purpose, and this change ships nothing any
      # versioned package would name.
      - name: Guard the D1 cost of the migration chains
        run: bun run scripts/guard-d1-migration-cost.ts --all

      # The trace-redaction guard's tests run in "Test the scripts"; this runs
      # it against the committed Worker configs. Every staging and production
      # tier must redact query strings in Cloudflare logs and native traces, and
      # no API Worker may trace there, because its paths carry ids and slugs. The
      # API deploy jobs have no step of their own, so this is the check that
      # covers them. No install: the script reads files with Bun built-ins.
      - name: Check Worker configs redact query strings
        run: bun run scripts/check-trace-redaction.ts

  openapi-freshness:
    name: OpenAPI Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      - name: Regenerate OpenAPI documents
        run: |
          bun run --cwd pulse/api openapi:generate
          bun run --cwd osn/api openapi:generate

      # Fails if a committed document drifts from what the route
      # definitions currently produce — the Swift client generator consumes
      # the committed files directly, so a stale spec would ship silently.
      - name: Check for drift
        run: git diff --exit-code shared/openapi/

  # The end-to-end suite (`tools/e2e`): boots osn-api, pulse-api, cire-api and
  # five frontends on their PORTLESS=0 ports, drives Chromium through each
  # product's flows, and runs the whole thing twice so a results.json that
  # differs between runs fails here rather than in someone's review. Not in the
  # `ci` aggregator's `needs` yet, so it reports without gating merges while it
  # earns trust; promote it once it has a record of staying green.
  e2e:
    name: E2E
    # Not one of `ci`'s needs, so nothing reads its result on a merge-queue
    # group, and the push to main that follows runs it on the same commit.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Playwright's runner runs under Node; the launcher and the APIs under Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      # The same cache and the same two bounded halves as the browser tier in
      # `build-test`, for the same reasons (see the comments there). Run from
      # `tools/e2e`, whose pinned `@playwright/test` decides which Chromium
      # revision gets installed.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium's system libraries
        timeout-minutes: 10
        working-directory: tools/e2e
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        timeout-minutes: 10
        working-directory: tools/e2e
        run: bunx playwright install chromium

      - name: E2E flows, twice, results.json compared byte for byte
        timeout-minutes: 15
        run: bun run test:e2e:repro

      # Traces, screenshots, results.json and server logs from the second run,
      # on failure too: a red run is exactly when a reviewer needs them.
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14

  # The migration workflow end to end: `db:generate` on parallel branches of
  # copies of cire's and osn's real schemas (cire/db's migration-flow), and
  # timestamped migrations applied by the real wrangler to a local D1 that
  # already holds the chain and to one built from zero (cire/api's
  # migrate-wrapper). Several minutes of drizzle-kit and wrangler runs that
  # test no package's own code, so they are a job of their own rather than
  # part of every package's tests and every deploy. Both write the ledgers,
  # schemas and verdicts they end with to e2e-artifacts/migrations/.
  migration-flow:
    name: Migration workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      - name: db:generate across parallel branches
        timeout-minutes: 12
        run: bun run --cwd cire/db test:migration-flow

      - name: Timestamped migrations on a local D1
        timeout-minutes: 6
        run: bun run --cwd cire/api test:migration-flow

      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-artifacts
          path: e2e-artifacts/migrations/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # Bounded: one checkout, one pinned gitleaks download, a bare clone and a
    # scan. Ten minutes is the backstop, not an estimate.
    timeout-minutes: 10
    steps:
      # Full history, so the base commit of a pull request is present and the
      # policy file on origin/main can be read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test the secret scan
        run: bash scripts/tests/secret-scan.test.sh

      # The scanner that runs is main's copy once main has one, so a pull request
      # cannot edit the gate it is checked by. The first pull request that adds the
      # scanner runs its own copy, since main does not have one yet.
      - name: Take the scanner from main
        run: |
          if git cat-file -e refs/remotes/origin/main:scripts/secret-scan.sh 2>/dev/null; then
            git show refs/remotes/origin/main:scripts/secret-scan.sh > "$RUNNER_TEMP/secret-scan.sh"
          else
            cp scripts/secret-scan.sh "$RUNNER_TEMP/secret-scan.sh"
          fi

      - name: Parse this change's policy file
        run: |
          if [ -f .gitleaks.toml ]; then bash "$RUNNER_TEMP/secret-scan.sh" check-config .gitleaks.toml; fi

      - name: Scan this change
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SECRET_SCAN_REPORT: ${{ runner.temp }}/secret-scan.json
        run: |
          # A push to main scans what it added; a pull request or a merge-queue
          # group scans its merge commit against the first parent, which is the
          # base it lands on.
          if [ "$EVENT" = push ]; then BASE="$BEFORE"; else BASE=$(git rev-parse HEAD^1); fi
          bash "$RUNNER_TEMP/secret-scan.sh" range "$BASE" HEAD

      - name: Upload the redacted report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/secret-scan.json
          if-no-files-found: ignore

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, build-test, script-tests, openapi-freshness, migration-flow, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All CI jobs passed"
