name: Domain move rehearsal

# Rehearses a production domain move on the dev account alone, before the
# first flip release moves a production site's host (wiki/shared/production-deploy.md
# §5.7). A host of the dev zone, domain-move.<DEV_DOMAIN>, goes on a
# throwaway Pages project, then moves to a Worker and back through the code a
# flip release runs: scripts/pages-domain.ts's reach check, detach and attach,
# and an Alchemy deploy that moves the Worker's custom domain from its spare
# host, next.domain-move.<DEV_DOMAIN>, to the moved host and back. Then
# everything the run made is removed. Each job records what Cloudflare
# answered and when (scripts/domain-move-rehearsal.ts); the report job merges
# the records into the `domain-move-rehearsal-attempt-<n>` artifact and the
# run summary.
#
#   setup-pages ─┬─> pages-on ─┬─> watch ─────────────────────────────────────────┐
#                └─> worker-staged ─┴─> detach ─> flip ─> check ─> unflip ─> attach ─> destroy ─> cleanup ─> report
#
# Credentials, all from the `dev` Environment, which reaches the dev account
# alone and allows `main` alone:
#   CLOUDFLARE_DEV_PAGES_DNS_TOKEN     the dev counterpart of production's Pages
#                                      and DNS token: only the script holds it,
#                                      on a runner that installs nothing or
#                                      before its job's install, and refuses it
#                                      unless it reaches exactly the dev account
#                                      and the DEV_DOMAIN zone.
#   CLOUDFLARE_DEV_PAGES_UPLOAD_TOKEN  Pages Edit alone: Wrangler uploads the
#                                      marker page with it, once the script has
#                                      checked it reaches the dev account and
#                                      no zone.
#   CLOUDFLARE_DEV_ACCOUNT_API_TOKEN   the dev deploy token: the Alchemy steps,
#                                      each after token:check.
# watch and detach also read this run's jobs with the job token.
#
# The rollback (unflip, attach) runs whenever the detach succeeded, after a
# failed flip too, as production's rollback does; destroy, cleanup and report
# run whatever happened, cancellation included. A re-run attempt refuses
# every step but those three: dispatch a new run instead.
#
# scripts/tests/domain-move-rehearsal-workflow.test.ts holds all of this.
on:
  workflow_dispatch:

permissions:
  contents: read

# One rehearsal at a time; the next waits, and none cancels one under way,
# whose cleanup would then not run.
concurrency:
  group: domain-move-rehearsal
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every Alchemy run sends no telemetry.
  DO_NOT_TRACK: "1"

jobs:
  # The run's Pages project and the page it serves. Both Pages tokens are
  # checked, and the project made, before the install; only Wrangler's
  # upload, after it, holds the upload token.
  setup-pages:
    name: Make the Pages project and its marker page
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check the upload token reaches the dev account and no zone
        id: upload_reach
        run: bun run scripts/domain-move-rehearsal.ts upload-reach --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_UPLOAD_TOKEN }}

      - name: Check both hosts are free, then make the run's Pages project
        id: preflight
        run: bun run scripts/domain-move-rehearsal.ts preflight --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_DNS_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      # The root's tree alone, which pins the Wrangler that uploads the page.
      - name: Install the root's dependencies
        run: bun install --frozen-lockfile --filter osn

      - name: Upload the marker page to the run's Pages project
        id: upload
        run: bunx wrangler pages deploy shared/infra/rehearsal/pages --project-name "osn-move-rehearsal-$GITHUB_RUN_ID" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_UPLOAD_TOKEN }}

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-setup-pages-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # The Worker on its spare host, as a staged site's Worker is before its flip.
  worker-staged:
    name: Put the Worker on the spare host
    needs: [setup-pages]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install @shared/infra and its dependencies
        run: bun install --frozen-lockfile --filter @shared/infra

      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Deploy the Worker on the spare host
        id: worker_staged
        run: bun run scripts/domain-move-rehearsal.ts worker-staged --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          OSN_DEPLOY_TIER: dev
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-worker-staged-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # The moved host on the Pages project, as a production site's host is today.
  pages-on:
    name: Put the moved host on Pages
    needs: [setup-pages]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No install: the script imports only the repository's import-free files.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Put the moved host on the run's Pages project
        id: pages_on
        run: bun run scripts/domain-move-rehearsal.ts pages-on --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_DNS_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-pages-on-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # Probes both hosts every 2 s from before the detach until the attach job
  # completes: the timeline the gap and the rollback are read from. Holds no
  # Cloudflare credential; the dev Environment gives it DEV_DOMAIN.
  watch:
    name: Watch the moved host
    needs: [pages-on]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Probe both hosts until the attach job completes
        id: watch
        run: bun run scripts/domain-move-rehearsal.ts watch --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          GITHUB_TOKEN: ${{ github.token }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-watch-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # pages-domain.ts's detach on a fresh runner with nothing installed, as a
  # flip release's flip-detach job runs it, once the watch job is watching.
  # The host is on neither side from here until the flip's deploy.
  detach:
    name: Take the moved host off Pages
    needs: [worker-staged, pages-on]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Wait until the watch job is watching
        id: wait_watch
        run: bun run scripts/domain-move-rehearsal.ts wait-watch --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          GITHUB_TOKEN: ${{ github.token }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Take the moved host and its CNAME off the Pages project
        id: detach
        run: bun run scripts/domain-move-rehearsal.ts detach --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_DNS_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-detach-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # The flip's deploy: install, check the token, then Alchemy moves the
  # Worker's custom domain from the spare host to the moved host, as a flip
  # release's stack job does after its detach job.
  flip:
    name: Move the host to the Worker
    needs: [detach]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install @shared/infra and its dependencies
        run: bun install --frozen-lockfile --filter @shared/infra

      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Deploy the Worker on the moved host
        id: flip
        run: bun run scripts/domain-move-rehearsal.ts flip --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          OSN_DEPLOY_TIER: dev
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-flip-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # What a release's precheck reads of a flipped host: it must read `free`.
  check:
    name: Check the moved host reads free
    needs: [flip]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Read where the moved host is
        id: check
        run: bun run scripts/domain-move-rehearsal.ts check --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_DNS_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-check-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # The rollback's first half, as an unflip release does it: the Worker gives
  # up the moved host and takes its spare host back.
  unflip:
    name: Take the host off the Worker
    needs: [detach, flip, check]
    if: ${{ !cancelled() && needs.detach.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install @shared/infra and its dependencies
        run: bun install --frozen-lockfile --filter @shared/infra

      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Deploy the Worker back on the spare host
        id: unflip
        run: bun run scripts/domain-move-rehearsal.ts unflip --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          OSN_DEPLOY_TIER: dev
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-unflip-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # The rollback's second half: pages-domain.ts's attach on a fresh runner
  # with nothing installed, as a release's attach-pages-domain job runs it.
  attach:
    name: Put the host back on Pages
    needs: [detach, unflip]
    if: ${{ !cancelled() && needs.detach.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Put the moved host and its CNAME back on the Pages project
        id: attach
        run: bun run scripts/domain-move-rehearsal.ts attach --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_DNS_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-attach-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # Removes the rehearsal Worker and its custom domains whatever happened.
  destroy:
    name: Destroy the rehearsal Worker
    needs: [setup-pages, worker-staged, pages-on, detach, flip, check, unflip, attach]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install @shared/infra and its dependencies
        run: bun install --frozen-lockfile --filter @shared/infra

      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Destroy the rehearsal Worker and its domains
        id: destroy
        run: bun run scripts/domain-move-rehearsal.ts destroy --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          OSN_DEPLOY_TIER: dev
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-destroy-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # Removes every rehearsal Pages project and its CNAMEs at the two hosts,
  # nothing else, whatever happened.
  cleanup:
    name: Remove the rehearsal's Pages projects and records
    needs: [setup-pages, worker-staged, pages-on, detach, flip, check, unflip, attach, destroy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Remove the rehearsal's Pages projects and CNAMEs
        id: cleanup
        run: bun run scripts/domain-move-rehearsal.ts cleanup --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DEV_PAGES_DNS_TOKEN }}
          BUN_CONFIG_DNS_TIME_TO_LIVE_SECONDS: "1"

      - name: Keep the job's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-cleanup-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/
          retention-days: 90

  # Merges every job's record into one artifact and the run summary. Holds
  # no credential; the dev Environment gives it DEV_DOMAIN.
  report:
    name: Report the rehearsal
    needs: [setup-pages, worker-staged, pages-on, watch, detach, flip, check, unflip, attach, destroy, cleanup]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Fetch every job's record
        uses: actions/download-artifact@v4
        with:
          pattern: rehearsal-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/rehearsal

      - name: Merge the records and work out the intervals
        id: report
        run: bun run scripts/domain-move-rehearsal.ts report --out "$RUNNER_TEMP/rehearsal"
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

      - name: Keep the rehearsal's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: domain-move-rehearsal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal/domain-move-rehearsal.json
          retention-days: 90
