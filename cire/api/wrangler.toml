name = "cire-api"
main = "src/entry.ts"
compatibility_date = "2025-03-01"
# `nodejs_compat_populate_process_env` is what makes `process.env` reflect this
# file's [vars] + the Worker's secrets. It is only a DEFAULT for
# compatibility_date >= 2025-04-01; this Worker is pinned to 2025-03-01, so
# without listing it explicitly `process.env` is permanently EMPTY on workerd.
# That is not cosmetic: `@shared/observability`'s `loadConfig` reads
# `process.env.OSN_ENV`, so every deployed tier resolved as `local` — local log
# format and debug level in production. Opting the flag in by name (rather than
# bumping the compatibility date on a live Worker) changes exactly this one
# behaviour and nothing else.
#
# Note it populates LAZILY, on first access to `process`, and never during
# module evaluation — so a config parsed at module top level still sees nothing.
# See src/observability.ts (lazy `Layer.suspend`) and the `OSN_ENV` binding read
# in src/index.ts.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Refuse to publish the top-level (env-less) config to a *.workers.dev URL. This
# block carries the PRODUCTION D1 binding but a local security posture
# (WEB_ORIGIN=localhost, no prod secrets), so a bare `wrangler deploy` would
# otherwise create a public shadow Worker with full read/write on prod guest
# PII. With no top-level routes, a bare deploy now fails loudly. Real deploys go
# through `--env production` (custom_domain routes below); CI's
# `d1 migrations apply` still uses this block's DB binding and is unaffected.
workers_dev = false

# The one daily cron. Daily 04:00 UTC — off-peak for the AU/EU guest audience,
# low contention with normal traffic. It runs every maintenance job in
# `scheduled` (src/index.ts): the session sweeps, guest-data retention, the
# wedding purge, the two R2 orphan reconcilers and the rest, all in one
# invocation. Add a job there rather than a second trigger.
[triggers]
crons = ["0 4 * * *"]

# Cloudflare Workers Logs / invocations. `enabled = true` persists the Worker's
# logs (and invocation records) in the dashboard under
# Workers & Pages → cire-api → Observability / Logs. Free + low-overhead.
# `head_sampling_rate = 1` logs 100% of requests — correct at our current low
# volume; drop it (e.g. 0.1) only if we ever approach the Workers Logs daily
# ingest cap. See [[wiki/shared/free-tier-limits]] (Monitoring section).
# Named tiers state their own trace and URL-redaction posture below.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.traces]
enabled = true
head_sampling_rate = 1

# Invocation records are OFF: each one stores the request URL, and the public
# image and invite routes carry the wedding slug (the couple's names) in the path.
# Application logs stay on and never name the slug. Each named tier states this
# explicitly.
[observability.logs]
invocation_logs = false

[vars]
# Deployment tier — local | dev | staging | production. Read two ways: through
# `process.env` by `@shared/observability`'s `loadConfig` (log format + level),
# and straight off the request-scoped binding by `isDeployedTier()` in
# src/index.ts, which fail-closes the guest claim endpoint when the native
# CLAIM_RATE_LIMITER binding is missing. Set it in EVERY env block — named
# environments inherit no vars, and an absent value silently means `local`,
# which switches that fail-closed guard OFF. This top-level block carries the
# local posture (localhost origins), so `local` is the honest value here.
OSN_ENV = "local"
WEB_ORIGIN = "http://localhost:4321"
OSN_JWKS_URL = "http://localhost:4000/.well-known/jwks.json"
OSN_ISSUER_URL = "http://localhost:4000"
OSN_AUDIENCE = "osn-access"
# Organiser sign-in (OIDC). CIRE_API_ORIGIN builds the redirect URI, which must
# be one of the client's registered `redirect_uris` byte-for-byte. The client
# SECRET is never a var: locally put CIRE_OIDC_CLIENT_SECRET in `.dev.vars`
# (gitignored), in a deployed tier use `wrangler secret put`. All four absent ⇒
# /api/auth/oidc/* answers 503 and nothing else changes.
CIRE_API_ORIGIN = "http://localhost:8787"
CIRE_OIDC_CLIENT_ID = "cid_cire"
ZAP_API_URL = "http://localhost:3002"
# Internal back-channel organiser-session revoke endpoint
# (POST /internal/revoke-organiser-sessions). osn-api presents this shared
# secret as `Authorization: Bearer` when an account signs out everywhere else or
# revokes cire's connection, so the cire organiser session ends then instead of
# waiting out its 7-day TTL. NEVER a committed var — locally put
# CIRE_INTERNAL_REVOKE_SECRET in `.dev.vars` (gitignored); in a deployed tier use
# `wrangler secret put CIRE_INTERNAL_REVOKE_SECRET`. Absent, or shorter than 32
# characters ⇒ the endpoint is disabled (503). The SAME value must be
# provisioned on the osn-api side.
#
# CIRE_OPS_EMAIL — the operator address for the daily "vendor claims are
# waiting for review" reminder and the R2 orphan reconcilers' alerts
# (src/index.ts `scheduled`). A SECRET, never a
# committed var: this repo is public and the address is a person's. Locally put
# it in `.dev.vars`; in a deployed tier `wrangler secret put CIRE_OPS_EMAIL`.
# Absent (or no RESEND_API_KEY) ⇒ no reminder or alert; the cron's log lines
# remain.
#
# CIRE_MEMBER_STEP_EXCLUDED_WEDDING_IDS — comma-separated wedding ids whose
# households get the household member step ("Who are you?", reply attribution,
# member_required, "Answered by") only while `cire.account-linking` is on for
# them (src/lib/account-linking.ts `memberStepOn`). A SECRET, never a committed
# var: a wedding id is the couple's, not this public repo's — and a name
# declared here could not also be a secret. Unset or empty ⇒ every guest
# household gets the step. In a deployed tier:
#   bunx wrangler secret put CIRE_MEMBER_STEP_EXCLUDED_WEDDING_IDS --env production
# An isolate reads it once, when it builds the app, and logs the number of ids
# ("member step exclusion loaded", never the ids). Set it before the release
# that deploys the code reading it; a later change needs a redeploy — a run of
# production-release.yml with `force` and surface `cire_api`. Local dev
# (`bun run dev`, src/local.ts) never reads it: every household gets the step.
#
# RESEND_API_URL — NEVER set in any tier here, as a var or a secret. It points
# Resend mail at a local emulator and belongs in `.dev.vars` / `.env` only. A
# deployed tier refuses it: mail stops and the Worker logs
# "email disabled: Resend misconfigured". The production deploy refuses to run
# while it exists as a secret, and tests/lib/resend-email.test.ts fails if a
# tier here sets it. See wiki/shared/email.md.

# ── Stripe (KEY-OPTIONAL throughout) ─────────────────────────────────────────
# TWO relationships with Stripe, and they are opposites. Keeping them apart is
# the point of everything below.
#
# GIFTS are Connect. The couple are the merchant of record: a contribution is a
# DIRECT charge on their own connected account, so the money goes from the
# guest's card to their bank and cire never holds it. Holding gift funds, even
# in transit, is money transmission — this is the line that keeps the platform
# on the right side of it.
#
# UPGRADES are a platform checkout. When a host buys a locked module, cire IS
# the merchant and the charge is the platform's own. That is a different
# relationship with different obligations, and it is why the two have separate
# endpoints rather than one route with a branch: a Stripe endpoint is scoped
# either to the platform or to connected accounts, they carry different signing
# secrets, and a verifier holds exactly one.
#
# STRIPE_SECRET_KEY UNSET ⇒ neither the organiser Connect routes nor the upgrade
# routes are mounted, so a deployment with no Stripe account has no payment
# surface at all rather than one that 500s. The portal does not probe for this:
# it shows the Money-gifts section on every deployment, and on one with no key
# its Connect button gets a 404, which it reports as the toast "Money gifts
# aren't available on this site yet."
# STRIPE_WEBHOOK_SECRET UNSET ⇒ /api/stripe/webhook does not exist (gifts).
# STRIPE_PLATFORM_WEBHOOK_SECRET UNSET ⇒ /api/stripe/platform-webhook does not
# exist (upgrades), so a purchase could be paid and never granted — nothing else
# moves a purchase off `pending`.
# Nothing else authenticates either endpoint — the signature IS the
# authentication — so without a signing secret neither may be reachable.
#
#   bunx wrangler secret put STRIPE_SECRET_KEY --env production
#   bunx wrangler secret put STRIPE_WEBHOOK_SECRET --env production
#   bunx wrangler secret put STRIPE_PLATFORM_WEBHOOK_SECRET --env production
#
# All three are SECRETS, never [vars]: the API key can move money, and a signing
# secret is what stops anyone else's body being believed. The two webhook
# secrets come from DIFFERENT endpoints in the Stripe dashboard; reusing one for
# both means every delivery to the other is refused.
#
# STRIPE_ACCOUNT_COUNTRY is an ordinary var (default "AU" in code). Stripe fixes
# an account's country at creation, so it is a per-deployment default rather
# than something a couple can change later.
# STRIPE_ACCOUNT_COUNTRY = "AU"
#
# STRIPE_UPGRADE_PRICE_* are ordinary vars too — Price ids, not secrets. A plan
# tier with no Price id here is NOT FOR SALE in that deployment: absent from the
# catalogue, 404 from the checkout route. CRIMSON_FROM_GOLD is a second Price on
# the Crimson product, charged to a wedding already on Gold; unset, a Gold
# wedding is not offered Crimson at all. Absent configuration never means free. The AMOUNT
# lives at Stripe and is read back from it, so changing what an upgrade costs is
# a dashboard change plus a var rather than a deploy, and no price is duplicated
# here to drift from what customers are charged.
# Named envs inherit NO vars, so each tier below declares its own.

# ── GrowthBook feature flags (KEY-OPTIONAL) ──────────────────────────────────
# GROWTHBOOK_CLIENT_KEY UNSET ⇒ @shared/feature-flags serves every flag's coded
# default (src/index.ts FLAGS registry) with ZERO network — the state before a
# GrowthBook account exists, so this ships safely inert. Set the key to activate
# live evaluation. The SDK client key is low-sensitivity (it authorises reading
# the public feature payload, not writing), so it can live as a [vars] entry OR
# a secret — use a secret if you'd rather keep it out of git:
#   bunx wrangler secret put GROWTHBOOK_CLIENT_KEY --env production
# GROWTHBOOK_API_HOST defaults to https://cdn.growthbook.io in code; pinned here
# for clarity and to make a self-hosted/proxy swap a one-line change.
GROWTHBOOK_API_HOST = "https://cdn.growthbook.io"
# GROWTHBOOK_CLIENT_KEY = "sdk-xxxxxxxx"   # set after creating the GrowthBook SDK connection

# ── R2 orphan reconcilers' tier-wide switch ──────────────────────────────────
# "false" runs the daily cron's two R2 orphan reconcilers (cire-assets and
# cire-sheets, src/services/r2-reconcile.ts); "true" leaves both out of
# `scheduled` (src/index.ts, parsed by `reconcileDisabled`, which treats any
# value but "false" as off), logs "r2 reconcile disabled by
# CIRE_R2_RECONCILE_DISABLED" and emails CIRE_OPS_EMAIL each run. Every other
# cron job — retention, the wedding purge, the session sweeps — still runs.
# It changes only with a reviewed deploy of this file, so it suits switching a
# tier off for good, not an emergency.
#
# To stop a reconciler now — before a cire-db restore — put `reconcile/stop` in
# its bucket, which no deploy touches (wiki/compliance/backup-dr.md):
#   printf 'restore\n' | bunx wrangler r2 object put <bucket>/reconcile/stop --pipe --remote
# and delete it to resume. A dashboard edit of this var is written back by the
# next deploy of the tier. Never make it a secret: a secret cannot share a name
# with a declared var.
#
# Declared in every tier below (named envs inherit no vars), and
# tests/services/r2-reconcile.test.ts fails unless each holds "false" or "true".
CIRE_R2_RECONCILE_DISABLED = "false"

# Native Cloudflare Workers Rate Limiting binding for the pre-auth claim
# endpoint. Enforced globally + atomically at the edge — unlike the
# per-isolate in-memory limiter it replaces. `simple.limit`/`simple.period`
# mirror the in-memory default (5 attempts / 60s); `period` must be 10 or 60.
# `namespace_id` is an arbitrary stable integer scoping this limiter; bump it
# only to deliberately reset the counter namespace.
[[unsafe.bindings]]
name = "CLAIM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The guest SESSION-RESTORE limiter (`GET /api/claim/session`). Deliberately a
# separate namespace from CLAIM_RATE_LIMITER above: that one is a 5/min
# brute-force budget for a credential surface, while this route is hit on every
# invite page load by a household that already holds a session — sharing the
# budget would make a household behind one NAT 429 itself just by reloading.
# 60/60 mirrors the in-memory default in `createApp` and osn's oidcSessionLimiter.
[[unsafe.bindings]]
name = "CLAIM_SESSION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# The registry link-preview limiter. This route fetches a URL the caller typed,
# so the budget is what stops it being used to hammer a third party — and an
# in-memory counter can't do that, because it counts per isolate and Cloudflare
# will give a busy caller more than one. 10/60 mirrors the in-memory default.
[[unsafe.bindings]]
name = "REGISTRY_PREVIEW_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# The registry image-copy limiter. Separate namespace from the preview above: a
# picked image is one download plus one R2 write, and an organiser filling in a
# gift list legitimately previews several pages per image they keep, so sharing
# one budget would 429 the honest path.
[[unsafe.bindings]]
name = "REGISTRY_IMAGE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# The link picker's thumbnails. Its own namespace: each call is one outbound
# fetch plus one Images transform, and one preview offers up to six candidates,
# so 60/60 is six thumbnails for each preview the 10/60 above allows.
# 60/60 mirrors `defaultRegistryThumbLimiter` in src/app.ts.
[[unsafe.bindings]]
name = "REGISTRY_THUMB_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

# The guest registry write limiter — claiming and releasing a gift. Its own
# namespace because it belongs to a different population: the two above are the
# organiser building a list, this one is every guest of every wedding, and a
# guest party hitting the ceiling must not stop the couple editing. Wider at
# 20/60 because claiming several gifts in one sitting is the honest path.
# 20/60 mirrors `defaultRegistryGuestLimiter` in src/app.ts.
[[unsafe.bindings]]
name = "REGISTRY_GUEST_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

# Realtime push hub: `@shared/realtime`'s `TopicHub`, exported from
# src/entry.ts, one Durable Object per wedding topic. Named environments do NOT
# inherit this binding — it is redeclared under [env.production]; the dev
# Worker's binding is declared in the cire stack (cire/infra).
[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "TopicHub"

# The hub class and its storage backend. SQLite is the only backend on the
# Workers Free plan; the hub stores nothing, but a class must still declare
# one. Named environments inherit top-level migrations, so this is declared
# once, here. A deployed migration is never edited or removed — a change to
# the class list is a new entry with a new tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TopicHub"]

[[d1_databases]]
binding = "DB"
database_name = "cire-db"
database_id = "6e835474-e0a7-4db9-8883-3247c3c891cd"
migrations_dir = "../db/migrations"

# R2 bucket for the organiser change flow: each `imports` row's uploaded sheets
# (or editor draft) and, once applied, its before-image. Guest PII. Objects no
# row names are reaped by the daily cron (src/services/sheet-reconcile.ts),
# which keeps its place in `reconcile/imports-position.json` — a key, a
# timestamp, a row count and how many runs a hold has lasted, no guest data —
# and stops while `reconcile/stop` is in the bucket. Created 2026-06-17 — if
# you ever rebuild the account from scratch:
#   bunx wrangler r2 bucket create cire-sheets
[[r2_buckets]]
binding = "SHEETS"
bucket_name = "cire-sheets"

# R2 bucket for invite-builder images (hero / story photos). Separate from
# SHEETS: binary content, served publicly through the API, different retention.
# Objects no row names are reaped by the daily cron
# (src/services/asset-reconcile.ts), which keeps its place in
# `reconcile/assets-position.json` — a key, a timestamp, a row count and how
# many runs a hold has lasted, never served — and stops while `reconcile/stop`
# is in the bucket.
# Created 2026-06-15 — if you ever rebuild the account from scratch:
#   bunx wrangler r2 bucket create cire-assets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "cire-assets"

# Cloudflare Images binding — transforms the R2 invite-image originals into
# responsive, modern-format (WebP/AVIF) variants on the public serve path
# (GET /api/invite/:slug/image/:slot). The serve route falls back to the raw R2
# bytes when this binding is absent (local `wrangler dev` / miniflare / tests) or
# a transform fails, so it never 500s on a transform miss. The Images product
# must be enabled on the Cloudflare account before deploy (transformations are
# billed per unique transformation — see the human note in the PR).
[images]
binding = "IMAGES"

# ── GrowthBook payload cache (OPTIONAL) ──────────────────────────────────────
# Cross-isolate cache for the GrowthBook SDK payload. ABSENT ⇒ each isolate keeps
# its own in-memory cache (still correct — just re-fetches once per cold isolate
# per TTL). Present ⇒ isolates share one cached payload, cutting CDN fetches. The
# feature-flag helper degrades gracefully either way, so this is a pure
# optimisation. Create the namespace then uncomment with the real id:
#   bunx wrangler kv namespace create KV_GB_PAYLOAD
# [[kv_namespaces]]
# binding = "KV_GB_PAYLOAD"
# id = "<paste-namespace-id>"

# ═══ production tier ═════════════════════════════════════════════════════════
# Deployed only after the manual approval on the `production` GitHub Environment.
[env.production.vars]
# Deployment tier — see the top-level [vars] note. Named envs inherit NO vars,
# so this must be set here or the production Worker resolves `local`: local log
# format/level, and `isDeployedTier()` returns false so a missing
# CLAIM_RATE_LIMITER binding stops fail-closing the guest claim endpoint.
OSN_ENV = "production"
# Comma-separated allowlist (index.ts splits on "," and trims). Entry 0 is the
# guest site (`invite.cireweddings.com`); the organiser portal origin
# (`host.cireweddings.com`) MUST also be present or organiser writes to
# /api/organiser/* fail the CORS origin guard with 403.
# Domain reshuffle 2026-07-16: guest → `invite.`, organiser → `host.`, apex →
# landing. Only the two origins that call this API remain: the guest site
# (`invite.`) and the organiser portal (`host.`). The transitional `cireweddings.com`
# (apex — now the static marketing landing, makes no API calls) and
# `app.cireweddings.com` (old organiser origin) were pruned after the cutover.
WEB_ORIGIN = "https://invite.cireweddings.com,https://host.cireweddings.com,https://vendor.cireweddings.com"
# OSN identity (osn-api) prod origin — served on its own zone at id.musubi.social
# (moved off id.cireweddings.com 2026-07-27). OSN_ISSUER_URL MUST equal osn-api's
# own OSN_ISSUER_URL or access-token verification fails, so these two flip in the
# same deploy as osn-api's; OSN_JWKS_URL is that origin + the JWKS path.
OSN_JWKS_URL = "https://id.musubi.social/.well-known/jwks.json"
OSN_ISSUER_URL = "https://id.musubi.social"
OSN_AUDIENCE = "osn-access"
# Organiser sign-in (OIDC). One registered redirect URI serves all three
# organiser-facing origins — where the browser finally lands rides in cire's own
# transaction cookie, so `host.`, `vendor.` and `invite.` share this callback.
# Set the matching secret once per tier:
#   bunx wrangler secret put CIRE_OIDC_CLIENT_SECRET --env production
CIRE_API_ORIGIN = "https://api.cireweddings.com"
CIRE_OIDC_CLIENT_ID = "cid_cire"
ZAP_API_URL = "https://zap.cireweddings.com"
# Internal back-channel organiser-session revoke secret (see the top-level [vars]
# note). Provision as a secret, matching the value osn-api holds:
#   bunx wrangler secret put CIRE_INTERNAL_REVOKE_SECRET --env production
# Absent or shorter than 32 characters ⇒ POST /internal/revoke-organiser-sessions
# answers 503 (disabled).
# Operator address for the daily vendor-claim reminder (secret, see the
# top-level [vars] note). Absent ⇒ no reminder, only the cron's log line:
#   bunx wrangler secret put CIRE_OPS_EMAIL --env production
# Weddings kept off the household member step unless `cire.account-linking` is
# on for them (secret, see the top-level [vars] note). Absent ⇒ every household:
#   bunx wrangler secret put CIRE_MEMBER_STEP_EXCLUDED_WEDDING_IDS --env production
# GrowthBook feature flags (KEY-OPTIONAL) — see the top-level [vars] note. Named
# envs do NOT inherit top-level [vars], so GROWTHBOOK_API_HOST is redeclared
# here; set GROWTHBOOK_CLIENT_KEY (var or `wrangler secret put ... --env
# production`) to activate live evaluation in prod.
GROWTHBOOK_API_HOST = "https://cdn.growthbook.io"
# GROWTHBOOK_CLIENT_KEY = "sdk-xxxxxxxx"
# R2 orphan reconcilers on — see the top-level [vars] note.
CIRE_R2_RECONCILE_DISABLED = "false"
# No bootstrap-owner config is needed: every authenticated OSN user is a
# first-class organiser who creates their own weddings via
# POST /api/organiser/weddings, with per-wedding access scoped by
# weddingOwner()/weddingMember() — there is no global boot gate or seeded owner.
# Self-serve upgrade prices — LIVE-mode Price ids here, test-mode ones in the
# dev tier. A test id in production fails at checkout. Unset ⇒ nothing is for
# sale: the catalogue is empty and every checkout 404s, so the locked modules
# keep offering an upgrade nobody can complete. Setting these is part of
# turning the feature on.
# STRIPE_UPGRADE_PRICE_GOLD = "price_..."
# STRIPE_UPGRADE_PRICE_CRIMSON = "price_..."
# STRIPE_UPGRADE_PRICE_CRIMSON_FROM_GOLD = "price_..."

# Mirror of the top-level [triggers] block — named environments do NOT inherit
# it, so without this the daily expired-session sweep would be registered only on
# the never-deployed top-level config and never run in production. Keep the
# schedule in sync with the top-level block.
[env.production.triggers]
crons = ["0 4 * * *"]

# Custom-domain route: serves cire-api on api.cireweddings.com. `custom_domain =
# true` auto-provisions DNS + edge cert because the cireweddings.com zone is in
# this Cloudflare account. Named envs do NOT inherit top-level routes, so this
# applies only to `wrangler deploy --env production`.
[[env.production.routes]]
pattern = "api.cireweddings.com"
custom_domain = true

# Wrangler named environments do NOT inherit top-level [[d1_databases]] /
# [[r2_buckets]] / [[unsafe.bindings]] — they must be redeclared per-env.
# Without these, `wrangler deploy --env production` ships with no DB/R2 (worker
# fail-closes 503 at index.ts) and no CLAIM_RATE_LIMITER (the claim endpoint
# loses its edge rate limit). Keep these in sync with the top-level bindings.
[[env.production.unsafe.bindings]]
name = "CLAIM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[env.production.unsafe.bindings]]
name = "CLAIM_SESSION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[env.production.unsafe.bindings]]
name = "REGISTRY_PREVIEW_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[env.production.unsafe.bindings]]
name = "REGISTRY_IMAGE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

[[env.production.unsafe.bindings]]
name = "REGISTRY_THUMB_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

[[env.production.unsafe.bindings]]
name = "REGISTRY_GUEST_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

[[env.production.durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "TopicHub"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cire-db"
database_id = "6e835474-e0a7-4db9-8883-3247c3c891cd"
migrations_dir = "../db/migrations"

[[env.production.r2_buckets]]
binding = "SHEETS"
bucket_name = "cire-sheets"

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "cire-assets"

# Mirror of the top-level [images] binding — named environments do NOT inherit
# top-level bindings (see the binding-inheritance note above), so the Images
# binding must be redeclared here or `wrangler deploy --env production` ships
# without it and every serve falls back to the un-transformed R2 original.
[env.production.images]
binding = "IMAGES"

# Mirror of the top-level GrowthBook payload cache (OPTIONAL) — named envs do NOT
# inherit top-level [[kv_namespaces]]. Uncomment with the same namespace id (or a
# separate prod namespace) once created. Absent ⇒ per-isolate in-memory cache.
# [[env.production.kv_namespaces]]
# binding = "KV_GB_PAYLOAD"
# id = "<paste-namespace-id>"

# Production logs stay on while native traces await URL review.
[env.production.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.production.observability.traces]
enabled = false

[env.production.observability.logs]
invocation_logs = false

# ── OpenTelemetry export ─────────────────────────────────────────────────────
# Read by `@shared/observability` `loadConfig` (the
# `nodejs_compat_populate_process_env` flag at the top of this file is what
# populates `process.env` from these [vars] + secrets). With the endpoint UNSET,
# tracing + metrics are a true no-op (zero export attempts) — so leaving this
# commented out keeps local/dev safe. Set the base OTLP/HTTP endpoint to turn
# export on; `@shared/observability` appends `/v1/traces` + `/v1/metrics` itself.
#
#   OTEL_SERVICE_NAME            non-secret, can live in [vars] (defaults to "cire-api")
#   OTEL_EXPORTER_OTLP_ENDPOINT  non-secret base URL, e.g. Grafana Cloud OTLP gateway
#   OTEL_EXPORTER_OTLP_HEADERS   SECRET — carries the auth token, never commit it
#
# Non-secret placeholders (uncomment + set the real endpoint before deploy):
#   OTEL_SERVICE_NAME = "cire-api"
#   OTEL_EXPORTER_OTLP_ENDPOINT = "https://otlp-gateway-<region>.grafana.net/otlp"
#
# The headers carry a bearer/basic auth token → provision as a Worker SECRET,
# NOT a committed var:
#   bunx wrangler secret put OTEL_EXPORTER_OTLP_HEADERS --env production
#     value: "authorization=Basic <base64(instanceID:apiToken)>"
