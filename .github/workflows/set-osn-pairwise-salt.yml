# One-shot operator workflow: set the OSN_PAIRWISE_SALT Worker secret on an
# osn-api deployment — production, or the dev tier.
#
# WHY THIS EXISTS. The OIDC provider derives every pairwise `sub` from this
# salt (HMAC over sector | profile id). The boot check is FAIL-CLOSED: without
# the secret, osn-api refuses to serve outside local — so a deploy that lands
# before the salt is set leaves the issuer host (id.musubi.social since 2026-07-27,
# id-dev.musubi.social on dev) down until it exists — every route, not just the
# OIDC ones. And the salt must NEVER change once tokens are live: rotation makes
# every relying party see its users as strangers, permanently. That holds on dev
# too — a rotated dev salt orphans every dev connection, which is exactly the
# failure the dev tier is supposed to catch before prod, not reproduce.
#
# Accordingly this workflow:
#   - is manual only (workflow_dispatch) and runs under the GitHub Environment
#     matching the chosen tier, so that tier's protection rules apply;
#   - is IDEMPOTENT AND REFUSES TO ROTATE — if the secret already exists it
#     exits successfully without touching it. There is deliberately no force
#     input; if rotation is ever truly required (pre-launch only!), do it by
#     hand with `wrangler secret put` so the decision cannot be a misclick;
#   - generates the value in-job (64 random bytes, base64) and never prints
#     it. The salt is not a key that needs escrow: it exists only inside
#     Cloudflare, exactly like the other osn-api Worker secrets.
#
# Each tier gets its OWN salt. They are unrelated values and must stay that way:
# a shared salt would make a dev `sub` equal the prod `sub` for the same account,
# so a dev relying party could be pointed at prod and recognise real users.
name: Set OSN_PAIRWISE_SALT (osn-api, one-shot)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which osn-api deployment to set the salt on
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

jobs:
  set-salt:
    name: Set pairwise salt if absent
    runs-on: ubuntu-latest
    # Same Environments the deploy pipeline uses, so `production` still requires
    # its reviewer before a job can reach the prod Cloudflare token.
    environment: ${{ inputs.tier }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: Set OSN_PAIRWISE_SALT if absent (never rotates)
        working-directory: osn/api
        env:
          # Pick the token by tier explicitly rather than relying on the
          # Environment to shadow a repo-level secret: the two are named
          # differently so landing in the wrong Environment fails on an empty
          # token instead of quietly writing to the other tier.
          CLOUDFLARE_API_TOKEN: ${{ inputs.tier == 'dev' && secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          # Capture the listing into a variable FIRST, so a failing `wrangler
          # secret list` aborts here under `set -e`. Piping it straight into an
          # `if` condition would not: a command used as a condition is exempt
          # from `set -e`, and `pipefail` only sets the pipeline's status, which
          # the `if` then swallows. An expired token or a typo'd tier would look
          # exactly like "the secret is absent" — and the next two lines would
          # ROTATE a live salt, which permanently orphans every OIDC connection.
          # Failing closed is the whole point of this step.
          existing="$(bunx wrangler secret list --env "$TIER")"
          if printf '%s\n' "$existing" | grep -q '"OSN_PAIRWISE_SALT"'; then
            echo "OSN_PAIRWISE_SALT is already set on $TIER — refusing to rotate. Nothing to do."
            exit 0
          fi
          echo "OSN_PAIRWISE_SALT is absent on $TIER — generating and setting (value is never printed)."
          SALT="$(openssl rand -base64 64 | tr -d '\n')"
          echo "::add-mask::${SALT}"
          printf '%s' "${SALT}" | bunx wrangler secret put OSN_PAIRWISE_SALT --env "$TIER"
          echo "Done. osn-api ($TIER) will pick the secret up without a redeploy."
