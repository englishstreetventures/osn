name: Deploy

# The dev tier: every push to main deploys the dev stacks it changed, into the
# dev Cloudflare account, unattended. Production is not deployed here — it
# ships in releases from production-release.yml, which compares each surface
# with what production runs and waits for one approval.
#
# Triggers:
#   - push to `main` (after a merge)
#   - manual `workflow_dispatch` (deploys every dev stack), with three inputs:
#       smoke_fail        one dev surface's smoke check fails on purpose: the
#                         dry run of the rollback path
#       expect_no_change  each stack job fails unless its deploy planned no
#                         change: the proof that a second deploy is a no-op
#       force             every resource is re-uploaded, unchanged ones too
#
# Shape of a run:
#
#   changes ──┐
#             ├──> stack-<stack>-dev ──> deploy-<surface>-dev  (one per surface)
#   build ────┘
#
# `build` re-runs the same install + build + test CI does, so nothing ships
# from a broken tree. `changes` computes one boolean per dev surface and one
# per stack from the push diff, so a landing-page tweak deploys one stack.
#
# Each stack job deploys one Alchemy stack whole, at stage `dev`: musubi/infra
# (osn-api, musubi social, musubi landing), cire/infra (cire-api and the four
# cire sites), zap/infra (zap-api), pulse/infra (pulse landing). In order, it
#   1. derives every dev host from the dev Environment's DEV_DOMAIN variable
#      (`dev-hosts`) and builds the stack's sites against those hosts;
#   2. checks that the dev token reaches the dev account, and of zones only
#      the dev domain's (`token:check`), before any other step holds it;
#   3. records each Worker's newest deployment (scripts/worker-deployments.ts
#      snapshot), deploys the stack, then names the deployment the deploy made
#      for each Worker, or `unchanged` when it uploaded none (compare);
#   4. runs scripts/smoke-check.ts for every surface of the stack. A failing
#      check rolls back the deployment this run made, never one it did not,
#      and the job fails once every surface has been checked.
# A Worker a smoke check rolled back still matches Alchemy's state, so the next
# run's snapshot sees the rollback and deploys with --force, re-uploading what
# the commit declares.
#
# A record job runs only when its stack job's deploy succeeded and its own
# surface's check passed, and does nothing else: it leaves the run's one dev
# Deployment record for that surface, under the job name
# scripts/release-plan.ts reads to hold a production release until the same
# content passed on dev. scripts/deploy-surfaces.ts holds the job ids and
# names; scripts/tests/deploy-workflows.test.ts holds this file to it.
#
# Credentials: the dev account's id and token (CLOUDFLARE_DEV_ACCOUNT_ID,
# CLOUDFLARE_DEV_ACCOUNT_API_TOKEN, `dev` Environment secrets) reach the token
# check, the deploy step and the steps that read or roll back deployments:
# snapshot, compare and the smoke checks. Worker secrets reach the deploy step alone. No install or
# build step holds either; the guest site's build reads ASTRO_KEY, which is
# neither. shared/infra/tests/workflow-secrets.test.ts holds this.
# See [[wiki/shared/dev-environment]].
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_fail:
        description: "Dry run of the rollback path: this dev surface's smoke check fails on purpose, so its stack job goes red, rolling the Worker back when this run uploaded it. Every other surface deploys and is checked as usual."
        type: choice
        options:
          [
            none,
            cire_api,
            cire_invites,
            osn_api,
            zap_api,
            cire_host,
            cire_vendor,
            cire_landing,
            osn_social,
            musubi_landing,
            pulse_landing,
          ]
        default: none
      expect_no_change:
        description: "Fail each stack job unless its deploy planned no change"
        type: boolean
        default: false
      force:
        description: "Re-upload every resource, even unchanged ones"
        type: boolean
        default: false

# Read-only: this workflow deploys to Cloudflare, it never writes to the repo.
permissions:
  contents: read

# Concurrency is set per stack job (below), not here: one group per stack
# (`deploy-dev-<stack>`), so two runs never deploy the same stack at once while
# the other stacks stay parallel.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every Alchemy run sends no telemetry.
  DO_NOT_TRACK: "1"

jobs:
  # ── Path filter ────────────────────────────────────────────────────────────
  # One boolean per dev surface and one per stack, from
  # scripts/deploy-surfaces.ts — the same surface map production-release.yml
  # ships from, so the two tiers cannot disagree about which paths redeploy
  # what. A push redeploys the stacks whose surfaces its diff touches, and a
  # stack whose own infra/ directory (or shared/infra/) changed; anything every
  # surface builds from (shared/, the lockfile, the root build config, this
  # file, the map) redeploys everything. A dispatch, and a push git cannot diff
  # (the all-zero `before` of a first push, the orphan left by a force-push),
  # deploy everything: a wasted deploy costs a minute, a silently skipped one
  # ships a half-updated tier.
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      cire_api: ${{ steps.filter.outputs.cire_api }}
      cire_invites: ${{ steps.filter.outputs.cire_invites }}
      cire_host: ${{ steps.filter.outputs.cire_host }}
      cire_vendor: ${{ steps.filter.outputs.cire_vendor }}
      cire_landing: ${{ steps.filter.outputs.cire_landing }}
      osn_api: ${{ steps.filter.outputs.osn_api }}
      osn_social: ${{ steps.filter.outputs.osn_social }}
      musubi_landing: ${{ steps.filter.outputs.musubi_landing }}
      zap_api: ${{ steps.filter.outputs.zap_api }}
      pulse_landing: ${{ steps.filter.outputs.pulse_landing }}
      stack_musubi: ${{ steps.filter.outputs.stack_musubi }}
      stack_cire: ${{ steps.filter.outputs.stack_cire }}
      stack_zap: ${{ steps.filter.outputs.stack_zap }}
      stack_pulse: ${{ steps.filter.outputs.stack_pulse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No install: the script imports only Bun and Node built-ins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bun run scripts/deploy-surfaces.ts --event "$EVENT_NAME" --base "$BEFORE_SHA"

  # ── Gate ─────────────────────────────────────────────────────────────────
  # Re-run install + build + test before any deploy. If this fails, every
  # stack job below is skipped (they `needs: build`), and so every record job.
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for why this is keyed on the three
      # astro.config.mjs files rather than bun.lock or github.sha — Astro's
      # font-metadata cache is a function of which families each config
      # asks for, and restoring it here turns this workflow's own `bun run
      # build` into a cache hit against fonts.google.com too
      # (englishstventures/osn-tracker#128).
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Gate the deploy on the async-D1-driver lane too — these tests sit
      # outside the vitest include glob, so `bun run test` doesn't reach them,
      # and D1 is exactly what this workflow is about to deploy against.
      # Serial: concurrent Miniflare workerd instances contend.
      - name: D1 integration tests
        run: bun run test:d1

  # ═══ musubi stack: osn-api, musubi social, musubi landing ══════════════════
  # osn-api is the identity issuer, with its own D1 database, seeded with the
  # cire OIDC client and cire-api's ARC key from what the cire_seed step
  # derives from three cire secrets.
  # musubi social's host is the WebAuthn RP ID and osn-api's cookie domain, so
  # a dev passkey is a separate credential from a production one and no dev
  # sign-in can touch a real account.
  stack-musubi-dev:
    name: Alchemy musubi stack — dev
    needs: [build, changes]
    if: needs.changes.outputs.stack_musubi == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    concurrency:
      group: deploy-dev-musubi
      cancel-in-progress: false
    outputs:
      # False when the deploy or the compare failed: a Worker whose new
      # version may not have uploaded must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' }}
      osn_api_healthy: ${{ steps.smoke_osn_api.outcome == 'success' }}
      osn_social_healthy: ${{ steps.smoke_osn_social.outcome == 'success' }}
      musubi_landing_healthy: ${{ steps.smoke_musubi_landing.outcome == 'success' }}
    steps:
      - name: Refuse force with expect_no_change
        if: ${{ inputs.force == true && inputs.expect_no_change == true }}
        run: |
          echo "::error::force re-uploads every resource, so a plan can never be 'no changes'. Dispatch one or the other."
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # turbo hashes each dev build's PUBLIC_*, VITE_* and SITE values, so the
      # `build` job's cache never holds a dev build. This stack's own cache
      # does: a site whose files and dev values are unchanged replays its
      # last build instead of building again. Keyed on the commit so each run
      # saves, falling back to this stack's newest, then the `build` job's.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-dev-musubi-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-dev-musubi-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-dev-musubi-
            ${{ runner.os }}-turbo-build-

      # musubi landing fetches its font metadata at build time; keyed, as
      # ci.yml's cache is, on the config that names the families.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: musubi/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'musubi/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dev hosts
        id: hosts
        run: bun run --cwd shared/infra dev-hosts -- --stage dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

      # osn-api verifies Turnstile only when it holds TURNSTILE_SECRET_KEY,
      # which its dev secrets leave out; the sitekey ships so the widget
      # renders as it does in production.
      - name: Build musubi/social (dev)
        run: bun run build --filter=@musubi/social
        env:
          VITE_OSN_ISSUER_URL: ${{ steps.hosts.outputs.osn_api_origin }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      - name: Build musubi/landing (dev)
        run: bun run build --filter=@musubi/landing
        env:
          SITE: ${{ steps.hosts.outputs.musubi_landing_origin }}
          PUBLIC_APP_URL: ${{ steps.hosts.outputs.musubi_social_origin }}

      # The dev token must reach the dev account and no other: a token created
      # with "All accounts" or "All zones" by a member of both would reach
      # production too. It must also act on the DEV_DOMAIN zone, so an account
      # id that names production fails here. Every step below that holds the
      # token runs only after this passes.
      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Refuse expect_no_change while a rollback awaits re-upload
        if: ${{ inputs.expect_no_change == true && steps.snapshot.outputs.force == 'true' }}
        run: |
          echo "::error::A smoke check rolled a Worker back, so this run would re-upload it with --force and could not plan 'no changes'. Dispatch Deploy plainly first, then expect_no_change."
          exit 1

      # osn-api's seed stores only the SHA-256 of cire's OIDC client secret
      # and the public half of cire-api's ARC key. This step is the only one
      # that holds those secrets: it writes the hash, the public key and the
      # key id as outputs and prints nothing else. It imports only node
      # built-ins; `--no-install` makes a stray package import fail here
      # rather than be fetched and run beside the secrets.
      - name: Derive osn-api's cire seed values
        id: cire_seed
        run: bun --no-install musubi/infra/scripts/derive-cire-seed.ts
        env:
          CIRE_OIDC_CLIENT_SECRET: ${{ secrets.CIRE_OIDC_CLIENT_SECRET }}
          CIRE_API_ARC_KEY_ID: ${{ secrets.CIRE_API_ARC_KEY_ID }}
          CIRE_API_ARC_PRIVATE_KEY: ${{ secrets.CIRE_API_ARC_PRIVATE_KEY }}

      # The stack refuses to deploy unless OSN_DEPLOY_TIER, both credentials
      # and every required secret below are set, before anything uploads.
      - name: Deploy the musubi stack
        id: deploy
        working-directory: musubi/infra
        run: |
          set -o pipefail
          bun run deploy:dev ${FORCE:+--force} 2>&1 | tee "$RUNNER_TEMP/alchemy.log"
        env:
          FORCE: ${{ (inputs.force == true || steps.snapshot.outputs.force == 'true') && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: dev
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          # osn-api's dev Worker secrets; OSN_TOTP_ENCRYPTION_KEY_PREVIOUS is
          # declared only while it holds a value.
          DEV_LOGIN_SECRET: ${{ secrets.DEV_LOGIN_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          OSN_JWT_PRIVATE_KEY: ${{ secrets.OSN_JWT_PRIVATE_KEY }}
          OSN_JWT_PUBLIC_KEY: ${{ secrets.OSN_JWT_PUBLIC_KEY }}
          OSN_PAIRWISE_SALT: ${{ secrets.OSN_PAIRWISE_SALT }}
          OSN_SESSION_IP_PEPPER: ${{ secrets.OSN_SESSION_IP_PEPPER }}
          OSN_TOTP_ENCRYPTION_KEY: ${{ secrets.OSN_TOTP_ENCRYPTION_KEY }}
          OSN_TOTP_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.OSN_TOTP_ENCRYPTION_KEY_PREVIOUS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          # Read by the stack for osn-api's seed, never uploaded, and none of
          # them secret: the cire_seed step's outputs.
          CIRE_API_ARC_KEY_ID: ${{ steps.cire_seed.outputs.key_id }}
          CIRE_API_ARC_PUBLIC_JWK: ${{ steps.cire_seed.outputs.public_jwk }}
          CIRE_OIDC_CLIENT_SECRET_SHA256: ${{ steps.cire_seed.outputs.client_secret_sha256 }}

      # Change counts and resource names to the run summary; with
      # expect_no_change, fails unless the plan was "no changes".
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack musubi ${EXPECT_NO_CHANGE:+--expect-no-change} "$RUNNER_TEMP/alchemy.log"
        env:
          EXPECT_NO_CHANGE: ${{ inputs.expect_no_change == true && 'yes' || '' }}

      # Runs after a deploy that failed part-way too, so a Worker it managed
      # to upload is still checked, and rolled back if it fails. A Worker it
      # cannot read comes out `unknown` (checked, never rolled back), and
      # this step fails, which leaves `deployed` false.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" osn_api osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # /health and /.well-known/jwks.json.
      - name: Smoke check osn/api, rolling back on failure
        id: smoke_osn_api
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts osn_api dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.osn_api_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.osn_api_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'osn_api' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # The browser hosts sit behind Cloudflare Access. The check sends the
      # service token when both values are set, and fails without rolling
      # back when Access answers in the Worker's place, or when `/` asked
      # without the token gets anything but Access's sign-in redirect.
      - name: Smoke check musubi/social, rolling back on failure
        id: smoke_osn_social
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts osn_social dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.musubi_social_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.osn_social_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'osn_social' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Smoke check musubi/landing, rolling back on failure
        id: smoke_musubi_landing
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts musubi_landing dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.musubi_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.musubi_landing_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'musubi_landing' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.smoke_osn_api.outcome == 'failure' || steps.smoke_osn_social.outcome == 'failure' || steps.smoke_musubi_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── musubi stack's record jobs ─────────────────────────────────────────────
  # Each runs when the stack job deployed and its surface's check passed, and
  # leaves that surface's dev Deployment record, named for the surface:
  # scripts/release-plan.ts reads records by job name.
  deploy-osn-api-dev:
    name: Deploy osn/api — dev
    needs: [stack-musubi-dev]
    if: ${{ !cancelled() && needs.stack-musubi-dev.outputs.deployed == 'true' && needs.stack-musubi-dev.outputs.osn_api_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "osn-api-dev deployed and passed its smoke check in this run's musubi stack job."

  deploy-osn-social-dev:
    name: Deploy musubi/social — dev
    needs: [stack-musubi-dev]
    if: ${{ !cancelled() && needs.stack-musubi-dev.outputs.deployed == 'true' && needs.stack-musubi-dev.outputs.osn_social_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "osn-social-dev deployed and passed its smoke check in this run's musubi stack job."

  deploy-musubi-landing-dev:
    name: Deploy musubi/landing — dev
    needs: [stack-musubi-dev]
    if: ${{ !cancelled() && needs.stack-musubi-dev.outputs.deployed == 'true' && needs.stack-musubi-dev.outputs.musubi_landing_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "musubi-landing-dev deployed and passed its smoke check in this run's musubi stack job."

  # ═══ cire stack: cire-api, the guest site, the three cire sites ════════════
  # cire-api with its D1 database (migrated and seeded by the stack) and
  # buckets; the guest site (Astro SSR, its server entry uploaded as built,
  # its client directory as assets); and the organiser portal, the vendor
  # portal and the marketing site, each a static-assets Worker. Every site's
  # PUBLIC_* values bake in at build time, which is why dev builds its own.
  stack-cire-dev:
    name: Alchemy cire stack — dev
    needs: [build, changes]
    if: needs.changes.outputs.stack_cire == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    concurrency:
      group: deploy-dev-cire
      cancel-in-progress: false
    outputs:
      # False when the deploy or the compare failed: a Worker whose new
      # version may not have uploaded must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' }}
      cire_api_healthy: ${{ steps.smoke_cire_api.outcome == 'success' }}
      cire_invites_healthy: ${{ steps.smoke_cire_invites.outcome == 'success' }}
      cire_host_healthy: ${{ steps.smoke_cire_host.outcome == 'success' }}
      cire_vendor_healthy: ${{ steps.smoke_cire_vendor.outcome == 'success' }}
      cire_landing_healthy: ${{ steps.smoke_cire_landing.outcome == 'success' }}
    steps:
      - name: Refuse force with expect_no_change
        if: ${{ inputs.force == true && inputs.expect_no_change == true }}
        run: |
          echo "::error::force re-uploads every resource, so a plan can never be 'no changes'. Dispatch one or the other."
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # turbo hashes each dev build's PUBLIC_*, VITE_* and SITE values, so the
      # `build` job's cache never holds a dev build. This stack's own cache
      # does: a site whose files and dev values are unchanged replays its
      # last build instead of building again. Keyed on the commit so each run
      # saves, falling back to this stack's newest, then the `build` job's.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-dev-cire-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-dev-cire-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-dev-cire-
            ${{ runner.os }}-turbo-build-

      # The same key and paths as the `build` job's, so this restores the font
      # metadata that job fetched and the three Astro builds below never call
      # fonts.google.com (see ci.yml's `build-test` job for the key).
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dev hosts
        id: hosts
        run: bun run --cwd shared/infra dev-hosts -- --stage dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

      # ASTRO_KEY fixes the key Astro writes into the guest site's server
      # manifest. With it, two builds of one commit are byte-identical and an
      # unchanged commit plans no change; without it every build differs, so
      # the step refuses to run. turbo.json passes it through to the build.
      - name: Build cire/invites (dev)
        run: |
          if [ -z "$ASTRO_KEY" ]; then
            echo "::error::ASTRO_KEY is empty: set it on the dev Environment (make one with 'bunx --bun astro create-key' in cire/invites). Without it every guest-site build differs, and no deploy can plan 'no changes'."
            exit 1
          fi
          bun run build --filter=@cire/invites
        env:
          PUBLIC_API_URL: ${{ steps.hosts.outputs.cire_api_origin }}
          PUBLIC_SITE_URL: ${{ steps.hosts.outputs.cire_invites_origin }}
          PUBLIC_MARKETING_URL: ${{ steps.hosts.outputs.cire_landing_origin }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_EMBED_KEY }}
          ASTRO_KEY: ${{ secrets.ASTRO_KEY }}

      - name: Build cire/host (dev)
        run: bun run build --filter=@cire/host
        env:
          PUBLIC_CIRE_API_URL: ${{ steps.hosts.outputs.cire_api_origin }}
          # Account pages live on the dev identity app: a dev passkey is a
          # different credential from a production one, so this never links
          # to the production account surface.
          PUBLIC_OSN_ACCOUNT_URL: ${{ steps.hosts.outputs.musubi_social_origin }}
          PUBLIC_CIRE_WEB_URL: ${{ steps.hosts.outputs.cire_invites_origin }}

      - name: Build cire/vendor (dev)
        run: bun run build --filter=@cire/vendor
        env:
          PUBLIC_CIRE_API_URL: ${{ steps.hosts.outputs.cire_api_origin }}
          PUBLIC_OSN_ACCOUNT_URL: ${{ steps.hosts.outputs.musubi_social_origin }}

      - name: Build cire/landing (dev)
        run: bun run build --filter=@cire/landing
        env:
          PUBLIC_ORGANISER_URL: ${{ steps.hosts.outputs.cire_host_origin }}
          SITE: ${{ steps.hosts.outputs.cire_landing_origin }}

      # Each site's `build` script runs scripts/guard-bundle-size.sh too, but
      # not when turbo replays a cached build; these check what is about to
      # upload either way (wiki/conventions/bundle-size-guards.md).
      - name: Guard cire/invites SSR bundle size
        run: ./scripts/guard-bundle-size.sh cire/invites

      - name: Guard cire/host bundle size
        run: ./scripts/guard-bundle-size.sh cire/host

      - name: Guard cire/vendor bundle size
        run: ./scripts/guard-bundle-size.sh cire/vendor

      - name: Guard cire/landing bundle size
        run: ./scripts/guard-bundle-size.sh cire/landing

      # The dev token must reach the dev account and no other: a token created
      # with "All accounts" or "All zones" by a member of both would reach
      # production too. It must also act on the DEV_DOMAIN zone, so an account
      # id that names production fails here. Every step below that holds the
      # token runs only after this passes.
      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Refuse expect_no_change while a rollback awaits re-upload
        if: ${{ inputs.expect_no_change == true && steps.snapshot.outputs.force == 'true' }}
        run: |
          echo "::error::A smoke check rolled a Worker back, so this run would re-upload it with --force and could not plan 'no changes'. Dispatch Deploy plainly first, then expect_no_change."
          exit 1

      # The stack refuses to deploy unless OSN_DEPLOY_TIER, both credentials
      # and every required secret below are set, before anything uploads. The
      # database's migrations apply forward on each deploy; a rollback restores
      # the Worker's code, not the database, so a migration must keep working
      # with the Worker version before it.
      - name: Deploy the cire stack
        id: deploy
        working-directory: cire/infra
        run: |
          set -o pipefail
          bun run deploy:dev ${FORCE:+--force} 2>&1 | tee "$RUNNER_TEMP/alchemy.log"
        env:
          FORCE: ${{ (inputs.force == true || steps.snapshot.outputs.force == 'true') && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: dev
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          # The profile given the seeded weddings' owner seat; empty seeds none.
          CIRE_DEV_OWNER_PROFILE_ID: ${{ vars.CIRE_DEV_OWNER_PROFILE_ID }}
          # cire-api's dev Worker secrets; the guest site holds none.
          CIRE_API_ARC_KEY_ID: ${{ secrets.CIRE_API_ARC_KEY_ID }}
          CIRE_API_ARC_PRIVATE_KEY: ${{ secrets.CIRE_API_ARC_PRIVATE_KEY }}
          CIRE_OIDC_CLIENT_SECRET: ${{ secrets.CIRE_OIDC_CLIENT_SECRET }}
          STRIPE_PLATFORM_WEBHOOK_SECRET: ${{ secrets.STRIPE_PLATFORM_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      # Change counts and resource names to the run summary; with
      # expect_no_change, fails unless the plan was "no changes".
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack cire ${EXPECT_NO_CHANGE:+--expect-no-change} "$RUNNER_TEMP/alchemy.log"
        env:
          EXPECT_NO_CHANGE: ${{ inputs.expect_no_change == true && 'yes' || '' }}

      # Runs after a deploy that failed part-way too, so a Worker it managed
      # to upload is still checked, and rolled back if it fails. A Worker it
      # cannot read comes out `unknown` (checked, never rolled back), and
      # this step fails, which leaves `deployed` false.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" cire_api cire_invites cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # GET /api/auth/session, which answers without touching D1.
      - name: Smoke check cire/api, rolling back on failure
        id: smoke_cire_api
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_api dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_api_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_api_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_api' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # The guest site's `/` redirects to the marketing site, which the check
      # needs the origin of. The browser hosts sit behind Cloudflare Access.
      # The check sends the service token when both values are set, and fails
      # without rolling back when Access answers in the Worker's place, or
      # when `/` asked without the token gets anything but Access's sign-in
      # redirect.
      - name: Smoke check cire/invites, rolling back on failure
        id: smoke_cire_invites
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_invites dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_invites_origin }}
          SMOKE_MARKETING_ORIGIN: ${{ steps.hosts.outputs.cire_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_invites_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_invites' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Smoke check cire/host, rolling back on failure
        id: smoke_cire_host
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_host dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_host_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_host_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_host' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Smoke check cire/vendor, rolling back on failure
        id: smoke_cire_vendor
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_vendor dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_vendor_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_vendor_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_vendor' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Smoke check cire/landing, rolling back on failure
        id: smoke_cire_landing
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_landing dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_landing_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_landing' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.smoke_cire_api.outcome == 'failure' || steps.smoke_cire_invites.outcome == 'failure' || steps.smoke_cire_host.outcome == 'failure' || steps.smoke_cire_vendor.outcome == 'failure' || steps.smoke_cire_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── cire stack's record jobs ───────────────────────────────────────────────
  deploy-cire-api-dev:
    name: Deploy cire/api — dev
    needs: [stack-cire-dev]
    if: ${{ !cancelled() && needs.stack-cire-dev.outputs.deployed == 'true' && needs.stack-cire-dev.outputs.cire_api_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "cire-api-dev deployed and passed its smoke check in this run's cire stack job."

  deploy-cire-invites-dev:
    name: Deploy cire/invites — dev
    needs: [stack-cire-dev]
    if: ${{ !cancelled() && needs.stack-cire-dev.outputs.deployed == 'true' && needs.stack-cire-dev.outputs.cire_invites_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "cire-invites-dev deployed and passed its smoke check in this run's cire stack job."

  deploy-cire-host-dev:
    name: Deploy cire/host — dev
    needs: [stack-cire-dev]
    if: ${{ !cancelled() && needs.stack-cire-dev.outputs.deployed == 'true' && needs.stack-cire-dev.outputs.cire_host_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "cire-host-dev deployed and passed its smoke check in this run's cire stack job."

  deploy-cire-vendor-dev:
    name: Deploy cire/vendor — dev
    needs: [stack-cire-dev]
    if: ${{ !cancelled() && needs.stack-cire-dev.outputs.deployed == 'true' && needs.stack-cire-dev.outputs.cire_vendor_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "cire-vendor-dev deployed and passed its smoke check in this run's cire stack job."

  deploy-cire-landing-dev:
    name: Deploy cire/landing — dev
    needs: [stack-cire-dev]
    if: ${{ !cancelled() && needs.stack-cire-dev.outputs.deployed == 'true' && needs.stack-cire-dev.outputs.cire_landing_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "cire-landing-dev deployed and passed its smoke check in this run's cire stack job."

  # ═══ zap stack: zap-api ════════════════════════════════════════════════════
  # zap-api and its D1 database, migrated by the stack. Nothing to build:
  # Alchemy bundles the Worker from its source.
  stack-zap-dev:
    name: Alchemy zap stack — dev
    needs: [build, changes]
    if: needs.changes.outputs.stack_zap == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    concurrency:
      group: deploy-dev-zap
      cancel-in-progress: false
    outputs:
      # False when the deploy or the compare failed: a Worker whose new
      # version may not have uploaded must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' }}
      zap_api_healthy: ${{ steps.smoke_zap_api.outcome == 'success' }}
    steps:
      - name: Refuse force with expect_no_change
        if: ${{ inputs.force == true && inputs.expect_no_change == true }}
        run: |
          echo "::error::force re-uploads every resource, so a plan can never be 'no changes'. Dispatch one or the other."
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dev hosts
        id: hosts
        run: bun run --cwd shared/infra dev-hosts -- --stage dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

      # The dev token must reach the dev account and no other: a token created
      # with "All accounts" or "All zones" by a member of both would reach
      # production too. It must also act on the DEV_DOMAIN zone, so an account
      # id that names production fails here. Every step below that holds the
      # token runs only after this passes.
      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" zap_api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Refuse expect_no_change while a rollback awaits re-upload
        if: ${{ inputs.expect_no_change == true && steps.snapshot.outputs.force == 'true' }}
        run: |
          echo "::error::A smoke check rolled a Worker back, so this run would re-upload it with --force and could not plan 'no changes'. Dispatch Deploy plainly first, then expect_no_change."
          exit 1

      # The stack refuses to deploy unless OSN_DEPLOY_TIER, both credentials
      # and the secret below are set, before anything uploads.
      - name: Deploy the zap stack
        id: deploy
        working-directory: zap/infra
        run: |
          set -o pipefail
          bun run deploy:dev ${FORCE:+--force} 2>&1 | tee "$RUNNER_TEMP/alchemy.log"
        env:
          FORCE: ${{ (inputs.force == true || steps.snapshot.outputs.force == 'true') && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: dev
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          # zap-api's dev Worker secret: the one osn-api holds, which zap-api
          # registers its ARC key with.
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}

      # Change counts and resource names to the run summary; with
      # expect_no_change, fails unless the plan was "no changes".
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack zap ${EXPECT_NO_CHANGE:+--expect-no-change} "$RUNNER_TEMP/alchemy.log"
        env:
          EXPECT_NO_CHANGE: ${{ inputs.expect_no_change == true && 'yes' || '' }}

      # Runs after a deploy that failed part-way too. A Worker it cannot read
      # comes out `unknown` (checked, never rolled back), and this step
      # fails, which leaves `deployed` false.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" zap_api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # /health.
      - name: Smoke check zap/api, rolling back on failure
        id: smoke_zap_api
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts zap_api dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.zap_api_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.zap_api_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'zap_api' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.smoke_zap_api.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── zap stack's record job ─────────────────────────────────────────────────
  deploy-zap-api-dev:
    name: Deploy zap/api — dev
    needs: [stack-zap-dev]
    if: ${{ !cancelled() && needs.stack-zap-dev.outputs.deployed == 'true' && needs.stack-zap-dev.outputs.zap_api_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "zap-api-dev deployed and passed its smoke check in this run's zap stack job."

  # ═══ pulse stack: pulse landing ════════════════════════════════════════════
  # Pulse landing as a static-assets Worker whose own code serves /api/geo.
  # Its build sets no PUBLIC_APP_URL: the Pulse app has no dev deploy.
  stack-pulse-dev:
    name: Alchemy pulse stack — dev
    needs: [build, changes]
    if: needs.changes.outputs.stack_pulse == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    concurrency:
      group: deploy-dev-pulse
      cancel-in-progress: false
    outputs:
      # False when the deploy or the compare failed: a Worker whose new
      # version may not have uploaded must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' }}
      pulse_landing_healthy: ${{ steps.smoke_pulse_landing.outcome == 'success' }}
    steps:
      - name: Refuse force with expect_no_change
        if: ${{ inputs.force == true && inputs.expect_no_change == true }}
        run: |
          echo "::error::force re-uploads every resource, so a plan can never be 'no changes'. Dispatch one or the other."
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # turbo hashes each dev build's PUBLIC_*, VITE_* and SITE values, so the
      # `build` job's cache never holds a dev build. This stack's own cache
      # does: a site whose files and dev values are unchanged replays its
      # last build instead of building again. Keyed on the commit so each run
      # saves, falling back to this stack's newest, then the `build` job's.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-dev-pulse-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-dev-pulse-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-dev-pulse-
            ${{ runner.os }}-turbo-build-

      # Pulse landing fetches its font metadata at build time; keyed, as
      # ci.yml's cache is, on the config that names the families.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: pulse/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'pulse/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dev hosts
        id: hosts
        run: bun run --cwd shared/infra dev-hosts -- --stage dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

      - name: Build pulse/landing (dev)
        run: bun run build --filter=@pulse/landing
        env:
          SITE: ${{ steps.hosts.outputs.pulse_landing_origin }}

      # The dev token must reach the dev account and no other: a token created
      # with "All accounts" or "All zones" by a member of both would reach
      # production too. It must also act on the DEV_DOMAIN zone, so an account
      # id that names production fails here. Every step below that holds the
      # token runs only after this passes.
      - name: Check the token reaches only the dev account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" pulse_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      - name: Refuse expect_no_change while a rollback awaits re-upload
        if: ${{ inputs.expect_no_change == true && steps.snapshot.outputs.force == 'true' }}
        run: |
          echo "::error::A smoke check rolled a Worker back, so this run would re-upload it with --force and could not plan 'no changes'. Dispatch Deploy plainly first, then expect_no_change."
          exit 1

      # The stack refuses to deploy unless OSN_DEPLOY_TIER and both
      # credentials are set, before anything uploads. Pulse landing holds no
      # secret.
      - name: Deploy the pulse stack
        id: deploy
        working-directory: pulse/infra
        run: |
          set -o pipefail
          bun run deploy:dev ${FORCE:+--force} 2>&1 | tee "$RUNNER_TEMP/alchemy.log"
        env:
          FORCE: ${{ (inputs.force == true || steps.snapshot.outputs.force == 'true') && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: dev
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # Change counts and resource names to the run summary; with
      # expect_no_change, fails unless the plan was "no changes".
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack pulse ${EXPECT_NO_CHANGE:+--expect-no-change} "$RUNNER_TEMP/alchemy.log"
        env:
          EXPECT_NO_CHANGE: ${{ inputs.expect_no_change == true && 'yes' || '' }}

      # Runs after a deploy that failed part-way too. A Worker it cannot read
      # comes out `unknown` (checked, never rolled back), and this step
      # fails, which leaves `deployed` false.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" pulse_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}

      # `/` from the assets and /api/geo from the Worker's own code. The host
      # sits behind Cloudflare Access. The check sends the service token when
      # both values are set, and fails without rolling back when Access
      # answers in the Worker's place, or when `/` asked without the token
      # gets anything but Access's sign-in redirect.
      - name: Smoke check pulse/landing, rolling back on failure
        id: smoke_pulse_landing
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts pulse_landing dev
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.pulse_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.pulse_landing_deployment }}
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'pulse_landing' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.smoke_pulse_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── pulse stack's record job ───────────────────────────────────────────────
  deploy-pulse-landing-dev:
    name: Deploy pulse/landing — dev
    needs: [stack-pulse-dev]
    if: ${{ !cancelled() && needs.stack-pulse-dev.outputs.deployed == 'true' && needs.stack-pulse-dev.outputs.pulse_landing_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Record the dev deploy
        run: echo "pulse-landing-dev deployed and passed its smoke check in this run's pulse stack job."
