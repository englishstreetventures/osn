name: Migration history

# A deployed D1 database records each migration it applied by file name and
# never reads that file again, so a merged migration is history: editing,
# deleting or renaming it reaches no database, and a rename applies it twice.
# scripts/guard-migration-history.ts refuses that, and any new file under a
# migrations directory that is not a flat <YYYYMMDDHHMMSS>_<name>.sql holding a
# statement. The `migrations:rewrite` label lifts the history rules for a
# squash (cire/db/README.md); this workflow runs on label changes so adding
# the label re-decides the check without a new push.
#
# The guard that decides is `main`'s copy, never the pull request's: a pull
# request's edits to scripts/, bunfig.toml, a .env file or .bun-version do not
# change its own check, and a stacked parent's edits to them do not change its
# child's. So a change to the rules first applies to the pull requests after it
# merges, and renaming the guard file takes two pull requests: one adds the new
# name beside the old, the next points this workflow at it and removes the old.
# When main's guard wrongly refuses a pull request, the label lifts every rule
# but the one about statements; past that, an owner merges the fix to the guard
# past this check.
# (scripts/tests/guard-migration-history.test.ts runs this job's guard step.)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Each pull request in a merge-queue group passed this on its own, and
  # combining them cannot rewrite a merged file; the job reports a pass there
  # so the queue is not left waiting on it.
  merge_group:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  guard:
    name: Migration history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A merge-queue group was decided pull request by pull request
        if: github.event_name == 'merge_group'
        run: echo "Every pull request in this group passed the migration history guard on its own."

      # main's guard and its Bun pin. Cone-mode sparse checkout: scripts/ and
      # the files at the root, nothing else.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: refs/heads/main
          path: guard-base
          sparse-checkout: scripts
          persist-credentials: false

      # Two commits deep: on the pull request's merge commit, `HEAD^1` is the
      # base it merges into, so `git diff HEAD^1 HEAD` is exactly its change.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request'
        with:
          bun-version-file: guard-base/.bun-version

      # Runs in the pull request's checkout, so it diffs and reads the pull
      # request's files. `--config=/dev/null` and `--no-env-file` keep that
      # checkout's bunfig.toml and .env files out of the run, and `--no-install`
      # refuses any package: the guard imports Node built-ins and sibling
      # scripts only. DO_NOT_TRACK stands in for the root bunfig's
      # `telemetry = false`.
      - name: Refuse rewritten migration history
        if: github.event_name == 'pull_request'
        working-directory: pr
        env:
          ALLOW_REWRITE: ${{ contains(github.event.pull_request.labels.*.name, 'migrations:rewrite') }}
          DO_NOT_TRACK: "1"
        run: |
          args=()
          if [ "$ALLOW_REWRITE" = "true" ]; then args+=(--allow-rewrite); fi
          bun --no-install --no-env-file --config=/dev/null \
            "$GITHUB_WORKSPACE/guard-base/scripts/guard-migration-history.ts" "${args[@]}"
