name: Deploy

# The dev tier: every push to main deploys the dev surfaces it changed,
# unattended. Production is not deployed here — it ships in releases from
# production-release.yml, which compares each surface with what production
# runs and waits for one approval.
#
# Triggers:
#   - push to `main` (after a merge)
#   - manual `workflow_dispatch` (deploys every dev surface)
#
# Shape of a run:
#
#   changes ──┐
#             ├──> deploy-<surface>-dev   (automatic)
#   build ────┘
#
# `build` re-runs the same install + build + test CI does, so nothing ships from
# a broken tree. `changes` computes one boolean per dev surface from the push
# diff, so a landing-page tweak does not redeploy seven things.
#
# Two Environments, two Cloudflare credential NAMES:
#
#   dev         -> CLOUDFLARE_API_TOKEN_DEV, held only by the `dev` Environment
#   production  -> CLOUDFLARE_API_TOKEN, held only by the `production`
#                  Environment, reachable only from an approved job in
#                  production-release.yml
#
# Both are set as of 2026-09-11, so the `|| secrets.CLOUDFLARE_API_TOKEN`
# fallback in every dev job below is now unreachable. It stays because a `||`
# that never fires is free, and it is what makes a wrongly-placed job fail on an
# empty token rather than deploy with the other tier's rights. The `Cloudflare
# credential scope` job prints which credential a run actually got.
#
# The two tokens still share ONE Cloudflare account (decided 2026-08-14 — ship
# the dev tier now, split accounts later), so inside that account the second
# token grants what the first one does, for the reason below. Secret VALUES are
# never embedded here.
#
# What the split does NOT buy: `Workers Scripts:Edit` and `D1:Edit` are
# ACCOUNT-level permissions — Cloudflare has no per-script or per-database
# resource filter (only R2 scopes per bucket). So CLOUDFLARE_API_TOKEN_DEV can
# technically write production Workers too. The boundary here is the approval
# gate and the separate credential, not a narrower grant. A real boundary needs
# a separate Cloudflare account.
#
# The dev tier is fully isolated — own Workers, own D1, own R2, own OSN identity
# origin. Its database takes migrations forward on each deploy and is wiped and
# re-seeded once a night by cire-dev-db-rebuild.yml, not on every merge. See
# [[wiki/shared/dev-environment]].
#
# After each dev Worker deploy (cire-api, cire-invites, osn-api),
# scripts/smoke-check.ts asks the Worker's dev host whether it serves, and
# rolls it back when it answers wrongly — the same check production-release.yml
# runs, pinned the same way to the version each deploy step reports in
# WRANGLER_OUTPUT_FILE_PATH. A failed check fails the job, so GitHub marks its
# Deployment `failure` and the release planner's dev gate holds the change back
# from production.
# Dispatch with `smoke_fail` set to a surface to watch that path: its check
# asks for a path the Worker answers 404, and the job rolls back and goes red.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_fail:
        description: "Dry run of the rollback path: this dev Worker's smoke check fails on purpose, so its job rolls the Worker back and goes red. Every other surface deploys as usual."
        type: choice
        options: [none, cire_api, cire_invites, osn_api]
        default: none

# Read-only: this workflow deploys to Cloudflare, it never writes to the repo.
permissions:
  contents: read

# NOTE: concurrency is set PER JOB (below), not here. Each job takes a group
# named for its own surface and tier (`deploy-dev-<surface>`), so two runs never
# deploy the same thing at once while unrelated surfaces stay parallel.
# cire-dev-db-rebuild.yml shares `deploy-dev-cire-api`, so a rebuild and a
# deploy never touch cire-db-dev at once.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Path filter ────────────────────────────────────────────────────────────
  # One boolean per dev surface, from scripts/deploy-surfaces.ts — the same
  # surface map production-release.yml ships from, so the two tiers cannot
  # disagree about which paths redeploy what. A push redeploys what its diff
  # touches; anything every surface builds from (shared/, the lockfile, the
  # root build config, this file, the map) redeploys everything. A dispatch,
  # and a push git cannot diff (the all-zero `before` of a first push, the
  # orphan left by a force-push), deploy everything: a wasted deploy costs a
  # minute, a silently skipped one ships a half-updated tier.
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      cire_api: ${{ steps.filter.outputs.cire_api }}
      cire_invites: ${{ steps.filter.outputs.cire_invites }}
      cire_host: ${{ steps.filter.outputs.cire_host }}
      cire_vendor: ${{ steps.filter.outputs.cire_vendor }}
      cire_landing: ${{ steps.filter.outputs.cire_landing }}
      osn_api: ${{ steps.filter.outputs.osn_api }}
      osn_social: ${{ steps.filter.outputs.osn_social }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No install: the script imports only Bun and Node built-ins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bun run scripts/deploy-surfaces.ts --event "$EVENT_NAME" --base "$BEFORE_SHA"

  # ── Gate ─────────────────────────────────────────────────────────────────
  # Re-run install + build + test before any deploy. If this fails, every
  # deploy job below is skipped (they `needs: build`).
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for why this is keyed on the three
      # astro.config.mjs files rather than bun.lock or github.sha — Astro's
      # font-metadata cache is a function of which families each config
      # asks for, and restoring it here turns this workflow's own `bun run
      # build` into a cache hit against fonts.google.com too
      # (englishstventures/osn-tracker#128).
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Gate the deploy on the async-D1-driver lane too — these tests sit
      # outside the vitest include glob, so `bun run test` doesn't reach them,
      # and D1 is exactly what this workflow is about to deploy against.
      # Serial: concurrent Miniflare workerd instances contend.
      - name: D1 integration tests
        run: bun run test:d1

  # ═══ Which credential the dev jobs got ═════════════════════════════════════
  #
  # Every dev job resolves its Cloudflare token as
  # `secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN`, and a
  # `||` cannot tell a missing secret from a deliberate one. Unset, the fallback
  # is taken in silence and a dev job runs on whatever the second name resolves
  # to. This job prints which of the two the run got, so the placement is a line
  # in the log rather than something to infer.
  #
  # It prints a NAME, never a value: `secrets.X && 'a' || 'b'` yields a literal,
  # and the secret itself never reaches the step. Nothing depends on this job —
  # no `needs:` edge — so it cannot delay or fail a deploy. It exists to be read
  # on the day the dev credential appears, or the day it goes missing again.
  # See [[wiki/shared/dev-environment]] §Two Environments, two tokens for the
  # ordered move and why deleting the repository-scope secret early breaks
  # every deploy in the repository.
  credential-scope:
    name: Cloudflare credential scope
    needs: [changes]
    # Only when a job that actually holds the credential is going to run. A
    # docs-only push deploys nothing, so there is nothing to report on.
    if: needs.changes.outputs.cire_api == 'true' || needs.changes.outputs.osn_api == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 2
    steps:
      - name: Report which Cloudflare credential the dev jobs hold
        env:
          SOURCE: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV && 'CLOUDFLARE_API_TOKEN_DEV (dev Environment)' || 'CLOUDFLARE_API_TOKEN (fallback — the dev-only credential is unset)' }}
        run: echo "Dev jobs in this run hold $SOURCE"

  # ═══ cire API + D1 ═════════════════════════════════════════════════════════
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  # Migrations are applied INCREMENTALLY here, exactly as production applies
  # them, then the Worker is deployed. No reset, no reseed.
  #
  # It used to reset (drop every table incl. the migration ledger) -> migrate
  # (replay all 57 migrations from 0001 against an empty DB) -> seed on every
  # merge. That cost 8,007 D1 rows written and ~22,630 read per run, against a
  # free-tier ceiling of 100,000 written per day ACROSS THE WHOLE ACCOUNT: 13
  # merges on 2026-09-09 spent 104,091 and went over. Almost none of it was the
  # seed — SQLite rebuilds the whole table for every `ALTER TABLE ... DROP
  # COLUMN`, and D1 bills that schema churn even against empty tables. See #979.
  #
  # The property that bought was: every merge re-tests the whole migration chain
  # from zero, so a migration that only works as an increment fails on dev
  # rather than in production months later. We keep it, twice over and for free:
  #
  #   - cire/api/tests/db/ddl-lockstep.test.ts (T-S1) applies the full chain to
  #     an in-memory DB on every `bun test` — so every PR, not just merges to
  #     main — and diffs it against the DDL mirror and the Drizzle schema.
  #   - cire-dev-db-rebuild.yml does the real reset -> replay -> seed against
  #     remote cire-db-dev nightly and on workflow_dispatch, which is what
  #     catches the DDL that bun:sqlite accepts and D1 rejects.
  #
  # Dev data is still disposable; it just gets its clean floor once a day
  # instead of once a merge. A wedding a tester made by hand now survives until
  # the next nightly rather than dying on the next merge.
  deploy-cire-api-dev:
    name: Deploy cire/api — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_api == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-api
      # Supersede queued dev deploys — a burst of merges otherwise runs this
      # job once per merge, and each run only rebuilds dev to the same shape
      # the last one would (#980). Cancelling mid-flight can leave dev's DB one
      # migration ahead of its Worker; both self-heal on the next merge, and
      # the dev tier is disposable by design. A run cancelled during its smoke
      # check leaves its version deployed and unchecked, and the next run's
      # rollback, if it needs one, restores that version. Production deploys
      # from production-release.yml in its own group, which never cancels.
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Guard against placeholder D1 database_id
        run: bun run scripts/check-d1-database-id.ts

      - name: Apply cire D1 migrations (remote dev)
        run: bun run --cwd cire/db db:migrate:dev

      - name: Deploy cire/api Worker (dev)
        run: bunx wrangler deploy --env dev
        working-directory: cire/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # The same check as production's (scripts/smoke-check.ts), against
      # api.dev.cireweddings.com. SMOKE_FORCE_FAIL is the dispatch's dry run.
      - name: Smoke check, rolling back on failure
        run: bun run scripts/smoke-check.ts cire_api dev
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_api' }}

  # ═══ cire invites (Astro SSR → Cloudflare Worker) ══════════════════════════
  # The guest site is Astro SSR on Cloudflare (output: "server", the
  # @astrojs/cloudflare adapter). It resolves which wedding to render FROM THE
  # PATH or the redacted query per request — there is NO PUBLIC_WEDDING_SLUG. The adapter
  # emits a Cloudflare Worker with Static Assets: `dist/server/entry.mjs` (the
  # SSR Worker), `dist/client/` (prerendered legal pages + JS/CSS), and a
  # generated `dist/server/wrangler.json` that EXTENDS the committed
  # cire/invites/wrangler.jsonc (worker name + custom-domain route).
  # PUBLIC_API_URL / PUBLIC_SITE_URL are read both server-side (per request) and
  # by the client islands; they bake in at build time, which is why dev needs its
  # own build and cannot re-point the prod bundle.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-cire-invites-dev:
    name: Deploy cire/invites — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_invites == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-invites
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build cire/invites (dev)
        run: bun run build --filter=@cire/invites
        env:
          PUBLIC_API_URL: https://api.dev.cireweddings.com
          PUBLIC_SITE_URL: https://invite.dev.cireweddings.com
          PUBLIC_MARKETING_URL: https://dev.cireweddings.com
          # One Turnstile widget serves both tiers — the dev hostnames are added
          # to its Domains list (dashboard step, see the dev runbook). Whether
          # the gate actually enforces depends on the API side: cire-api-dev only
          # verifies if TURNSTILE_SECRET_KEY is set on that Worker (key-optional).
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_EMBED_KEY }}

      # Tracker #287: this Worker's SSR bundle reached 470 KB gzip unnoticed,
      # from two separate mistakes — the whole `motion` library in the SSR
      # module graph with nothing there calling it, and three drift-guard tests
      # routed as pages, dragging 119 KB gzip of vitest with them. The guard
      # script holds the threshold and the full reasoning (tracker #619
      # generalised it to scripts/guard-bundle-size.sh); it runs here and on
      # every PR (`ci.yml`), so a regression is caught on the merge gate rather
      # than after it lands on main.
      - name: Guard cire/invites SSR bundle size
        run: ./scripts/guard-bundle-size.sh cire/invites

      # Three edits to the adapter's generated config, in one pass:
      #
      #  1. drop `legacy_env` — @astrojs/cloudflare still writes it, wrangler
      #     4.111+ hard-errors on it, and removing it is a behavioural no-op
      #     (`true` WAS the default). The production job in
      #     production-release.yml strips it too.
      #  2. retarget name + routes at the dev Worker. The committed
      #     wrangler.jsonc names the PRODUCTION worker and its custom domain;
      #     rewriting here keeps one checked-in config instead of a near-copy
      #     that would drift.
      #  3. trace every request with query strings kept. Dev holds synthetic
      #     data only; production keeps the committed redaction, which
      #     scripts/check-trace-redaction.ts checks before the production
      #     deploy in production-release.yml.
      - name: Retarget the generated config at dev
        run: |
          node -e "
            const fs = require('fs');
            const f = 'dist/server/wrangler.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            delete c.legacy_env;
            c.name = 'cire-invites-dev';
            c.routes = [{ pattern: 'invite.dev.cireweddings.com', custom_domain: true }];
            c.observability = { ...c.observability, redact_query_string: false, traces: { enabled: true, head_sampling_rate: 1 } };
            fs.writeFileSync(f, JSON.stringify(c));
          "
        working-directory: cire/invites

      - name: Deploy cire/invites (dev Worker)
        run: bunx wrangler deploy --config dist/server/wrangler.json
        working-directory: cire/invites
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # invite.dev.cireweddings.com sits behind Cloudflare Access
      # ([[wiki/shared/dev-environment]] §5), so the check needs an Access
      # service token; without both values on the dev Environment, the check
      # is skipped with a warning. Rolls back cire-invites-dev, the Worker the
      # retarget above names.
      - name: Smoke check, rolling back on failure
        run: bun run scripts/smoke-check.ts cire_invites dev
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'cire_invites' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  # ═══ cire host (Astro → Cloudflare Pages) ══════════════════════════════════
  # The organiser portal is a separate static Astro build + Pages project from
  # the guest site. Its PUBLIC_* vars (cire-api origin, musubi account origin for
  # the security deep-link, guest-site URL for the preview link) bake in at build
  # time; sign-in itself is a redirect through cire-api, so no issuer var.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-cire-host-dev:
    name: Deploy cire/host — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_host == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-host
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for the reasoning behind this key.
      # `PUBLIC_CIRE_API_URL` differs between this dev build and the
      # `build` job's, and turbo.json's `build` task hashes
      # `PUBLIC_*` env vars as inputs — so this job's `bun run build` is
      # always a turbo cache MISS against the `build` job above and really
      # runs `astro build` again, hitting fonts.google.com again unless this
      # restores what that fetch produced (englishstventures/osn-tracker#128).
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: cire/host/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/host/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build cire/host (dev)
        run: bun run build --filter=@cire/host
        env:
          PUBLIC_CIRE_API_URL: https://api.dev.cireweddings.com
          # Dev account pages live on the dev identity app — a dev passkey is a
          # different credential from a prod one (RP ID dev.musubi.social), so
          # this must never deep-link to the production account surface.
          PUBLIC_OSN_ACCOUNT_URL: https://dev.musubi.social
          PUBLIC_CIRE_WEB_URL: https://invite.dev.cireweddings.com

      # Tracker #619 (see scripts/guard-bundle-size.sh's own comment and
      # wiki/conventions/bundle-size-guards.md). Chained onto the `build`
      # script too, but this step is what still checks the artifact when
      # Turborepo replays a cached `build` and the chained invocation never
      # runs.
      - name: Guard cire/host bundle size
        run: ./scripts/guard-bundle-size.sh cire/host

      # Idempotent: creates the project on first run, no-ops after. The custom
      # domain (host.dev.cireweddings.com) is a dashboard step — wrangler cannot
      # attach one.
      - name: Ensure the cire-host-dev Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" cire-host-dev main
        working-directory: cire/host

      - name: Deploy cire/host to Cloudflare Pages (dev)
        run: bunx wrangler pages deploy dist --project-name cire-host-dev --branch main --commit-dirty=true
        working-directory: cire/host

  # ═══ cire vendor (Astro → Cloudflare Pages) ════════════════════════════════
  # The vendor self-service portal. PUBLIC_* vars bake in at build time.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-cire-vendor-dev:
    name: Deploy cire/vendor — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_vendor == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-vendor
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for the reasoning behind this key, and
      # the cire/host dev job above for why this always misses turbo's own
      # cache.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: cire/vendor/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build cire/vendor (dev)
        run: bun run build --filter=@cire/vendor
        env:
          PUBLIC_CIRE_API_URL: https://api.dev.cireweddings.com
          PUBLIC_OSN_ACCOUNT_URL: https://dev.musubi.social

      # Tracker #619 (see scripts/guard-bundle-size.sh's own comment and
      # wiki/conventions/bundle-size-guards.md). Chained onto the `build`
      # script too, but this step is what still checks the artifact when
      # Turborepo replays a cached `build` and the chained invocation never
      # runs.
      - name: Guard cire/vendor bundle size
        run: ./scripts/guard-bundle-size.sh cire/vendor

      - name: Ensure the cire-vendor-dev Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" cire-vendor-dev main
        working-directory: cire/vendor

      - name: Deploy cire/vendor to Cloudflare Pages (dev)
        run: bunx wrangler pages deploy dist --project-name cire-vendor-dev --branch main --commit-dirty=true
        working-directory: cire/vendor

  # ═══ cire landing (Astro → Cloudflare Pages) ═══════════════════════════════
  # The marketing site. Built fully static (output: "static", no Cloudflare
  # adapter) and deployed to its OWN Pages project, separate from the guest site
  # and organiser portal.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-cire-landing-dev:
    name: Deploy cire/landing — dev
    needs: [build, changes]
    if: needs.changes.outputs.cire_landing == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-cire-landing
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for the reasoning behind this key, and
      # the cire/host dev job above for why this always misses turbo's own
      # cache.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build cire/landing (dev)
        run: bun run build --filter=@cire/landing
        env:
          PUBLIC_ORGANISER_URL: https://host.dev.cireweddings.com
          SITE: https://dev.cireweddings.com

      # Tracker #619 (see scripts/guard-bundle-size.sh's own comment and
      # wiki/conventions/bundle-size-guards.md). Chained onto the `build`
      # script too, but this step is what still checks the artifact when
      # Turborepo replays a cached `build` and the chained invocation never
      # runs.
      - name: Guard cire/landing bundle size
        run: ./scripts/guard-bundle-size.sh cire/landing

      - name: Ensure the cire-landing-dev Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" cire-landing-dev main
        working-directory: cire/landing

      - name: Deploy cire/landing to Cloudflare Pages (dev)
        run: bunx wrangler pages deploy dist --project-name cire-landing-dev --branch main --commit-dirty=true
        working-directory: cire/landing

  # ═══ osn/api (Worker + D1) ═════════════════════════════════════════════════
  # osn-api (identity/auth) is a Cloudflare Worker (`main = "src/index.ts"`,
  # a custom-domain route per env). It runs on workerd with Upstash + native
  # Workers rate-limiters. Secrets are set out-of-band per tier
  # (`wrangler secret put … --env <tier>`); this job only migrates + deploys.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  # The dev issuer is id.dev.musubi.social with its OWN D1 (`osn-db-dev`) and its
  # own WebAuthn RP ID (dev.musubi.social), so a dev passkey is a separate
  # credential from a prod one and no dev sign-in can touch a real account.
  #
  # Unlike cire's dev D1, this one is NOT reset: accounts and passkeys are the
  # thing being tested, and wiping them every merge would mean re-registering a
  # credential before every manual check. Migrations still apply forward.
  deploy-osn-api-dev:
    name: Deploy osn/api — dev
    needs: [build, changes]
    if: needs.changes.outputs.osn_api == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-osn-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply osn D1 migrations (remote dev)
        run: bun run --cwd osn/db db:migrate:dev

      # Same fail-closed secret preflight as the production job in
      # production-release.yml (see there for why). Dev
      # needs its OWN OSN_PAIRWISE_SALT — a dev value, and once set it must never
      # be rotated either, or every dev relying party sees its users as
      # strangers. Set it with the `Set an osn-api Worker secret` workflow
      # (secret: OSN_PAIRWISE_SALT, tier: dev).
      - name: Preflight — required dev secrets are set
        run: |
          set -euo pipefail
          required="OSN_PAIRWISE_SALT"
          set_names="$(bunx wrangler secret list --env dev | grep -oE '"name" *: *"[^"]+"' | sed -E 's/.*"name" *: *"([^"]+)".*/\1/')"
          missing=""
          for name in $required; do
            if ! printf '%s\n' "$set_names" | grep -qx "$name"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::osn-api-dev is missing required secret(s):$missing — run the 'Set an osn-api Worker secret' workflow with secret=OSN_PAIRWISE_SALT, tier=dev. osn-api fails closed on these, so deploying now would 503 every route."
            exit 1
          fi
          echo "All required osn-api dev secrets are set."
        working-directory: osn/api

      - name: Deploy osn/api Worker (dev)
        run: bunx wrangler deploy --env dev
        working-directory: osn/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # /health and /.well-known/jwks.json on id.dev.musubi.social.
      - name: Smoke check, rolling back on failure
        run: bun run scripts/smoke-check.ts osn_api dev
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
          SMOKE_FORCE_FAIL: ${{ inputs.smoke_fail == 'osn_api' }}

  # ═══ musubi/social (Vite SPA → Cloudflare Pages) ══════════════════════════════
  # The identity web app: profile, connections, organisations, settings — and
  # `/authorize`, the OIDC consent screen osn-api redirects to. It must be
  # served under the SAME registrable domain as its osn-api, because the session
  # cookie and the per-request OIDC binding cookie are host-bound to the issuer
  # and only ride along on same-site credentialed fetches. That is why each tier
  # pairs a musubi.social host with its own issuer host, never a *.pages.dev URL.
  #
  # The app's host is also the WebAuthn RP ID, so this is the one surface that
  # can run a passkey ceremony — per tier.
  #
  # `musubi/social/public/_redirects` rewrites every path to index.html (200) so
  # client-side routes deep-link; `_headers` ships the framing denial the
  # consent screen needs. Both are static files Pages serves as-is.
  #
  # There is NO feature-branch preview for this app. `deploy-osn-social-preview.yml`
  # was removed on 2026-07-27: a preview on `*.pages.dev` can neither run a
  # passkey ceremony nor complete an OIDC round-trip — wrong RP ID, and the
  # `__Host-` cookies are bound to the issuer host. The dev tier below replaces
  # it properly: dev.musubi.social IS a real RP ID with a real issuer behind it.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-osn-social-dev:
    name: Deploy musubi/social — dev
    needs: [build, changes]
    if: needs.changes.outputs.osn_social == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-osn-social
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No hard sitekey gate here, unlike prod: whether Turnstile enforces on dev
      # depends on osn-api-dev holding TURNSTILE_SECRET_KEY, which is a
      # per-tier choice (key-optional, fail-closed only when the secret is set).
      # The production job's gate (production-release.yml) is what protects the
      # pairing that actually matters.
      - name: Build musubi/social (dev)
        run: bun run build --filter=@musubi/social
        env:
          VITE_OSN_ISSUER_URL: https://id.dev.musubi.social
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      - name: Ensure the osn-social-dev Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" osn-social-dev main
        working-directory: musubi/social

      - name: Deploy musubi/social to Cloudflare Pages (dev)
        run: bunx wrangler pages deploy dist --project-name osn-social-dev --branch main --commit-dirty=true
        working-directory: musubi/social
