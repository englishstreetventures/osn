name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is the job that runs `bun run lint` below, which executes the
      # vendored anti-slop plugin (oxlintrc.json's jsPlugins). `script-tests`
      # runs this same check, but in parallel with this job — so it verifies
      # the tree independently of, not before, the run that matters. This
      # copy has to come before oxlint actually runs it, hence first step
      # after checkout, before install.
      - name: Verify vendored anti-slop matches its checksums
        run: bash scripts/verify-vendored-anti-slop.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Keyed on the commit, not the lockfile. `actions/cache` will not
      # overwrite an entry whose key already exists, so a cache keyed on
      # `bun.lock` is written once and then frozen: every later run on the same
      # lockfile restores that first snapshot, misses on everything that has
      # changed since, and saves nothing back. The cache aged out of usefulness
      # while still reporting a hit. A unique primary key forces a save each
      # run and the prefix restore-key still pulls the most recent one, so the
      # cache follows the branch instead of the dependency list.
      #
      # The Chromium cache below is left on `bun.lock` deliberately — the
      # browser version IS a function of the lockfile, so an exact hit there
      # genuinely has nothing new to write.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-check-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # The backstop under the per-step timeouts below. Without it the job's
    # ceiling is GitHub's six hours, which is long enough for one stuck runner
    # to hold up a day of review.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # The four d1-integration.test.ts files live outside the vitest `include`
      # glob (`tests/**/*.test.ts`), so `bun run test` never reaches them. They
      # are the only coverage of the ASYNCHRONOUS D1 driver that dev/staging/prod
      # actually run on, and going unrun let zap's rot into a stale fixture that
      # had been failing silently. Serial by necessity — concurrent Miniflare
      # workerd instances contend and fail spuriously (the root script pins
      # --concurrency=1).
      - name: D1 integration tests
        run: bun run test:d1

      # The browser tier (`*.browser.test.tsx`) runs in a real Chromium, because
      # jsdom computes no CSS and no layout — so stacking order, sticky
      # positioning, Tailwind's compiled output and the reduced-motion clamp are
      # all invisible to `bun run test`. Split out for the same reason as the D1
      # step above: it needs a dependency the default path doesn't, and keeping
      # it separate leaves the fast tier fast.
      #
      # `--with-deps` used to do both halves of the install in one line: an apt
      # install of Chromium's shared libraries, and a ~150MB download of the
      # browser itself. On ubuntu-latest the browser alone is not enough, so
      # both have to happen — but neither half had a timeout, and a step with no
      # timeout inherits the job's, which is six hours. On 2026-08-19 one of them
      # stalled and every open PR's Build & Test sat in `pending` behind it for
      # most of a day, with no log to read because a job's logs only appear once
      # it ends. Three changes, all aimed at that:
      #
      #   * the halves are separate steps, so a stall names which half stalled;
      #   * each is bounded, so a stall is a red X in ten minutes instead of a
      #     wedged runner;
      #   * the download half is cached on the lockfile, so the usual run never
      #     makes it. The system libraries are not cacheable (apt writes into the
      #     image, not the workspace) and are reinstalled each run.
      #
      # Only chromium is installed — the tier pins a single instance, so pulling
      # Firefox and WebKit too would be ~3x the download for nothing.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium's system libraries
        timeout-minutes: 10
        run: bunx playwright install-deps chromium

      - name: Install Chromium for browser tests
        timeout-minutes: 10
        run: bunx playwright install chromium

      - name: Browser tests
        run: bun run test:browser

  script-tests:
    name: Scripts
    runs-on: ubuntu-latest
    # The backstop under this job's own checks. Without it the job's ceiling
    # is GitHub's six hours — and because the aggregate `ci` job `needs` it,
    # and `CI` is a required check, a wedged runner here holds the merge gate
    # open for that long. Five minutes is generous: the job does a checkout,
    # a shasum, and `bun test ./scripts/` with no install.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No bun needed, so it runs right after checkout. The `lint` job runs
      # this same script too, and that copy is the one that matters for
      # ordering (see the comment there). This one stays because `script-tests`
      # is the job that owns everything under scripts/, and a shasum costs
      # nothing.
      - name: Verify vendored anti-slop matches its checksums
        run: bash scripts/verify-vendored-anti-slop.sh

      # The guard's own tests, beside the run that uses it. They exercise it in
      # throwaway git repos rather than this checkout, and one case exports
      # GIT_DIR the way git does for every hook — the state that once made the
      # guard list the whole repo instead of the vendored subtree and blocked
      # every local commit.
      - name: Test the vendored anti-slop guard
        run: bash scripts/verify-vendored-anti-slop.test.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # `scripts/` is not a workspace, so `turbo test` never reaches it and the
      # tests under it ran nowhere: `test:migration` was declared in the root
      # package.json and called by no workflow, so the throttle and backfill
      # tests had never run in CI at all. They do now, along with the D1
      # guard's — which is the pair that matters, since that guard decides
      # whether a deploy proceeds.
      #
      # scripts/cire-dev-db-guard.ts is the only thing standing between the
      # unattended `db:reset:dev` step and the live-wedding D1, and a weakened
      # guard's failure mode is *passing* — nothing downstream would notice
      # until the tables were gone. Its own tests therefore run on every PR,
      # not just when someone remembers.
      #
      # (The changeset gate's two shell tests live in changeset-check.yml
      # instead, beside the job whose scripts they self-test.)
      #
      # The `./` in `bun test ./scripts/` is load-bearing. A bare `scripts/` is
      # a SUBSTRING filter on the test path, not a directory, so it also picks
      # up `cire/api/src/scripts/remint-family-codes.test.ts` — which imports
      # drizzle and effect and therefore needs an install this job does not do.
      # `./scripts/` anchors to the directory.
      #
      # No `bun install` on purpose: the files under scripts/ import nothing
      # but `bun:test`, Bun/Node built-ins, and each other, so an install here
      # would be a minute spent on nothing.
      - name: Test the scripts
        run: bun run test:scripts

      # The guard's own tests run in the step above; this step runs it against
      # this repo's real vitest configs. Both halves are needed — a test suite
      # over synthetic fixtures proves the guard works, not that the tree it is
      # guarding still passes it.
      - name: Check jest-dom suppression markers
        run: bun run check:jest-dom-markers

      # A prior version of this job ran `checkReleaseAgeExcludes` only from
      # `bun test`, which imports the pure function and feeds it synthetic
      # TOML — the `import.meta.main` CLI block (the part that reads the real
      # `bunfig.toml`) is false under `bun test` and so never ran here, while
      # `bunfig.toml`'s own comment and the changeset that added this script
      # both claimed CI enforced it. It did not. This step is what actually
      # makes that true: the CLI test above proves the wiring works in
      # general, this step proves it against this repo's own bunfig.toml.
      - name: Check release-age excludes are marked and bounded
        run: bun run check:release-age-excludes

  openapi-freshness:
    name: OpenAPI Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Regenerate OpenAPI documents
        run: |
          bun run --cwd pulse/api openapi:generate
          bun run --cwd osn/api openapi:generate

      # Fails if a committed document drifts from what the route
      # definitions currently produce — the Swift client generator consumes
      # the committed files directly, so a stale spec would ship silently.
      - name: Check for drift
        run: git diff --exit-code shared/openapi/

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, build-test, script-tests, openapi-freshness]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All CI jobs passed"
