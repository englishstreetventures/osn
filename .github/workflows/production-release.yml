        continue-on-error: true
        working-directory: zap/infra
        run: bun run read:live -- --out "$RUNNER_TEMP/live-after.json" --kept "$RUNNER_TEMP/live.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Five minutes: a check, its rollback and the re-check, with every
      # request at its timeout, take 186 s. A site PRODUCTION_HOST_HOLDS
      # holds off probes nothing: its check reads that the held host is off
      # its Worker (scripts/smoke-check.ts).
      - name: Smoke check zap/api, rolling back on failure
        id: smoke_zap_api
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts zap_api production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.zap_api_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.zap_api_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.kept.outcome == 'failure' || steps.smoke_zap_api.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check or the secret check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── zap stack's record jobs ──────────────────────────────────────────────
  # One per surface. Each runs when the stack job deployed, kept every
  # secret, and its surface's check passed, and leaves that surface's
  # Deployment record in `production-records`, named for the surface:
  # scripts/release-plan.ts reads records by job name.
  record-zap-api:
    name: Record zap/api — production
    needs: [stack-zap-production]
    if: ${{ !cancelled() && needs.stack-zap-production.outputs.deployed == 'true' && needs.stack-zap-production.outputs.zap_api_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "zap-api deployed and passed its smoke check in this run's zap stack job."
