name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Counts the lint warnings on the commit this run was triggered by, so the
  # release job can lower scripts/lint-warning-ceiling.txt to it in the same
  # commit as the version bumps. A job of its own so that oxlint and its
  # jsPlugins (the vendored anti-slop tree, tools/oxlint/house and the npm
  # package @shadcn/lint) never run inside the release job, which holds
  # RELEASE_TOKEN and can push to main. This job has a read-only token, keeps
  # no credentials in its checkout and runs no install scripts.
  #
  # That is all the split gives. On a hosted runner any step can reach the
  # runner's own token and write main's dependency cache, whatever the job's
  # permissions say, which is why the release job restores no cache. The count
  # it hands over is checked before use (the lower step and the guard's
  # --lower-to).
  #
  # Skipped for the bot's own commits (the version bumps and the lockfile
  # refresh that follows them), which never change the count.
  lint-count:
    name: Count lint warnings
    if: github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # oxlint runs the vendored anti-slop plugin; verify it first, as ci.yml's
      # lint job does.
      - name: Verify vendored anti-slop matches its checksums
        run: bash scripts/verify-vendored-anti-slop.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Restore bun dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The assignment fails the step when the guard does, so a failed lint
      # run never reaches the release job as a count.
      - name: Count
        id: count
        run: |
          count="$(bash scripts/guard-lint-warnings.sh --count)"
          echo "Lint warnings on ${GITHUB_SHA}: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: lint-count
    # Versioning never waits on a successful count: when the count fails or
    # is skipped, this job still runs and only the ceiling stays as it was.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # No dependency cache in this job: other jobs on main can write that
      # cache, and this one holds RELEASE_TOKEN. Each package comes from the
      # registry and is checked against bun.lock's integrity hashes.
      - name: Install dependencies
        run: bun install

      - name: Version packages
        run: bun run version

      # Lowers the ceiling to the count lint-count measured on this same
      # commit; never raises it, and leaves the file untouched when the count
      # already matches, so a re-run makes no empty commit. The count comes
      # from another job, so it is checked to be a plain number before
      # anything prints it. A failure here costs only this lowering — the next
      # run on main measures again — so the file is put back as it was and
      # the version bumps are still committed.
      - name: Lower the lint-warning ceiling
        if: needs.lint-count.result == 'success'
        continue-on-error: true
        env:
          COUNT: ${{ needs.lint-count.outputs.count }}
        run: |
          case "$COUNT" in
            '' | *[!0-9]*)
              echo "::warning::lint-count did not hand over a plain number; the ceiling is unchanged."
              exit 1
              ;;
          esac
          if ! bash scripts/guard-lint-warnings.sh --lower-to "$COUNT"; then
            git checkout -- scripts/lint-warning-ceiling.txt
            exit 1
          fi

      # Stages only the version bumps and the ceiling, picks the message, and
      # pushes with --no-verify; scripts/release-commit.sh says why, and
      # scripts/tests/release-commit.test.sh covers each case.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/release-commit.sh
