name: Production release

# Ships main to production. Dev deploys per push in deploy.yml; production
# deploys only from here. A release that ships no Alchemy stack takes one
# approval; one that ships a stack takes two: the stack's plan, then the
# deploy.
#
# Shape of a run:
#
#   plan ──> build ──┬──> alchemy-plan ──> deploy-<surface>  (Wrangler APIs, Pages sites)
#        └─> sites ──┘    (approval 1)     stack-<stack>-production ──> record-<site>
#                                          (approval 2, together)       site-parity
#
# `build` and `sites` run side by side; `alchemy-plan` and every deploy job
# need both.
#
# A flip release (`flip` names one site, `surfaces` that site alone) moves a
# domain, and its stack runs three jobs, each with its own approval:
#
#   alchemy-plan ──> stack-<stack>-verify ──> flip-detach-<stack> ──> stack-<stack>-production
#   (approval 1)     (2: re-plan, guard)     (3: domain off Pages)    (4: re-plan, guard,
#                                                                         deploy, attach)
#
# Its rollback is a release dispatched with `attach` naming the site, which
# runs the plan job and attach-pages-domain alone, behind one approval: the
# site's domain goes back on its Pages project. A release dispatched with
# `unflip` (the site set back to `staged`) ships the site's stack, whose
# Worker gives up its production host, then runs the same attach job.
#
# `sites` builds each production site a shipping stack deploys, or whose own
# Pages job ships, once, with the values its build bakes in, and passes them
# on as the `production-sites` artifact. A job that holds a credential
# downloads it outside its checkout and lets in only the site builds
# (scripts/production-sites-artifact.ts). `alchemy-plan` (the `production`
# Environment's first review) checks each worker site's domain before any
# install, then plans each shipping stack and runs the plan guard, keeping
# only the guard's record (names, kinds, actions, and each site's
# custom-domain change, read from the live Workers). Every other job needs
# all four, so they reach the gate together and one second review releases
# them.
# When no stack ships, `alchemy-plan` is skipped and that is the only review.
# Any job that fails stops every deploy job: a guard refusal, a site build,
# a state store that needs bootstrapping after an Alchemy bump, or a merged
# site move with no flip all hold the release until fixed, or until a
# dispatch whose `surfaces` leave the stacks out.
#
# Each stack job re-plans, refuses a plan the guard refuses or that differs
# from the one approved at `alchemy-plan`, deploys, and smoke-checks each
# site, rolling back what it deployed when a check fails. It re-plans and
# guards on a flip release too, after the detach, holding the plan to the
# flip; the verify job did the same before the detach, so a refusal there
# moves nothing. A record job per site its Worker serves then leaves the
# site's Deployment record in the `production-records` Environment, which
# has no reviewer.
#
# `plan` runs scripts/release-plan.ts. For each surface it finds the commit
# production last deployed (the GitHub Deployment records the jobs below
# leave, tied to a surface by job name and checked against the run that made
# them), diffs it against this run's commit,
# and outputs one boolean per surface. Because the baseline is what production
# runs rather than what a push changed, a release that was skipped, cancelled
# or rejected strands nothing: the next one finds the same gap. A changed
# surface with a dev tier ships only if dev already deployed the same content.
# When nothing differs, every deploy job is skipped and nobody is asked to
# approve anything.
#
# `build` re-runs the install + build + test CI does, so nothing ships from a
# broken tree, and it runs before the gate so the approver is never asked to
# release a commit that fails its tests.
#
# One approval per gate: every deploy job needs [plan, build, sites,
# alchemy-plan], so they all reach the gate at the same moment, and one review
# releases every job waiting on an Environment. A stack job also needs its
# flip-detach job, which is skipped at once on any release that is not a flip,
# so wait until every job shows Waiting before approving. A job reaching the
# gate later would need a review of its own — scripts/tests/deploy-workflows.test.ts
# holds the `needs:` lists.
#
# After each Worker deploy (cire-api, cire-invites, osn-api, zap-api),
# scripts/smoke-check.ts asks the Worker's own hosts, for up to a minute,
# whether the new version serves. One that answers wrongly is rolled back to
# the version before it, through the Cloudflare API with the job's own token,
# and its job fails, so GitHub marks the job's Deployment record `failure`: the
# planner keeps counting the previous release as what production runs, and the
# next release offers the surface again. A rollback restores the Worker's code
# only — the D1 migrations the job applied stay — and never crosses a secret
# change: Cloudflare refuses that, and the script leaves it to a person. Each
# deploy step writes the version it deployed to WRANGLER_OUTPUT_FILE_PATH, and
# the check rolls back only while that version is the newest deployment.
#
# The job names are load-bearing: the planner maps a Deployment record to a
# surface by the name of the job that made it (scripts/deploy-surfaces.ts).
# Rename a job there and here together, or the next release ships that
# surface again because it finds no record for it.
#
# Credentials: CLOUDFLARE_API_TOKEN is held only by the `production`
# Environment, so only an approved job can read it. The `production`
# Environment also allows `main` alone; the plan job refuses any other ref
# before the build starts. In the Alchemy jobs it reaches only the steps that
# check the token, read the state store, snapshot or compare deployments,
# read the Workers' custom domains, plan, deploy and smoke-check, and in the
# Pages jobs only the deploy step; CLOUDFLARE_PAGES_DNS_TOKEN, which may move
# a Pages domain, reaches only the pages-domain steps: alchemy-plan's
# precheck, before any install, and the detach and attach jobs, which install
# nothing. The jobs that install a narrower tree than `sites` and hold a
# credential (alchemy-plan, the stack, verify and Pages jobs) restore no
# dependency cache, which jobs holding no secret also write. Every checkout
# sets `persist-credentials: false`: no step fetches or pushes, so the job
# token never sits in .git/config while dependency code runs.
# shared/infra/tests/workflow-secrets.test.ts holds this.
on:
  # 20:17 UTC — 07:17 in Sydney in summer time, 06:17 in winter, so the
  # release waits for approval at the start of the owner's day with the
  # previous day's merges in it. Off the hour: GitHub delays and drops
  # scheduled runs most at the top of the hour.
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      surfaces:
        description: "Surfaces to consider, comma or space separated: cire_api cire_invites cire_host cire_vendor cire_landing osn_api osn_social musubi_landing zap_api. Empty means all."
        type: string
        required: false
        default: ""
      force:
        description: "Ship those surfaces even if production already runs this commit's content, and skip the dev check. For changes no path shows: a repo Variable, a hand-run wrangler deploy or rollback."
        type: boolean
        required: false
        default: false
      flip:
        description: "A site whose domain this release moves from its Pages project to its Worker, at low traffic: one PRODUCTION_SITE_MODES sets to worker. Set surfaces to that site alone. Empty for none."
        type: string
        required: false
        default: ""
      unflip:
        description: "A site set back to staged whose Worker this release lets give up its production host; the attach job then puts the host back on its Pages project. Set surfaces to that site alone. Empty for none."
        type: string
        required: false
        default: ""
      attach:
        description: "A site whose domain goes back on its Pages project, the rollback of a flip. The release runs that alone: leave every other input empty. Empty for none."
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One release at a time. While a run is in progress — including waiting for
# approval — the next trigger waits as the group's one pending run, and a
# newer trigger replaces that pending run. Never cancel-in-progress: a
# cancelled deploy can leave production's D1 migrated ahead of its Worker.
# The ref is in the name so a dispatch from another branch (which the plan job
# refuses) cannot replace main's pending release.
concurrency:
  group: production-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every Alchemy run sends no telemetry.
  DO_NOT_TRACK: "1"

jobs:
  # ── What production is missing ──────────────────────────────────────────
  plan:
    name: Work out what production is missing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block replaces the workflow's, so `contents` is restated.
    # `deployments` reads the Deployment records and their statuses;
    # `actions` reads the runs and jobs that tie a record to a surface.
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
      cire_api: ${{ steps.plan.outputs.cire_api }}
      cire_invites: ${{ steps.plan.outputs.cire_invites }}
      cire_host: ${{ steps.plan.outputs.cire_host }}
      cire_vendor: ${{ steps.plan.outputs.cire_vendor }}
      cire_landing: ${{ steps.plan.outputs.cire_landing }}
      osn_api: ${{ steps.plan.outputs.osn_api }}
      osn_social: ${{ steps.plan.outputs.osn_social }}
      musubi_landing: ${{ steps.plan.outputs.musubi_landing }}
      zap_api: ${{ steps.plan.outputs.zap_api }}
      stack_musubi: ${{ steps.plan.outputs.stack_musubi }}
      stack_cire: ${{ steps.plan.outputs.stack_cire }}
      any_site: ${{ steps.plan.outputs.any_site }}
      any_stack: ${{ steps.plan.outputs.any_stack }}
      stacks: ${{ steps.plan.outputs.stacks }}
      flip: ${{ steps.plan.outputs.flip }}
      unflip: ${{ steps.plan.outputs.unflip }}
      attach: ${{ steps.plan.outputs.attach }}
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A production release runs from main only; this run is on $GITHUB_REF."
          exit 1

      # Full history: the planner diffs against whichever commit each surface
      # last deployed, which can be any distance back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # No install: the planner imports only Bun and Node built-ins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Compare each surface with what production runs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SURFACES: ${{ inputs.surfaces }}
          FORCE: ${{ inputs.force }}
          FLIP: ${{ inputs.flip }}
          UNFLIP: ${{ inputs.unflip }}
          ATTACH: ${{ inputs.attach }}
        run: bun run scripts/release-plan.ts

  # ── Gate ─────────────────────────────────────────────────────────────────
  # The same install + build + test as deploy.yml's `build` job. If it fails,
  # every deploy job below is skipped.
  build:
    name: Build & Test
    needs: [plan]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      # See ci.yml's `build-test` job for why this is keyed on the three
      # astro.config.mjs files rather than bun.lock or github.sha.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/vendor/node_modules/.astro
            cire/host/node_modules/.astro
            cire/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/vendor/astro.config.mjs', 'cire/host/astro.config.mjs', 'cire/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # The async-D1-driver lane sits outside the vitest include glob, so
      # `bun run test` does not reach it, and D1 is what this deploys against.
      # Serial: concurrent Miniflare workerd instances contend.
      - name: D1 integration tests
        run: bun run test:d1

  # ── The production sites, built once ─────────────────────────────────────
  # Each site a shipping stack deploys, or whose own Pages job ships, built
  # with the production values its build bakes in. A staged site's Worker and
  # its Pages project serve the same build, so the comparison after the stack
  # job compares two copies of one build. No Environment and no secret: the
  # build values are public, and nothing here can deploy.
  sites:
    name: Build the production sites
    needs: [plan]
    if: needs.plan.outputs.any_site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `astro build` runs on Node, and astro 7.4 requires Node >= 22.23.4.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      # turbo.json's `build` task hashes `PUBLIC_*`, `VITE_*` and `SITE`, and
      # these differ from the `build` job's, so no turbo cache could serve a
      # build here and none is restored: each really runs `astro build`.
      # Restoring the font metadata keeps that from fetching
      # fonts.google.com again; see ci.yml's `build-test` job for the key.
      - name: Cache Astro font metadata
        uses: actions/cache@v4
        with:
          path: |
            cire/host/node_modules/.astro
            cire/vendor/node_modules/.astro
            cire/landing/node_modules/.astro
            musubi/landing/node_modules/.astro
          key: ${{ runner.os }}-astro-fonts-${{ hashFiles('bun.lock', 'cire/host/astro.config.mjs', 'cire/vendor/astro.config.mjs', 'cire/landing/astro.config.mjs', 'musubi/landing/astro.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-astro-fonts-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      # The organiser portal. Its PUBLIC_* vars bake in at build time; sign-in
      # is a redirect through cire-api, so no issuer var.
      - name: Build cire/host
        if: needs.plan.outputs.stack_cire == 'true' || needs.plan.outputs.cire_host == 'true'
        run: bun run build --filter=@cire/host
        env:
          PUBLIC_CIRE_API_URL: https://api.cireweddings.com
          # The account pages (passkeys, recovery codes) live on musubi's own
          # origin — the security panel deep-links there.
          PUBLIC_OSN_ACCOUNT_URL: https://musubi.social
          # The organiser's "preview / view live invite" link.
          PUBLIC_CIRE_WEB_URL: https://invite.cireweddings.com
          # The RSVP editor's privacy link: the marketing site's /privacy.
          PUBLIC_MARKETING_URL: https://cireweddings.com
          # Marks a production deploy build: the CSP integration then fails
          # the build unless the cire-api URL is https://api.cireweddings.com.
          # turbo hashes it, so this build never replays the `build` job's
          # tier-less one. A literal, so the tier is always `production` here.
          OSN_DEPLOY_TIER: production

      # The vendor self-service portal.
      - name: Build cire/vendor
        if: needs.plan.outputs.stack_cire == 'true' || needs.plan.outputs.cire_vendor == 'true'
        run: bun run build --filter=@cire/vendor
        env:
          PUBLIC_CIRE_API_URL: https://api.cireweddings.com
          # Account management deep link (see the cire/host build above).
          PUBLIC_OSN_ACCOUNT_URL: https://musubi.social
          # A deploy build (see the cire/host build above).
          OSN_DEPLOY_TIER: production

      # The marketing site on the apex cireweddings.com:
      #   PUBLIC_ORGANISER_URL — target of the primary "Create your invitation"
      #     CTA: the organiser portal.
      #   SITE — canonical origin for SEO meta; the apex cireweddings.com.
      - name: Build cire/landing
        if: needs.plan.outputs.stack_cire == 'true' || needs.plan.outputs.cire_landing == 'true'
        run: bun run build --filter=@cire/landing
        env:
          PUBLIC_ORGANISER_URL: https://host.cireweddings.com
          SITE: https://cireweddings.com

      # VITE_TURNSTILE_SITEKEY is the client half of the Turnstile gate, and is
      # not optional here: osn-api holds TURNSTILE_SECRET_KEY, so
      # `/register/begin` and the identifier-bound `/login/passkey/begin` fail
      # closed (400 turnstile_failed) on any request without a token. An unset
      # or renamed repo Variable expands to "", the app reads that as "no
      # widget", and every register and login fails — with a green build and a
      # green deploy, which the unit tests cannot see. Fail the build instead.
      # Same repo Variable as the cire builds (one widget, one sitekey);
      # musubi.social must be in the widget's Domains list.
      - name: Require the Turnstile sitekey
        if: needs.plan.outputs.stack_musubi == 'true' || needs.plan.outputs.osn_social == 'true'
        run: |
          if [ -z "${VITE_TURNSTILE_SITEKEY}" ]; then
            echo "::error::Repo Variable PUBLIC_TURNSTILE_SITEKEY is empty or unset."
            echo "osn-api has TURNSTILE_SECRET_KEY set, so a build without the sitekey"
            echo "fails closed on every sign-in and registration. See wiki/shared/turnstile.md."
            exit 1
          fi
        env:
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      # The identity web app, including `/authorize`, the OIDC consent screen
      # osn-api redirects to. VITE_OSN_ISSUER_URL bakes in at build time;
      # without it the bundle falls back to http://localhost:4000 and every
      # call from the deployed app dials the user's own machine.
      - name: Build musubi/social
        if: needs.plan.outputs.stack_musubi == 'true' || needs.plan.outputs.osn_social == 'true'
        run: bun run build --filter=@musubi/social
        env:
          VITE_OSN_ISSUER_URL: https://id.musubi.social
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      # musubi's marketing site on www.musubi.social; its sign-in and
      # get-started links go to the app.
      - name: Build musubi/landing
        if: needs.plan.outputs.stack_musubi == 'true' || needs.plan.outputs.musubi_landing == 'true'
        run: bun run build --filter=@musubi/landing
        env:
          SITE: https://www.musubi.social
          PUBLIC_APP_URL: https://musubi.social

      # Each warns when its bundle is over its budget, and fails, stopping the
      # release, on a source map anywhere in `dist`, which is served whole.
      # Each `build` script chains this guard too, but a turbo cache replay
      # skips the chained call; this checks what uploads either way
      # (wiki/conventions/bundle-size-guards.md).
      - name: Check cire/host bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true' || needs.plan.outputs.cire_host == 'true'
        run: ./scripts/guard-bundle-size.sh cire/host

      - name: Check cire/vendor bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true' || needs.plan.outputs.cire_vendor == 'true'
        run: ./scripts/guard-bundle-size.sh cire/vendor

      - name: Check cire/landing bundle size and refuse public source maps
        if: needs.plan.outputs.stack_cire == 'true' || needs.plan.outputs.cire_landing == 'true'
        run: ./scripts/guard-bundle-size.sh cire/landing

      - name: Check musubi/landing bundle size and refuse public source maps
        if: needs.plan.outputs.stack_musubi == 'true' || needs.plan.outputs.musubi_landing == 'true'
        run: ./scripts/guard-bundle-size.sh musubi/landing

      # A file at the root, so the artifact's paths start at the repository
      # root however many sites were built, and a reader can see which.
      - name: List the built sites
        run: |
          for dir in cire/host/dist cire/vendor/dist cire/landing/dist musubi/social/dist musubi/landing/dist; do
            if [ -d "$dir" ]; then echo "$dir"; fi
          done > production-sites.txt
          cat production-sites.txt

      # Hidden files included: musubi social's `.well-known/apple-app-site-association`
      # is what iOS reads to offer the app's passkeys, and a dot-directory is
      # left out otherwise.
      - name: Keep the built sites
        uses: actions/upload-artifact@v4
        with:
          name: production-sites
          path: |
            production-sites.txt
            cire/host/dist
            cire/vendor/dist
            cire/landing/dist
            musubi/social/dist
            musubi/landing/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ── Approval 1: the Alchemy plan ─────────────────────────────────────────
  # Runs only when a stack ships, in the `production` Environment, so its
  # review is the first of two. Before any install it checks that every
  # worker site of a shipping stack has its domain free, but the one a flip
  # names, which must still be on Pages (scripts/pages-domain.ts), so a cron
  # release never moves a domain. Then it plans each shipping stack, the log
  # kept in a file because raw Alchemy output can carry account values, and
  # runs the plan guard, keeping only its record: resource names, kinds,
  # actions and counts. The guard holds no credential.
  alchemy-plan:
    name: Plan the Alchemy stacks
    needs: [plan, build, sites]
    if: needs.plan.outputs.any_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Before any install: the narrow Pages and DNS token reaches no
      # dependency's code. The script imports only the repository's
      # import-free files.
      - name: Check each worker site's domain
        id: domains
        run: bun run scripts/pages-domain.ts precheck
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          STACKS: ${{ needs.plan.outputs.stacks }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DNS_TOKEN }}

      # The two production stacks' trees, no other workspace's, and no
      # cache: the cache is shared with jobs that hold no secret.
      - name: Install the production stacks' dependencies
        run: bun install --frozen-lockfile --filter @cire/infra --filter @musubi/infra

      # The stacks check each site's build for the production origins it
      # bakes in before they declare it.
      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      # The production token must reach the production account and no other.
      # Every step below that holds it runs only after this passes.
      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A plan reads the state store; an Alchemy bump that changed the store's
      # version leaves it unreadable until the store is bootstrapped again.
      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Alchemy plans against its own state; a Worker a smoke check rolled
      # back still matches it, so --force re-uploads what the commit declares,
      # here and in the stack job alike.
      - name: Record the cire site Workers' newest deployments
        id: snapshot_cire
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments-cire.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record the musubi site Workers' newest deployments
        id: snapshot_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments-musubi.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains each shipping stack's site Workers hold now: the
      # guard shows and judges the change each plan makes to them, which
      # its text does not.
      - name: Read the cire site Workers' custom domains
        id: worker_domains_cire
        if: needs.plan.outputs.stack_cire == 'true'
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains-cire.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Read the musubi site Workers' custom domains
        id: worker_domains_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains-musubi.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan the cire stack
        id: plan_cire
        if: needs.plan.outputs.stack_cire == 'true'
        working-directory: cire/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/cire.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot_cire.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire plan log, as the step failed
        if: ${{ failure() && steps.plan_cire.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/cire.log"

      - name: Plan the musubi stack
        id: plan_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        working-directory: musubi/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/musubi.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot_musubi.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi plan log, as the step failed
        if: ${{ failure() && steps.plan_musubi.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/musubi.log"

      # Names, kinds, actions and counts to the run summary; fails on a plan
      # the guard refuses. Its record is what the stack job's re-plan must
      # equal.
      - name: Guard the cire plan
        id: guard_cire
        if: needs.plan.outputs.stack_cire == 'true'
        working-directory: cire/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/cire.log" --out "$RUNNER_TEMP/alchemy-plan/cire.json" --domains "$RUNNER_TEMP/domains-cire.json" ${FLIP:+--flip "$FLIP"} ${UNFLIP:+--unflip "$UNFLIP"}
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          UNFLIP: ${{ needs.plan.outputs.unflip }}

      - name: Guard the musubi plan
        id: guard_musubi
        if: needs.plan.outputs.stack_musubi == 'true'
        working-directory: musubi/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/musubi.log" --out "$RUNNER_TEMP/alchemy-plan/musubi.json" --domains "$RUNNER_TEMP/domains-musubi.json" ${FLIP:+--flip "$FLIP"} ${UNFLIP:+--unflip "$UNFLIP"}
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          UNFLIP: ${{ needs.plan.outputs.unflip }}

      - name: Keep the approved plans
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/alchemy-plan/
          if-no-files-found: error
          retention-days: 7

  # ═══ The deploy jobs ════════════════════════════════════════════════════
  #
  # One job per surface a Wrangler or Pages deploy ships, and one per
  # production stack, so a failure in one leaves the others to finish, and
  # each `if:` reads its own output. Every job:
  #   - needs [plan, build, sites, alchemy-plan] — the gate rule above, and a
  #     stack job its flip-detach job too; `!cancelled()` lets it run when
  #     `sites` or `alchemy-plan` was skipped because nothing needed it, and
  #     never when either failed;
  #   - takes the group `deploy-production-<surface>` (a stack job, and its
  #     verify and detach jobs, `deploy-production-<stack>`) without
  #     cancelling, so two production deploys of one surface never overlap,
  #     and they run in the order they were created, which is what lets the
  #     planner read the newest successful record as what production runs.
  #     No other workflow takes these groups.

  # ── cire API + D1 ────────────────────────────────────────────────────────
  # Migrations are applied to the REMOTE prod DB FIRST, then the Worker is
  # deployed — both in one job so the order is guaranteed and the migration
  # runs once. `--env production` selects the prod D1 binding explicitly; the
  # top-level block carries the same id today, but naming the env means a
  # future split of the two cannot silently retarget this step.
  deploy-cire-api:
    name: Deploy cire/api — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.cire_api == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-cire-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      # The Alchemy tree (@shared/infra and the @<product>/infra stacks) is
      # about 100 packages and over 1 GB unpacked, and only a job that builds,
      # tests or type-checks those packages loads it; every other job installs
      # without them.
      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      # Fail the deploy if cire/api/wrangler.toml still carries the placeholder
      # (or empty) D1 database_id — deploying against a non-existent DB would
      # silently break every D1 read/write in prod. Wired correctly today; this
      # is a regression guard (no creds needed).
      - name: Guard against placeholder D1 database_id
        run: bun run scripts/check-d1-database-id.ts

      # Secrets that must NOT exist on the production Worker. RESEND_API_URL
      # points mail at a local Resend emulator; a deployed cire-api refuses it
      # and sends no mail at all, so refuse the deploy until it is deleted.
      # Read-only (`wrangler secret list`); never prints values. A committed
      # var is caught earlier, by cire/api/tests/lib/resend-email.test.ts.
      - name: Preflight — no forbidden prod secrets are set
        run: |
          set -euo pipefail
          set_names="$(bunx wrangler secret list --env production | grep -oE '"name" *: *"[^"]+"' | sed -E 's/.*"name" *: *"([^"]+)".*/\1/')"
          forbidden="RESEND_API_URL"
          present=""
          for name in $forbidden; do
            if printf '%s\n' "$set_names" | grep -qx "$name"; then
              present="$present $name"
            fi
          done
          if [ -n "$present" ]; then
            echo "::error::cire-api has forbidden prod secret(s) set:$present — delete with 'wrangler secret delete <NAME> --env production'. These exist only for local emulation."
            exit 1
          fi
          echo "No forbidden cire-api prod secrets are set."
        working-directory: cire/api

      # Idempotent: wrangler skips already-applied migrations, so re-running the
      # job is safe. Production is never reset and never seeded.
      - name: Apply cire D1 migrations (remote prod)
        run: bun run --cwd cire/db db:migrate:prod

      - name: Deploy cire/api Worker
        run: bunx wrangler deploy --env production
        working-directory: cire/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # `wrangler deploy` succeeds when the upload does, not when the Worker
      # serves. Asks api.cireweddings.com for up to a minute, and rolls the
      # Worker back if it answers wrongly (scripts/smoke-check.ts).
      - name: Smoke check, rolling back on failure
        run: bun run scripts/smoke-check.ts cire_api production
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

  # ── cire invites (Astro SSR → Cloudflare Worker) ─────────────────────────
  # The guest site is Astro SSR on Cloudflare (output: "server", the
  # @astrojs/cloudflare adapter). It resolves which wedding to render from the
  # path or the redacted query per request. The adapter emits a Worker with
  # Static Assets: `dist/server/entry.mjs`, `dist/client/`, and a generated
  # `dist/server/wrangler.json` that extends the committed
  # cire/invites/wrangler.jsonc (worker name + custom-domain route).
  # PUBLIC_API_URL / PUBLIC_SITE_URL bake in at build time, which is why dev
  # has its own build in deploy.yml and cannot re-point this one.
  deploy-cire-invites:
    name: Deploy cire/invites — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.cire_invites == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-cire-invites
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `astro build` runs on Node, and astro 7.4 requires Node >= 22.23.4.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      #   PUBLIC_GOOGLE_MAPS_EMBED_KEY is an optional referrer-restricted Embed
      #   key. PUBLIC_TURNSTILE_SITEKEY is the optional Cloudflare Turnstile
      #   sitekey (public, bot protection); the build omits the widget cleanly
      #   when it is absent. The matching TURNSTILE_SECRET_KEY is a
      #   `wrangler secret` on the cire-api Worker (see production-deploy.md).
      - name: Build cire/invites
        run: bun run build --filter=@cire/invites
        env:
          PUBLIC_API_URL: https://api.cireweddings.com
          # The guest site lives on the `invite.` subdomain; the apex serves
          # the marketing landing site.
          PUBLIC_SITE_URL: https://invite.cireweddings.com
          # Where the guest bare domain (`/`) sends visitors. A multi-tenant
          # guest site has no single wedding to show at its root, so it hands
          # off to the apex marketing landing. Matches the in-code default; set
          # explicitly so the destination is visible in the deploy config.
          PUBLIC_MARKETING_URL: https://cireweddings.com
          # No OSN issuer var: the guest site never talks to the issuer. "Link
          # my Pulse account" navigates to cire-api's /api/auth/oidc/start,
          # and cire-api runs the exchange.
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          # Google Maps Embed API key (public, referrer-restricted to
          # *.cireweddings.com). Present ⇒ real Embed iframe; absent ⇒ CSS-card
          # fallback.
          PUBLIC_GOOGLE_MAPS_EMBED_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_EMBED_KEY }}
          # The commit this release is built from. The footer prints its first
          # seven characters as the version, so a report from a phone says
          # which build it was. A `PUBLIC_*` var is in turbo's build hash, so
          # a new commit never replays an older `dist/`.
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Marks a production deploy build: the CSP integration then fails
          # the build unless the cire-api URL is https://api.cireweddings.com.
          # turbo hashes it, so this build never replays the `build` job's
          # tier-less one. A literal, so the tier is always `production` here.
          OSN_DEPLOY_TIER: production

      # Warns (the step stays green) when the SSR bundle is over its budget
      # in scripts/bundle-size-budgets.txt; `ci.yml` annotates the same on
      # the pull request before it merges. Fails, and stops the release, on a
      # source map under `dist/client`, which is served publicly as Static
      # Assets, or a missing or empty `dist`.
      - name: Check cire/invites SSR bundle size and refuse public source maps
        run: ./scripts/guard-bundle-size.sh cire/invites

      # `@astrojs/cloudflare` writes a top-level `"legacy_env": true` into the
      # generated `dist/server/wrangler.json`. Wrangler 4.111+ hard-errors on
      # that field ("legacy_env field is no longer supported"). Removing it is
      # a no-op for behaviour — `legacy_env: true` was the default — and
      # harmless if a future adapter stops emitting it.
      - name: Strip unsupported legacy_env from generated config
        run: node -e "const fs=require('fs'),f='dist/server/wrangler.json',c=JSON.parse(fs.readFileSync(f,'utf8'));delete c.legacy_env;fs.writeFileSync(f,JSON.stringify(c))"
        working-directory: cire/invites

      # Production traces every guest request. What keeps `?slug=`, `?code=` and
      # the Stripe `&gift=` out of those traces is `redact_query_string` in the
      # committed wrangler.jsonc, which the adapter copies into this generated
      # file. Check the file that deploys, not the one committed: an adapter
      # that drops the key fails here.
      - name: Check the generated config redacts query strings
        run: bun run ../../scripts/check-trace-redaction.ts --generated dist/server/wrangler.json
        working-directory: cire/invites

      # The adapter's generated config carries `main`, the ASSETS binding
      # (→ dist/client), the worker name, and the invite.cireweddings.com
      # custom-domain route.
      - name: Deploy cire/invites (Worker)
        run: bunx wrangler deploy --config dist/server/wrangler.json
        working-directory: cire/invites
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # Rolls back cire-invites, the Worker the generated config names.
      - name: Smoke check, rolling back on failure
        run: bun run scripts/smoke-check.ts cire_invites production
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

  # ── cire host (Astro → Cloudflare Pages) ─────────────────────────────────
  # The organiser portal, in its own Pages project, which serves
  # host.cireweddings.com until the site's domain moves to its Worker
  # (shared/infra/src/production-sites.ts). Deploys the `sites` job's build.
  deploy-cire-host:
    name: Deploy cire/host — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.cire_host == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-cire-host
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The root's tree alone, which pins the Wrangler that deploys the
      # site; nothing else here reads node_modules. No cache: the cache is
      # shared with jobs that hold no secret.
      - name: Install the root's dependencies
        run: bun install --frozen-lockfile --filter osn

      # The `sites` job's build, the one the stack's staged Worker serves.
      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Deploy cire/host to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name cire-host
        working-directory: cire/host
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ── cire vendor (Astro → Cloudflare Pages) ───────────────────────────────
  # The vendor self-service portal, in the `cire-vendor` Pages project with
  # vendor.cireweddings.com. Deploys the `sites` job's build.
  deploy-cire-vendor:
    name: Deploy cire/vendor — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.cire_vendor == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-cire-vendor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The root's tree alone, which pins the Wrangler that deploys the
      # site; nothing else here reads node_modules. No cache: the cache is
      # shared with jobs that hold no secret.
      - name: Install the root's dependencies
        run: bun install --frozen-lockfile --filter osn

      # The `sites` job's build, the one the stack's staged Worker serves.
      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Deploy cire/vendor to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name cire-vendor
        working-directory: cire/vendor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ── cire landing (Astro → Cloudflare Pages) ──────────────────────────────
  # The marketing site on the apex cireweddings.com, in the `cire-landing`
  # Pages project (wiki/cire/cire-landing.md). Deploys the `sites` job's
  # build.
  deploy-cire-landing:
    name: Deploy cire/landing — production (apex)
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.cire_landing == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-cire-landing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The root's tree alone, which pins the Wrangler that deploys the
      # site; nothing else here reads node_modules. No cache: the cache is
      # shared with jobs that hold no secret.
      - name: Install the root's dependencies
        run: bun install --frozen-lockfile --filter osn

      # The `sites` job's build, the one the stack's staged Worker serves.
      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Deploy cire/landing to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name cire-landing
        working-directory: cire/landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ── osn/api (Worker + D1) ────────────────────────────────────────────────
  # osn-api (identity/auth) is a Cloudflare Worker with a custom-domain route
  # per env. Secrets are set out-of-band per tier (`wrangler secret put …
  # --env <tier>` or the set-osn-api-secret workflow); this job only migrates
  # and deploys.
  deploy-osn-api:
    name: Deploy osn/api — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.osn_api == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-osn-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      # Apply pending migrations to the remote prod osn D1 (`osn-db-prod`, the
      # `[env.production].d1_databases` binding) BEFORE the new Worker serves.
      # `--env production` selects that binding; idempotent — wrangler skips
      # already-applied migrations.
      - name: Apply osn D1 migrations (remote prod)
        run: bun run --cwd osn/db db:migrate:prod

      # Secret preflight: osn-api fails CLOSED at boot or request time when a
      # required secret is missing, so a `wrangler deploy` can report success
      # while every route answers 503. Assert the required secrets are set on
      # the prod Worker BEFORE promoting the new code. Read-only
      # (`wrangler secret list`); never prints values. Add a name here
      # whenever a new fail-closed secret gate lands.
      - name: Preflight — required prod secrets are set
        run: |
          set -euo pipefail
          required="OSN_PAIRWISE_SALT"
          set_names="$(bunx wrangler secret list --env production | grep -oE '"name" *: *"[^"]+"' | sed -E 's/.*"name" *: *"([^"]+)".*/\1/')"
          missing=""
          for name in $required; do
            if ! printf '%s\n' "$set_names" | grep -qx "$name"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::osn-api is missing required prod secret(s):$missing — set them with 'wrangler secret put <NAME> --env production' before deploying. osn-api fails closed on these, so deploying now would 503 every route."
            exit 1
          fi
          # Secrets that must NOT exist here. DEV_LOGIN_SECRET is the
          # passkey-less sign-in; the tier gate in build-deps.ts already keeps
          # the route unmounted on production, but a secret sitting on the
          # production Worker is one edit away from a credential bypass on
          # live weddings, so refuse the deploy until it is deleted.
          # RESEND_API_URL points mail at a local Resend emulator; osn-api
          # refuses to boot with it in a non-local tier (lib/email-layer.ts),
          # so deploying with it set would 503 every route.
          forbidden="DEV_LOGIN_SECRET RESEND_API_URL"
          present=""
          for name in $forbidden; do
            if printf '%s\n' "$set_names" | grep -qx "$name"; then
              present="$present $name"
            fi
          done
          if [ -n "$present" ]; then
            echo "::error::osn-api has forbidden prod secret(s) set:$present — delete with 'wrangler secret delete <NAME> --env production'. These exist only for the local/dev tiers."
            exit 1
          fi
          echo "All required osn-api prod secrets are set, and no forbidden ones."
        working-directory: osn/api

      - name: Deploy osn/api Worker
        run: bunx wrangler deploy --env production
        working-directory: osn/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # /health and /.well-known/jwks.json. A fail-closed secret the preflight
      # above does not list answers 503 here, and the Worker is rolled back.
      - name: Smoke check, rolling back on failure
        run: bun run scripts/smoke-check.ts osn_api production
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

  # ── musubi/social (Vite SPA → Cloudflare Pages) ──────────────────────────
  # The identity web app, including `/authorize`, the OIDC consent screen
  # osn-api redirects to. It is served on musubi.social, the same registrable
  # domain as its osn-api, because the session and OIDC binding cookies are
  # host-bound to the issuer and only ride along on same-site credentialed
  # fetches. Its host is also the WebAuthn RP ID. musubi.social is attached to
  # the `osn-social` Pages project in the dashboard (a Pages custom domain,
  # not a wrangler route). Deploys the `sites` job's build.
  deploy-osn-social:
    name: Deploy musubi/social — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.osn_social == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-osn-social
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The root's tree alone, which pins the Wrangler that deploys the
      # site; nothing else here reads node_modules. No cache: the cache is
      # shared with jobs that hold no secret.
      - name: Install the root's dependencies
        run: bun install --frozen-lockfile --filter osn

      # The `sites` job's build, the one the stack's staged Worker serves.
      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      # Idempotent: creates the project on the first run, no-ops after. The
      # helper swallows only "already exists" — a bad token or a rate limit
      # still fails the step.
      - name: Ensure the osn-social Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" osn-social main
        working-directory: musubi/social
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy musubi/social to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name osn-social --branch main --commit-dirty=true
        working-directory: musubi/social
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ── zap/api (Worker + D1) ────────────────────────────────────────────────
  # Zap has no dev tier, so this job has no dev deploy to check against; the
  # planner ships it on its own diff. The provisioning check skips both the
  # migrate and the deploy (green) while the production D1 id in
  # zap/api/wrangler.toml is a placeholder; it holds a real id today, so both
  # steps run.
  deploy-zap-api:
    name: Deploy zap/api — production
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.zap_api == 'true' && needs.build.result == 'success' && (needs.sites.result == 'success' || needs.sites.result == 'skipped') && (needs.alchemy-plan.result == 'success' || needs.alchemy-plan.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-zap-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs without the infra packages, so the
      # key a full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-noinfra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-noinfra-

      - name: Install dependencies except the infra packages
        run: bun install --frozen-lockfile --filter '!@*/infra'

      - name: Detect zap prod provisioning
        id: zapcheck
        run: |
          # Check ONLY the production D1 id — dev/staging legitimately keep placeholders.
          PROD_ID=$(awk '/\[\[env\.production\.d1_databases\]\]/{f=1} f&&/^database_id/{gsub(/.*= *"|".*/,""); print; exit}' zap/api/wrangler.toml)
          if [ -z "$PROD_ID" ] || [ "$PROD_ID" = "placeholder-replace-after-d1-create" ]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "zap-api prod D1 not provisioned yet — skipping deploy."
          else
            echo "zap-api prod D1 provisioned ($PROD_ID) — deploying."
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply zap D1 migrations (remote prod)
        if: steps.zapcheck.outputs.provisioned == 'true'
        run: bunx wrangler d1 migrations apply zap-db-prod --env production --remote
        working-directory: zap/api

      - name: Deploy zap/api Worker
        if: steps.zapcheck.outputs.provisioned == 'true'
        run: bunx wrangler deploy --env production
        working-directory: zap/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

      # Zap has no dev tier, so this is the first check its build ever gets.
      - name: Smoke check, rolling back on failure
        if: steps.zapcheck.outputs.provisioned == 'true'
        run: bun run scripts/smoke-check.ts zap_api production
        timeout-minutes: 5
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson

  # ── cire stack, flip release: verify, then detach ─────────────────────
  # A release dispatched with `flip` moves one site's domain from its Pages
  # project to its Worker, in three jobs that each ask their own approval:
  # stack-cire-verify plans the stack again and holds the plan to the flip
  # and to the one approved at alchemy-plan, deploying nothing;
  # flip-detach-cire takes the domain and its CNAME off the Pages project on
  # a fresh runner with nothing installed, so the narrow Pages and DNS token
  # reaches no dependency's code; then stack-cire-production plans and guards
  # once more, as on every release, and deploys, which attaches the domain to
  # the Worker. A refusal in the first detaches nothing; one in the last
  # leaves the host on neither, for `pages-domain.ts attach` to put back.
  # The site is unreachable from the detach until the deploy attaches it.
  stack-cire-verify:
    name: Verify the cire flip plan
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.flip != '' && needs.plan.outputs.stack_cire == 'true' && needs.build.result == 'success' && needs.sites.result == 'success' && needs.alchemy-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # The stack job's group: no other run touches the cire stack while a flip
    # is under way. No other workflow may join it — a newer job in a group
    # cancels the one pending there, which after the detach would be the
    # deploy that attaches the domain.
    concurrency:
      group: deploy-production-cire
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The cire stack's tree alone, and no cache: the cache is shared
      # with jobs that hold no secret.
      - name: Install the cire stack's dependencies
        run: bun install --frozen-lockfile --filter @cire/infra

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Fetch the approved plans
        uses: actions/download-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/approved

      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The same snapshot the deploy takes, so this plan has the same force.
      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains the site Workers hold now: the guard holds the
      # domain change to the one approved, as it holds the plan.
      - name: Read the cire site Workers' custom domains
        id: worker_domains
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan the cire stack again
        id: plan
        working-directory: cire/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/cire.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire plan log, as the step failed
        if: ${{ failure() && steps.plan.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/cire.log"

      # A flip changes one thing: the flip site's own update, with every other
      # line a noop, and the plan equal to the approved one.
      - name: Guard the flip plan, and hold it to the approved one
        id: guard
        working-directory: cire/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/cire.log" --out "$RUNNER_TEMP/plan-guard/cire.json" --domains "$RUNNER_TEMP/domains.json" --approved "$RUNNER_TEMP/approved/cire.json" --flip "$FLIP"
        env:
          FLIP: ${{ needs.plan.outputs.flip }}

  flip-detach-cire:
    name: Take the cire flip site's domain off Pages
    needs: [plan, stack-cire-verify]
    if: needs.plan.outputs.flip != '' && needs.stack-cire-verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-cire
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No install: pages-domain.ts imports only the repository's import-free
      # files. `detach` checks the token's reach, reads where the host is and
      # prints it, and refuses unless the host is on the site's own Pages
      # project and the site is a worker site in this commit.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Take the flip site's domain and CNAME off its Pages project
        id: detach
        run: bun run scripts/pages-domain.ts detach "$FLIP"
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DNS_TOKEN }}

  # ═══ cire stack, production: the cire sites ═══════════════════════════════
  # Declares the organiser portal, the vendor portal and the marketing site,
  # each at its mode in shared/infra/src/production-sites.ts; cire-api and the
  # guest site stay with their Wrangler jobs until their own steps of P3.
  stack-cire-production:
    name: Alchemy cire stack — production
    needs: [plan, build, sites, alchemy-plan, flip-detach-cire]
    if: ${{ !cancelled() && needs.plan.outputs.stack_cire == 'true' && needs.build.result == 'success' && needs.sites.result == 'success' && needs.alchemy-plan.result == 'success' && (needs.plan.outputs.flip == '' || needs.flip-detach-cire.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production-cire
      cancel-in-progress: false
    outputs:
      # False when the deploy or the compare failed: a Worker whose new
      # version may not have uploaded must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' }}
      cire_host_healthy: ${{ steps.smoke_cire_host.outcome == 'success' }}
      cire_vendor_healthy: ${{ steps.smoke_cire_vendor.outcome == 'success' }}
      cire_landing_healthy: ${{ steps.smoke_cire_landing.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The cire stack's tree alone, and no cache: the cache is shared
      # with jobs that hold no secret.
      - name: Install the cire stack's dependencies
        run: bun install --frozen-lockfile --filter @cire/infra

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Fetch the approved plans
        uses: actions/download-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/approved

      # The host each site's Worker serves at its mode, which its smoke check asks.
      - name: Production site hosts
        id: hosts
        run: bun run --cwd shared/infra production-hosts

      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # `deploy --yes` upgrades or bootstraps the state store without asking;
      # this refuses one that is not as this Alchemy expects before the plan
      # reads it. The plan itself runs without --yes, so it upgrades nothing.
      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains the site Workers hold now: the guard holds the
      # domain change to the one approved, as it holds the plan.
      - name: Read the cire site Workers' custom domains
        id: worker_domains
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The plan approved at alchemy-plan may be hours old, and on a flip
      # release the domain has left Pages since. Plan again, with the force
      # the deploy uses, and deploy only what the guard allows and what equals
      # the approved plan: on a flip, the flip site's update alone.
      - name: Plan the cire stack again
        id: plan
        working-directory: cire/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/cire.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire plan log, as the step failed
        if: ${{ failure() && steps.plan.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/cire.log"

      # The last step before the deploy: a refusal fails the job here.
      - name: Guard the plan, and hold it to the approved one
        id: guard
        working-directory: cire/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/cire.log" --out "$RUNNER_TEMP/plan-guard/cire.json" --domains "$RUNNER_TEMP/domains.json" --approved "$RUNNER_TEMP/approved/cire.json" ${FLIP:+--flip "$FLIP"} ${UNFLIP:+--unflip "$UNFLIP"}
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          UNFLIP: ${{ needs.plan.outputs.unflip }}

      # The stack refuses to deploy unless OSN_DEPLOY_TIER and both
      # credentials are set, and each site was built for production.
      - name: Deploy the cire stack
        id: deploy
        working-directory: cire/infra
        run: bun run deploy:production ${FORCE:+--force} > "$RUNNER_TEMP/alchemy.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the cire deploy log, as the step failed
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/alchemy.log"

      # Change counts alone to the run summary, never a line of the log.
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack cire "$RUNNER_TEMP/alchemy.log"

      # Runs after a deploy that failed part-way too, so a Worker it managed
      # to upload is still checked, and rolled back if it fails.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" --tier production cire_host cire_vendor cire_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/host, rolling back on failure
        id: smoke_cire_host
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_host production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_host_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_host_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/vendor, rolling back on failure
        id: smoke_cire_vendor
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_vendor production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_vendor_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_vendor_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check cire/landing, rolling back on failure
        id: smoke_cire_landing
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts cire_landing production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.cire_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.cire_landing_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.smoke_cire_host.outcome == 'failure' || steps.smoke_cire_vendor.outcome == 'failure' || steps.smoke_cire_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── musubi stack, flip release: verify, then detach ─────────────────────
  # A release dispatched with `flip` moves one site's domain from its Pages
  # project to its Worker, in three jobs that each ask their own approval:
  # stack-musubi-verify plans the stack again and holds the plan to the flip
  # and to the one approved at alchemy-plan, deploying nothing;
  # flip-detach-musubi takes the domain and its CNAME off the Pages project on
  # a fresh runner with nothing installed, so the narrow Pages and DNS token
  # reaches no dependency's code; then stack-musubi-production plans and
  # guards once more, as on every release, and deploys, which attaches the
  # domain to the Worker. A refusal in the first detaches nothing; one in the
  # last leaves the host on neither, for `pages-domain.ts attach` to put back.
  # The site is unreachable from the detach until the deploy attaches it.
  stack-musubi-verify:
    name: Verify the musubi flip plan
    needs: [plan, build, sites, alchemy-plan]
    if: ${{ !cancelled() && needs.plan.outputs.flip != '' && needs.plan.outputs.stack_musubi == 'true' && needs.build.result == 'success' && needs.sites.result == 'success' && needs.alchemy-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # The stack job's group: no other run touches the musubi stack while a
    # flip is under way. No other workflow may join it — a newer job in a
    # group cancels the one pending there, which after the detach would be
    # the deploy that attaches the domain.
    concurrency:
      group: deploy-production-musubi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The musubi stack's tree alone, and no cache: the cache is shared
      # with jobs that hold no secret.
      - name: Install the musubi stack's dependencies
        run: bun install --frozen-lockfile --filter @musubi/infra

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Fetch the approved plans
        uses: actions/download-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/approved

      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The same snapshot the deploy takes, so this plan has the same force.
      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains the site Workers hold now: the guard holds the
      # domain change to the one approved, as it holds the plan.
      - name: Read the musubi site Workers' custom domains
        id: worker_domains
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan the musubi stack again
        id: plan
        working-directory: musubi/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/musubi.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi plan log, as the step failed
        if: ${{ failure() && steps.plan.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/musubi.log"

      # A flip changes one thing: the flip site's own update, with every other
      # line a noop, and the plan equal to the approved one.
      - name: Guard the flip plan, and hold it to the approved one
        id: guard
        working-directory: musubi/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/musubi.log" --out "$RUNNER_TEMP/plan-guard/musubi.json" --domains "$RUNNER_TEMP/domains.json" --approved "$RUNNER_TEMP/approved/musubi.json" --flip "$FLIP"
        env:
          FLIP: ${{ needs.plan.outputs.flip }}

  flip-detach-musubi:
    name: Take the musubi flip site's domain off Pages
    needs: [plan, stack-musubi-verify]
    if: needs.plan.outputs.flip != '' && needs.stack-musubi-verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-production-musubi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No install: pages-domain.ts imports only the repository's import-free
      # files. `detach` checks the token's reach, reads where the host is and
      # prints it, and refuses unless the host is on the site's own Pages
      # project and the site is a worker site in this commit.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Take the flip site's domain and CNAME off its Pages project
        id: detach
        run: bun run scripts/pages-domain.ts detach "$FLIP"
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DNS_TOKEN }}

  # ═══ musubi stack, production: musubi social and musubi landing ═══════════
  # Declares the account app and the marketing site, each at its mode in
  # shared/infra/src/production-sites.ts; osn-api stays with its Wrangler job
  # until its own step of P3.
  stack-musubi-production:
    name: Alchemy musubi stack — production
    needs: [plan, build, sites, alchemy-plan, flip-detach-musubi]
    if: ${{ !cancelled() && needs.plan.outputs.stack_musubi == 'true' && needs.build.result == 'success' && needs.sites.result == 'success' && needs.alchemy-plan.result == 'success' && (needs.plan.outputs.flip == '' || needs.flip-detach-musubi.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production-musubi
      cancel-in-progress: false
    outputs:
      # False when the deploy or the compare failed: a Worker whose new
      # version may not have uploaded must not record success.
      deployed: ${{ steps.deploy.outcome == 'success' && steps.deployments.outcome == 'success' }}
      osn_social_healthy: ${{ steps.smoke_osn_social.outcome == 'success' }}
      musubi_landing_healthy: ${{ steps.smoke_musubi_landing.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The musubi stack's tree alone, and no cache: the cache is shared
      # with jobs that hold no secret.
      - name: Install the musubi stack's dependencies
        run: bun install --frozen-lockfile --filter @musubi/infra

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      - name: Fetch the approved plans
        uses: actions/download-artifact@v4
        with:
          name: alchemy-plan
          path: ${{ runner.temp }}/approved

      # The host each site's Worker serves at its mode, which its smoke check asks.
      - name: Production site hosts
        id: hosts
        run: bun run --cwd shared/infra production-hosts

      - name: Check the token reaches only the production account
        id: token
        run: bun run --cwd shared/infra token:check -- --tier production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # `deploy --yes` upgrades or bootstraps the state store without asking;
      # this refuses one that is not as this Alchemy expects before the plan
      # reads it. The plan itself runs without --yes, so it upgrades nothing.
      - name: Check the production state store
        id: state
        run: |
          bun run --cwd shared/infra state:check || {
            echo "::error::The production Alchemy state store does not answer as this Alchemy expects. Run the Alchemy state store workflow, tier production, bootstrap, then check."
            exit 1
          }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record each Worker's newest deployment
        id: snapshot
        run: bun run scripts/worker-deployments.ts snapshot "$RUNNER_TEMP/deployments.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The custom domains the site Workers hold now: the guard holds the
      # domain change to the one approved, as it holds the plan.
      - name: Read the musubi site Workers' custom domains
        id: worker_domains
        run: bun run scripts/worker-deployments.ts domains "$RUNNER_TEMP/domains.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The plan approved at alchemy-plan may be hours old, and on a flip
      # release the domain has left Pages since. Plan again, with the force
      # the deploy uses, and deploy only what the guard allows and what equals
      # the approved plan: on a flip, the flip site's update alone.
      - name: Plan the musubi stack again
        id: plan
        working-directory: musubi/infra
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          bun run plan:production ${FORCE:+--force} > "$RUNNER_TEMP/plan/musubi.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi plan log, as the step failed
        if: ${{ failure() && steps.plan.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/plan/musubi.log"

      # The last step before the deploy: a refusal fails the job here.
      - name: Guard the plan, and hold it to the approved one
        id: guard
        working-directory: musubi/infra
        run: bun run plan:guard -- --log "$RUNNER_TEMP/plan/musubi.log" --out "$RUNNER_TEMP/plan-guard/musubi.json" --domains "$RUNNER_TEMP/domains.json" --approved "$RUNNER_TEMP/approved/musubi.json" ${FLIP:+--flip "$FLIP"} ${UNFLIP:+--unflip "$UNFLIP"}
        env:
          FLIP: ${{ needs.plan.outputs.flip }}
          UNFLIP: ${{ needs.plan.outputs.unflip }}

      # The stack refuses to deploy unless OSN_DEPLOY_TIER and both
      # credentials are set, and each site was built for production.
      - name: Deploy the musubi stack
        id: deploy
        working-directory: musubi/infra
        run: bun run deploy:production ${FORCE:+--force} > "$RUNNER_TEMP/alchemy.log" 2>&1
        env:
          FORCE: ${{ steps.snapshot.outputs.force == 'true' && 'yes' || '' }}
          DO_NOT_TRACK: "1"
          OSN_DEPLOY_TIER: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Raw Alchemy output stays out of the public run log unless the step
      # failed; GitHub masks every secret the job holds in what it prints.
      - name: Show the musubi deploy log, as the step failed
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        run: cat "$RUNNER_TEMP/alchemy.log"

      # Change counts alone to the run summary, never a line of the log.
      - name: Summarise the plan
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: bun run --cwd shared/infra plan-summary -- --stack musubi "$RUNNER_TEMP/alchemy.log"

      # Runs after a deploy that failed part-way too, so a Worker it managed
      # to upload is still checked, and rolled back if it fails.
      - name: Find what the deploy changed
        id: deployments
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        run: bun run scripts/worker-deployments.ts compare "$RUNNER_TEMP/deployments.json" --tier production osn_social musubi_landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check musubi/social, rolling back on failure
        id: smoke_osn_social
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts osn_social production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.osn_social_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.osn_social_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke check musubi/landing, rolling back on failure
        id: smoke_musubi_landing
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 5
        run: bun run scripts/smoke-check.ts musubi_landing production
        env:
          SMOKE_ORIGIN: ${{ steps.hosts.outputs.musubi_landing_origin }}
          SMOKE_DEPLOYMENT: ${{ steps.deployments.outputs.musubi_landing_deployment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Fail when any check failed
        if: ${{ !cancelled() && (steps.deployments.outcome == 'failure' || steps.smoke_osn_social.outcome == 'failure' || steps.smoke_musubi_landing.outcome == 'failure') }}
        run: |
          echo "::error::A smoke check failed, or the deployments could not be read; see the steps above."
          exit 1

  # ── musubi stack's record jobs ─────────────────────────────────────────────
  # One per site whose Worker serves its production host. Each runs when the
  # stack job deployed and its site's check passed, and leaves that site's
  # Deployment record in `production-records`, named for the site:
  # scripts/release-plan.ts reads records by job name. A staged site's
  # record is its Pages job's.
  record-musubi-landing:
    name: Record musubi/landing — production
    needs: [stack-musubi-production]
    if: ${{ !cancelled() && needs.stack-musubi-production.outputs.deployed == 'true' && needs.stack-musubi-production.outputs.musubi_landing_healthy == 'true' }}
    runs-on: ubuntu-latest
    environment: production-records
    timeout-minutes: 2
    steps:
      - name: Record the production deploy
        run: echo "musubi-landing deployed and passed its smoke check in this run's musubi stack job."

  # ── The staged sites against Pages ───────────────────────────────────────
  # After each stack job, asks each staged site's Worker (its spare host) and
  # its Pages project (the production host) the same paths, and keeps the
  # report (scripts/site-parity.ts). The owner reads it before the site's
  # flip; a difference (exit 1) does not fail the job. The last step fails it
  # on every comparison that compared nothing: Cloudflare answering in a
  # site's place (exit 3: a challenge, an Access redirect, a 429, Cloudflare's
  # own 403 page), a usage error (exit 2) before any request, an error that
  # stopped the script (exit 4), a comparison step that ran but wrote no exit
  # code (its timeout) or any other, and an exit of 0 or 1 with no report.
  # No Environment and no secret: both hosts are public.
  site-parity:
    name: Compare the staged sites with Pages
    needs:
      [
        plan,
        sites,
        stack-cire-production,
        stack-musubi-production,
        deploy-cire-host,
        deploy-cire-vendor,
        deploy-cire-landing,
        deploy-osn-social,
      ]
    if: ${{ !cancelled() && needs.sites.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No install: the script imports only Bun, Node and the repository's
      # import-free files.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Fetch the built sites
        uses: actions/download-artifact@v4
        with:
          name: production-sites
          path: ${{ runner.temp }}/production-sites

      # Outside the checkout, and checked before any build reaches it: the
      # sites job ran third-party build code with no secret, so only the
      # site builds come in, never a file a later step runs.
      - name: Check the built sites, then put them in place
        id: place_sites
        run: bun run scripts/production-sites-artifact.ts "$RUNNER_TEMP/production-sites"

      # Each comparison writes its exit code as the step output `exit`, for
      # the last step to read.
      - name: Compare the staged cire sites
        id: parity_cire
        if: needs.stack-cire-production.outputs.deployed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          status=0
          bun run scripts/site-parity.ts --stack cire --out "$RUNNER_TEMP/site-parity/cire.json" || status=$?
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Compare the staged musubi sites
        id: parity_musubi
        if: needs.stack-musubi-production.outputs.deployed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          status=0
          bun run scripts/site-parity.ts --stack musubi --out "$RUNNER_TEMP/site-parity/musubi.json" || status=$?
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Keep the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: site-parity
          path: ${{ runner.temp }}/site-parity/
          if-no-files-found: ignore

      # A step's outcome is `skipped` only when its stack did not deploy; a
      # step its timeout stopped ran, but wrote no exit code.
      - name: Fail when a comparison compared nothing
        if: ${{ !cancelled() }}
        env:
          PARITY_CIRE_EXIT: ${{ steps.parity_cire.outputs.exit }}
          PARITY_CIRE_OUTCOME: ${{ steps.parity_cire.outcome }}
          PARITY_MUSUBI_EXIT: ${{ steps.parity_musubi.outputs.exit }}
          PARITY_MUSUBI_OUTCOME: ${{ steps.parity_musubi.outcome }}
        run: |
          if [ "$PARITY_CIRE_EXIT" = 3 ] || [ "$PARITY_MUSUBI_EXIT" = 3 ]; then
            echo "::error::Cloudflare answered in place of a staged site, so its comparison holds nothing; see the comparison steps above. This is the zone's configuration, such as Bot Fight Mode, not the site."
            exit 1
          fi
          if [ "$PARITY_CIRE_EXIT" = 2 ] || [ "$PARITY_MUSUBI_EXIT" = 2 ]; then
            echo "::error::site-parity refused its arguments, so it compared nothing; see the comparison steps above."
            exit 1
          fi
          if [ "$PARITY_CIRE_EXIT" = 4 ] || [ "$PARITY_MUSUBI_EXIT" = 4 ]; then
            echo "::error::site-parity stopped on an error before it finished, so its report is missing; see the comparison steps above."
            exit 1
          fi
          check() {
            [ "$2" = skipped ] && return 0
            case "$3" in
              0 | 1)
                if [ ! -f "$RUNNER_TEMP/site-parity/$1.json" ]; then
                  echo "::error::The $1 comparison exited $3 but left no report, so it compared nothing; see its step above."
                  exit 1
                fi
                ;;
              *)
                echo "::error::The $1 comparison ran but did not finish (exit code '$3'; none when its timeout stopped it), so it compared nothing; see its step above."
                exit 1
                ;;
            esac
          }
          check cire "$PARITY_CIRE_OUTCOME" "$PARITY_CIRE_EXIT"
          check musubi "$PARITY_MUSUBI_OUTCOME" "$PARITY_MUSUBI_EXIT"

  # ── A site's domain back on its Pages project ────────────────────────────
  # The rollback of a flip, dispatched with `attach` naming the site, or run
  # after the stack job of a release dispatched with `unflip`, once the site's
  # Worker has given up its production host. A fresh runner with nothing
  # installed, so the narrow Pages and DNS token reaches no dependency's
  # code; it never leaves GitHub. `pages-domain.ts attach` checks the token's
  # reach, then makes only what is missing, and refuses while the Worker or
  # anything else still holds the host. Its own approval.
  attach-pages-domain:
    name: Put a site's domain back on its Pages project
    needs: [plan, stack-cire-production, stack-musubi-production]
    if: ${{ !cancelled() && needs.plan.outputs.attach != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No install: pages-domain.ts imports only the repository's import-free
      # files.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Put the site's domain and CNAME back on its Pages project
        id: attach
        run: bun run scripts/pages-domain.ts attach "$ATTACH"
        env:
          ATTACH: ${{ needs.plan.outputs.attach }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_DNS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DNS_TOKEN }}
