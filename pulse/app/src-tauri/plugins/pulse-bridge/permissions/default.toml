"$schema" = "schemas/schema.json"

[default]
description = "Allows haptic impact feedback, reading safe-area insets, positioning native glass panels, and subscribing to their interaction events."
permissions = [
  "allow-impact",
  "allow-get-safe-area-insets",
  "allow-update-glass-panels",
  "allow-register-listener",
  "allow-remove-listener",
]
