  # ═══ osn/api (Worker + D1) ═════════════════════════════════════════════════
  # osn-api (identity/auth) is a Cloudflare Worker (`main = "src/index.ts"`,
  # a custom-domain route per env). It runs on workerd with Upstash + native
  # Workers rate-limiters. Secrets are set out-of-band per tier
  # (`wrangler secret put … --env <tier>`); these jobs only migrate + deploy.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  # The dev issuer is id.dev.musubi.social with its OWN D1 (`osn-db-dev`) and its
  # own WebAuthn RP ID (dev.musubi.social), so a dev passkey is a separate
  # credential from a prod one and no dev sign-in can touch a real account.
  #
  # Unlike cire's dev D1, this one is NOT reset: accounts and passkeys are the
  # thing being tested, and wiping them every merge would mean re-registering a
  # credential before every manual check. Migrations still apply forward.
  deploy-osn-api-dev:
    name: Deploy osn/api — dev
    needs: [build, changes]
    if: needs.changes.outputs.osn_api == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-osn-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Apply osn D1 migrations (remote dev)
        run: bun run --cwd osn/db db:migrate:dev

      # Same fail-closed secret preflight as prod (see that job for why). Dev
      # needs its OWN OSN_PAIRWISE_SALT — a dev value, and once set it must never
      # be rotated either, or every dev relying party sees its users as
      # strangers. Set it with the `Set an osn-api Worker secret` workflow
      # (secret: OSN_PAIRWISE_SALT, tier: dev).
      - name: Preflight — required dev secrets are set
        run: |
          set -euo pipefail
          required="OSN_PAIRWISE_SALT"
          set_names="$(bunx wrangler secret list --env dev | grep -oE '"name" *: *"[^"]+"' | sed -E 's/.*"name" *: *"([^"]+)".*/\1/')"
          missing=""
          for name in $required; do
            if ! printf '%s\n' "$set_names" | grep -qx "$name"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::osn-api-dev is missing required secret(s):$missing — run the 'Set an osn-api Worker secret' workflow with secret=OSN_PAIRWISE_SALT, tier=dev. osn-api fails closed on these, so deploying now would 503 every route."
            exit 1
          fi
          echo "All required osn-api dev secrets are set."
        working-directory: osn/api

      - name: Deploy osn/api Worker (dev)
        run: bunx wrangler deploy --env dev
        working-directory: osn/api

  # ── production ─────────────────────────────────────────────────────────────
  deploy-osn-api:
    name: Deploy osn/api — production
    needs: [build, changes, deploy-osn-api-dev]
    if: needs.changes.outputs.osn_api == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-osn-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      # Apply pending migrations to the remote prod osn D1 (`osn-db-prod`, the
      # `[env.production].d1_databases` binding) BEFORE the new Worker serves.
      # `--env production` selects that binding; idempotent — wrangler skips
      # already-applied migrations.
      - name: Apply osn D1 migrations (remote prod)
        run: bun run --cwd osn/db db:migrate:prod

      # Secret preflight: osn-api fails CLOSED at boot/request time when a
      # required secret is missing (e.g. the OSN_PAIRWISE_SALT check), so a
      # `wrangler deploy` can report success while every route 503s — exactly
      # the #315 outage. Assert the required secrets are configured on the prod
      # Worker BEFORE promoting the new code. Read-only (`wrangler secret list`);
      # never prints values. Add a name here whenever a new fail-closed secret
      # gate lands.
      - name: Preflight — required prod secrets are set
        run: |
          set -euo pipefail
          required="OSN_PAIRWISE_SALT"
          set_names="$(bunx wrangler secret list --env production | grep -oE '"name" *: *"[^"]+"' | sed -E 's/.*"name" *: *"([^"]+)".*/\1/')"
          missing=""
          for name in $required; do
            if ! printf '%s\n' "$set_names" | grep -qx "$name"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::osn-api is missing required prod secret(s):$missing — set them with 'wrangler secret put <NAME> --env production' before deploying. osn-api fails closed on these, so deploying now would 503 every route."
            exit 1
          fi
          # Secrets that must NOT exist here. DEV_LOGIN_SECRET is the
          # passkey-less sign-in; the tier gate in build-deps.ts already keeps
          # the route unmounted on production, but a secret sitting on the
          # production Worker is one edit away from a credential bypass on live
          # weddings, so refuse the deploy until it is deleted (S-L2).
          forbidden="DEV_LOGIN_SECRET"
          present=""
          for name in $forbidden; do
            if printf '%s\n' "$set_names" | grep -qx "$name"; then
              present="$present $name"
            fi
          done
          if [ -n "$present" ]; then
            echo "::error::osn-api has forbidden prod secret(s) set:$present — delete with 'wrangler secret delete <NAME> --env production'. These exist only for the local/dev tiers."
            exit 1
          fi
          echo "All required osn-api prod secrets are set, and no forbidden ones."
        working-directory: osn/api

      - name: Deploy osn/api Worker
        run: bunx wrangler deploy --env production
        working-directory: osn/api

  # ═══ osn/social (Vite SPA → Cloudflare Pages) ══════════════════════════════
  # The identity web app: profile, connections, organisations, settings — and
  # `/authorize`, the OIDC consent screen osn-api redirects to. It must be
  # served under the SAME registrable domain as its osn-api, because the session
  # cookie and the per-request OIDC binding cookie are host-bound to the issuer
  # and only ride along on same-site credentialed fetches. That is why each tier
  # pairs a musubi.social host with its own issuer host, never a *.pages.dev URL.
  #
  # The app's host is also the WebAuthn RP ID, so this is the one surface that
  # can run a passkey ceremony — per tier.
  #
  # `osn/social/public/_redirects` rewrites every path to index.html (200) so
  # client-side routes deep-link; `_headers` ships the framing denial the
  # consent screen needs. Both are static files Pages serves as-is.
  #
  # There is NO feature-branch preview for this app. `deploy-osn-social-preview.yml`
  # was removed on 2026-07-27: a preview on `*.pages.dev` can neither run a
  # passkey ceremony nor complete an OIDC round-trip — wrong RP ID, and the
  # `__Host-` cookies are bound to the issuer host. The dev tier below replaces
  # it properly: dev.musubi.social IS a real RP ID with a real issuer behind it.
  #
  # ── dev ────────────────────────────────────────────────────────────────────
  deploy-osn-social-dev:
    name: Deploy osn/social — dev
    needs: [build, changes]
    if: needs.changes.outputs.osn_social == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev-osn-social
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install

      # No hard sitekey gate here, unlike prod: whether Turnstile enforces on dev
      # depends on osn-api-dev holding TURNSTILE_SECRET_KEY, which is a
      # per-tier choice (key-optional, fail-closed only when the secret is set).
      # The prod job's gate is what protects the pairing that actually matters.
      - name: Build osn/social (dev)
        run: bun run build --filter=@osn/social
        env:
          VITE_OSN_ISSUER_URL: https://id.dev.musubi.social
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      - name: Ensure the osn-social-dev Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" osn-social-dev main
        working-directory: osn/social

      - name: Deploy osn/social to Cloudflare Pages (dev)
        run: bunx wrangler pages deploy dist --project-name osn-social-dev --branch main --commit-dirty=true
        working-directory: osn/social

  # ── production ─────────────────────────────────────────────────────────────
  # The `osn-social` Pages project must exist in the account before first run,
  # and musubi.social is attached to it in the dashboard (a Pages custom domain,
  # not a wrangler route) — see the runbook.
  deploy-osn-social:
    name: Deploy osn/social — production
    needs: [build, changes, deploy-osn-social-dev]
    if: needs.changes.outputs.osn_social == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-osn-social
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-build-

      - name: Install dependencies
        run: bun install

      # VITE_OSN_ISSUER_URL bakes in at build time. Without it the bundle falls
      # back to http://localhost:4000 and every call from the deployed app dials
      # the user's own machine.
      #
      # VITE_TURNSTILE_SITEKEY is the CLIENT half of the Turnstile gate, and is
      # NOT optional here: osn-api already holds TURNSTILE_SECRET_KEY (set in
      # #160), so `/register/begin` and the identifier-bound
      # `/login/passkey/begin` fail closed (400 turnstile_failed) on any request
      # without a token. Until 2026-07-27 the only surface running those
      # ceremonies was cire/organiser, whose Astro build did read the sitekey;
      # the musubi.social move (#321) plus the organiser's OIDC swap (#322)
      # relocated them to this app, which was never wired up — so sign-in on
      # musubi.social broke. Same repo Variable as the cire builds (one widget,
      # one sitekey); musubi.social must be in the widget's Domains list.
      # Fail the deploy rather than ship an app nobody can sign into. An unset or
      # renamed repo Variable expands to "", the app normalises that to "no
      # widget", and osn-api then rejects every register/login with
      # `400 turnstile_failed` — with a green build and a green deploy. That
      # silent pairing is exactly what broke on 2026-07-27, and the unit tests
      # cannot see it: they prove the sitekey is threaded to the components, not
      # that a real value was baked into the bundle.
      - name: Require the Turnstile sitekey
        run: |
          if [ -z "${VITE_TURNSTILE_SITEKEY}" ]; then
            echo "::error::Repo Variable PUBLIC_TURNSTILE_SITEKEY is empty or unset."
            echo "osn-api has TURNSTILE_SECRET_KEY set, so a build without the sitekey"
            echo "fails closed on every sign-in and registration. See wiki/systems/turnstile.md."
            exit 1
          fi
        env:
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      - name: Build osn/social
        run: bun run build --filter=@osn/social
        env:
          VITE_OSN_ISSUER_URL: https://id.musubi.social
          VITE_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}

      # Idempotent: creates the project on the first run, no-ops after. The
      # helper swallows only "already exists" — a bad token or a rate limit still
      # fails the step, where `|| true` used to report it green.
      # `pages deploy` against a project that does not exist fails outright in a
      # non-interactive shell. The custom domain (musubi.social) is still a
      # dashboard step — wrangler cannot attach one.
      - name: Ensure the osn-social Pages project exists
        run: bash "$GITHUB_WORKSPACE/scripts/ensure-pages-project.sh" osn-social main
        working-directory: osn/social

      - name: Deploy osn/social to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name osn-social --branch main --commit-dirty=true
        working-directory: osn/social

  # ═══ zap/api (Worker + D1) ═════════════════════════════════════════════════
  # DORMANT: zap-api is not yet provisioned in prod (the D1 database doesn't
  # exist yet). Until the real D1 id is filled in (a deploy-time step — see
  # wiki/runbooks/production-deploy.md), the "Detect zap prod provisioning"
  # step below detects the placeholder and emits provisioned=false, causing
  # both the migrate + deploy steps to be skipped. The job runs green + inert.
  # Once zap-db-prod is created and its id replaces the placeholder, both steps
  # fire on the next push to main.
  #
  # Zap has no dev tier (out of scope for the 2026-08-13 dev-tier work), so this
  # job has no dev counterpart to promote from — it goes straight to the
  # approval-gated production Environment.
  deploy-zap-api:
    name: Deploy zap/api — production
    needs: [build, changes]
    if: needs.changes.outputs.zap_api == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-zap-api
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install
      # zap-api is not provisioned in prod until its D1 exists + its id is filled
      # into wrangler.toml (a deploy-time step). Until then, SKIP (green) so this
      # job never deploys against a non-existent DB and never reds the pipeline.
      - name: Detect zap prod provisioning
        id: zapcheck
        run: |
          # Check ONLY the production D1 id — dev/staging legitimately keep placeholders.
          PROD_ID=$(awk '/\[\[env\.production\.d1_databases\]\]/{f=1} f&&/^database_id/{gsub(/.*= *"|".*/,""); print; exit}' zap/api/wrangler.toml)
          if [ -z "$PROD_ID" ] || [ "$PROD_ID" = "placeholder-replace-after-d1-create" ]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "zap-api prod D1 not provisioned yet — skipping deploy."
          else
            echo "zap-api prod D1 provisioned ($PROD_ID) — deploying."
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply zap D1 migrations (remote prod)
        if: steps.zapcheck.outputs.provisioned == 'true'
        run: bunx wrangler d1 migrations apply zap-db-prod --env production --remote
        working-directory: zap/api
      - name: Deploy zap/api Worker
        if: steps.zapcheck.outputs.provisioned == 'true'
        run: bunx wrangler deploy --env production
        working-directory: zap/api
