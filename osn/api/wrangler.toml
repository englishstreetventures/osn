name = "osn-api"
# `entry.ts` exports the fetch/scheduled handler (from `index.ts`) and the
# `CoordinationStore` Durable Object class the `COORDINATION` binding names.
main = "src/entry.ts"
compatibility_date = "2025-03-01"
# `nodejs_compat_populate_process_env` is what makes `process.env` reflect the
# [vars] below plus the Worker's secrets. It is only a DEFAULT for
# compatibility_date >= 2025-04-01, and this Worker is pinned to 2025-03-01 — so
# without naming it explicitly `process.env` is permanently EMPTY on workerd and
# `@shared/observability`'s `loadConfig` resolved every deployed tier as `local`
# (local log format, debug level) no matter what OSN_ENV said. Opting the flag in
# by name, rather than bumping the compatibility date on a live identity Worker,
# changes this one behaviour and nothing else.
#
# It populates LAZILY on first access to `process`, never during module
# evaluation, so a config parsed at module top level still sees nothing — hence
# the lazy `Layer.suspend` in src/observability.ts. Note this does NOT apply to
# secrets-as-`env`-bindings: `src/index.ts` still threads the request-scoped
# `env` object through `buildAppDeps`, which is the only correct source for keys.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Refuse to publish the top-level (env-less) config to a *.workers.dev URL. The
# top-level block is the local `wrangler dev` posture (OSN_ENV=local: ephemeral
# JWT keys, in-memory rate limiters, non-Secure cookies), so a bare
# `wrangler deploy` would expose a public identity API in dev posture. With no
# top-level routes a bare deploy now fails loudly. Real deploys use
# `--env production` (custom_domain route below).
workers_dev = false

# osn-api now runs on Cloudflare Workers via `export default { fetch, scheduled }`
# in `src/index.ts` (Phase 6). The Bun dev server (`src/local.ts`) is unchanged
# and remains the default fast devloop (`bun run dev`); `wrangler dev` is the
# workerd parity loop (`bun run dev:wrangler`).
#
# Migrate the local D1 (miniflare):
#   bun run --cwd osn/db db:migrate:local
# The dev tier's Worker and database are the musubi stack's (musubi/infra),
# which builds and migrates them in the dev account; nothing here deploys dev.
#
# Tracked as an open issue (the four-environment DB story).

# ── Top-level (local `wrangler dev`) ─────────────────────────────────────────
# These apply to `wrangler dev` with no `--env`. OSN_ENV is unset/"local" here,
# so: miniflare local D1 and Durable Objects, no Secure cookies, localhost
# issuer/CORS/RP defaults baked into the factory. Needs NO external services.
[vars]
OSN_ENV = "local"
OSN_RP_ID = "localhost"
OSN_RP_NAME = "Musubi"
OSN_ORIGIN = "http://localhost:1422,http://localhost:1420,http://localhost:4322,http://localhost:5173,http://localhost:4326,http://localhost:4321"
# 4000, not wrangler's default 8787. Every consumer's local expectation is
# `http://localhost:4000` — cire's and pulse's wrangler dev blocks, all three
# `DEFAULT_ISSUER_URL`s, `build-deps.ts`'s own fallback and the shared test
# signer. Now that access-token verification pins the issuer, a `wrangler dev`
# minting 8787 would 401 every cross-service call with nothing in the response
# to say why. Run this loop as `wrangler dev --port 4000` so the URL agrees
# with the claim.
OSN_ISSUER_URL = "http://localhost:4000"
OSN_CORS_ORIGIN = "http://localhost:1422,http://localhost:1420,http://localhost:4322,http://localhost:4326,http://localhost:4321"
# Where `GET /dev/login?return_to=…` may redirect. Its own list, NOT the CORS
# one: a redirect target need not be an origin that fetches this Worker with
# credentials, and adding it to OSN_CORS_ORIGIN would widen the CSRF origin
# guard for every route. Unset ⇒ every `return_to` is a 400.
DEV_LOGIN_RETURN_ORIGINS = "http://localhost:1422,http://localhost:4322,http://localhost:4326,http://localhost:4321"
# cire's OIDC client id: revoking the connection with this id also ends the
# account's cire organiser sessions. Must equal cire-api's own CIRE_OIDC_CLIENT_ID.
CIRE_OIDC_CLIENT_ID = "cid_cire"

# Local `wrangler dev` D1 (miniflare). database_id is ignored locally but
# required syntactically, so this names the little-used remote `osn-db`. It is
# NOT the dev tier's database, which the musubi stack declares in the dev
# account.
[[d1_databases]]
binding = "DB"
database_name = "osn-db"
database_id = "a1dfceb8-2e7a-48eb-a161-ad428f3ddff5"
migrations_dir = "../db/drizzle"

# ── Coordination store (Durable Object) ──────────────────────────────────────
# Every ceremony, single-use claim, lockout counter and limiter longer than a
# minute lives in `CoordinationStore` objects, one per key, so every isolate
# sees the same state. Named envs do NOT inherit `durable_objects`, so the
# binding is mirrored into [env.staging|production] below; the migration that
# creates the SQLite-backed class is top-level and applies to every env.
[[durable_objects.bindings]]
name = "COORDINATION"
class_name = "CoordinationStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoordinationStore"]

# ── Native Workers Rate Limiting bindings (GA `[[ratelimits]]`) ───────────────
# The 60s-window per-IP auth limiters run on Cloudflare's native Rate Limiting
# binding (global + atomic at the edge). One binding per request-budget tier
# (5/10/20/30/60 per 60s) so every endpoint keeps its budget from
# `AUTH_RATE_LIMITS`; `selectAuthRateLimiters` (src/lib/native-rate-limiters.ts)
# namespaces the key per endpoint so endpoints sharing a tier never share a
# bucket. The native binding only supports period 10 or 60s, so the hour-window
# per-IP limiters, the per-account caps and every stateful store stay on the
# coordination store. A test holds every `limit` here to the budget table.
#
# TRADE-OFF: native rate limiting is counted PER-COLO, not globally — a caller
# spread across Cloudflare locations sees a slightly looser effective cap. This
# was explicitly approved; a single attacker is pinned to one colo, and the
# stateful brute-force guards (the lockout counters) are on the coordination
# store, which is global.
#
# `namespace_id` is an account-scoped positive integer that uniquely identifies
# the namespace. The values below are NEW and per-tier; bump/replace them if they
# collide with another Worker's namespaces in this account. Named envs do NOT
# inherit these — they are mirrored into [env.staging|production] below.
[[ratelimits]]
name = "RL_AUTH_IP_5_60"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_AUTH_IP_10_60"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AUTH_IP_20_60"
namespace_id = "2003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AUTH_IP_30_60"
namespace_id = "2004"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_AUTH_IP_60_60"
namespace_id = "2005"
simple = { limit = 60, period = 60 }

# Per-user tiers for graph and organisation writes and the two recommendation
# endpoints, keyed `<store>:<userId>`. A deployed Worker without them answers
# 503 (`USER_TIERS` in src/lib/native-rate-limiters.ts). Profile create, delete
# and set-default are keyed per IP and share the RL_AUTH_IP tiers above.
[[ratelimits]]
name = "RL_USER_20_60"
namespace_id = "2006"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_USER_60_60"
namespace_id = "2007"
simple = { limit = 60, period = 60 }

# ── Workers observability (Part 3) ───────────────────────────────────────────
# Free Workers Logs + invocation capture in the Cloudflare dashboard. This is the
# interim observability while OTel export stays deferred on workerd (the
# redacting osnLoggerLayer keeps structured logs; no logger/observability code
# changes). head_sampling_rate = 1 captures every invocation at launch volume.
# Each tier states its trace and URL-redaction posture below.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.traces]
enabled = true
head_sampling_rate = 1

# ── Scheduled maintenance (cron) ─────────────────────────────────────────────
# Replaces the Bun `setInterval` deletion sweeper. Cadence matches the Bun
# SWEEPER_INTERVAL default (6 h) — runs the account-erasure fan-out-retry +
# hard-delete sweeps. ARC outbound-key rotation is NOT cron'd: it lazily inits
# on first outbound use (see `lib/outbound-arc.ts`).
[triggers]
crons = ["0 */6 * * *"]

# ── staging ──────────────────────────────────────────────────────────────────
[env.staging.vars]
OSN_ENV = "staging"
# TODO(prod-domains): PLACEHOLDERS. Default deploy URL is
# https://osn-api.<account-subdomain>.workers.dev — set OSN_ISSUER_URL to that at
# deploy. OSN_RP_ID/OSN_ORIGIN need a real custom domain (workers.dev can't be a
# WebAuthn RP ID across surfaces), so staging passkeys are deferred until then.
OSN_RP_ID = "staging.osn.example"
OSN_RP_NAME = "Musubi (staging)"
OSN_ORIGIN = "https://staging.osn.example"
OSN_ISSUER_URL = "https://api.staging.osn.example"
OSN_CORS_ORIGIN = "https://staging.osn.example"
# Marker-cookie domain only — see the production block. Placeholder like the rest.
OSN_COOKIE_DOMAIN = "staging.osn.example"
# Rotated-session sweep chunks per cron run, as production (see there).
OSN_ROTATED_SESSION_SWEEP_MAX_CHUNKS = "100"

[[env.staging.durable_objects.bindings]]
name = "COORDINATION"
class_name = "CoordinationStore"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "osn-db-staging"
database_id = "eb71428e-8540-4a30-815f-fb9cd4ae97ea"
migrations_dir = "../db/drizzle"

# Native rate-limit bindings mirrored into staging (named envs don't inherit).
#
# 2201–2207, not the 2001–2007 production uses. `namespace_id` is ACCOUNT-scoped,
# not worker-scoped: two Workers naming the same id share one set of counters. On
# the shared ids, a staging load test against /login would have spent production's
# per-IP budget and locked real users out of sign-in — and any staging IP that
# collided with a real one would have done it quietly. The dev tier, in its own
# account, uses the 21xx range (musubi/infra).
[[env.staging.ratelimits]]
name = "RL_AUTH_IP_5_60"
namespace_id = "2201"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "RL_AUTH_IP_10_60"
namespace_id = "2202"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "RL_AUTH_IP_20_60"
namespace_id = "2203"
simple = { limit = 20, period = 60 }

[[env.staging.ratelimits]]
name = "RL_AUTH_IP_30_60"
namespace_id = "2204"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "RL_AUTH_IP_60_60"
namespace_id = "2205"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "RL_USER_20_60"
namespace_id = "2206"
simple = { limit = 20, period = 60 }

[[env.staging.ratelimits]]
name = "RL_USER_60_60"
namespace_id = "2207"
simple = { limit = 60, period = 60 }

[env.staging.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.staging.observability.traces]
enabled = false

[env.staging.triggers]
crons = ["0 */6 * * *"]

# ── production ───────────────────────────────────────────────────────────────
# OSN identity lives on its own zone: musubi.social (cutover 2026-07-27, see
# `[[wiki/musubi/musubi-identity-migration]]`). The custom-domain route below
# serves osn-api on id.musubi.social and auto-provisions DNS + edge cert since the
# zone is in this Cloudflare account.
#
# The RP ID is the registrable apex `musubi.social`, not `id.musubi.social`. A WebAuthn
# ceremony may only run on an origin same-site with the RP ID, and the consent
# screen (`@musubi/social`) is served from the apex — under `id.musubi.social` the apex
# could never run one. The apex also covers every future *.musubi.social surface.
#
# Changing the RP ID invalidates every passkey enrolled under `cireweddings.com`:
# the private half is bound to the RP ID inside the authenticator, so nothing in
# D1 re-points it. Recovery-code login (identifier + code, no WebAuthn) is the
# only bridge across the flip — codes were minted for both prod accounts before
# it.
#
# The cire origins (host./vendor./invite.) no longer call this Worker from the
# browser: since PR #322 the OIDC code exchange runs server-side (cire-api →
# id.musubi.social) and account-linking goes through cire-api, so no cireweddings
# surface makes a credentialed fetch here. OSN_CORS_ORIGIN is therefore trimmed to
# the apex alone; the same list feeds the CSRF origin guard, so leaving the stale
# cire entries in would have handed any XSS on a cireweddings surface credentialed
# access it no longer needs. Re-add an origin only if it genuinely fetches this
# Worker from a browser.
[env.production.vars]
OSN_ENV = "production"
OSN_RP_ID = "musubi.social"
OSN_RP_NAME = "Musubi"
OSN_ORIGIN = "https://musubi.social"
OSN_ISSUER_URL = "https://id.musubi.social"
OSN_CORS_ORIGIN = "https://musubi.social"
# Domain for the JS-readable session MARKER cookie (`osn_has_session`) only —
# the session cookie itself keeps its `__Host-` prefix and stays host-only on
# id.musubi.social. The apps that redeem the cookie sit on the apex, a different
# host, so a host-only marker would be invisible to them and every anonymous
# page load would keep firing a pointless POST /token.
OSN_COOKIE_DOMAIN = "musubi.social"
# Sender stays on cireweddings.com: Resend has no verified musubi.social domain, and
# a sender it cannot authenticate fails closed — which would take OTP with it,
# and OTP step-up is exactly the route back in after a recovery-code login. Move
# this only after verifying musubi.social in Resend.
OSN_EMAIL_FROM = "hello@cireweddings.com"
# Where a parked OIDC request sends the browser. `@musubi/social` serves the consent
# screen from the musubi.social apex — same registrable domain as this Worker, so
# the session cookie and the per-request binding cookie both flow on its
# credentialed fetches back here. Unset, the provider would fall back to
# `/authorize` on the FIRST OSN_ORIGIN, which is fine only because that is now
# the apex too; set it anyway, because the fallback silently follows list order.
OSN_AUTHORIZE_UI_URL = "https://musubi.social/authorize"
# Chunks of 500 expired rotation records the 6-hourly sweep deletes per run, read
# by `rotatedSweepMaxChunks` (src/services/auth/tokens.ts) in the `scheduled`
# handler (src/index.ts). 100 chunks is 50 000 records a run, inside Workers
# Paid's 1 000 D1 queries per invocation; unset, as on dev (Workers Free, 50
# queries shared by four sweeps), it is 10.
OSN_ROTATED_SESSION_SWEEP_MAX_CHUNKS = "100"
# Sign out everywhere else, and revoking cire's connection, ask cire-api to end
# the account's organiser sessions at CIRE_INTERNAL_REVOKE_URL. Both values
# equal cire-api's own (cire/api/wrangler.toml CIRE_API_ORIGIN and
# CIRE_OIDC_CLIENT_ID; cire/infra/tests/cross-stack.test.ts holds them equal).
# Nothing is sent until the CIRE_INTERNAL_REVOKE_SECRET secret, at least 32
# characters, is set here and on cire-api; until then each such request logs a
# skip warning.
CIRE_INTERNAL_REVOKE_URL = "https://api.cireweddings.com"
CIRE_OIDC_CLIENT_ID = "cid_cire"
# Email is sent via Resend (RESEND_API_KEY secret, §1.1) — confirmed delivering
# from hello@cireweddings.com on 2026-06-18. Email is REQUIRED in prod: if
# RESEND_API_KEY is ever absent osn-api fails closed at startup rather than
# silently dropping OTP/security mail. (The former OSN_EMAIL_OPTIONAL degraded
# opt-in was removed once Resend delivery was verified.)

# Custom-domain route: serves osn-api on id.musubi.social. `custom_domain = true`
# auto-provisions DNS + edge cert because the musubi.social zone is in this
# Cloudflare account. The zone has a proxied wildcard record; a wildcard only
# answers names with no specific record, so provisioning an explicit `id` record
# takes precedence rather than colliding. Named envs do NOT inherit top-level
# routes, so this applies only to `wrangler deploy --env production`.
[[env.production.routes]]
pattern = "id.musubi.social"
custom_domain = true

[[env.production.durable_objects.bindings]]
name = "COORDINATION"
class_name = "CoordinationStore"

[[env.production.d1_databases]]
binding = "DB"
database_name = "osn-db-prod"
database_id = "767a9ac1-129b-4efa-9fcf-f68ed7a48c38"
migrations_dir = "../db/drizzle"

# Native rate-limit bindings mirrored into production (named envs don't inherit).
# osn-api MUST be redeployed (`wrangler deploy --env production`) for these to
# take effect; the namespace_ids are new.
[[env.production.ratelimits]]
name = "RL_AUTH_IP_5_60"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_AUTH_IP_10_60"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "RL_AUTH_IP_20_60"
namespace_id = "2003"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "RL_AUTH_IP_30_60"
namespace_id = "2004"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "RL_AUTH_IP_60_60"
namespace_id = "2005"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "RL_USER_20_60"
namespace_id = "2006"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "RL_USER_60_60"
namespace_id = "2007"
simple = { limit = 60, period = 60 }

[env.production.observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[env.production.observability.traces]
enabled = false

[env.production.triggers]
crons = ["0 */6 * * *"]

# ── Secrets (NOT in this file) ───────────────────────────────────────────────
# Provision per env with `wrangler secret put <NAME> --env <staging|production>`.
# On workerd these are surfaced ONLY on the `env` binding (never process.env),
# which is why `src/index.ts` threads `env` through `buildAppDeps`.
#
#   OSN_JWT_PRIVATE_KEY        base64 JWK (ES256 private)  — REQUIRED non-local
#   OSN_JWT_PUBLIC_KEY         base64 JWK (ES256 public)   — REQUIRED non-local
#   OSN_SESSION_IP_PEPPER      ≥32-byte HMAC key           — REQUIRED non-local
#   OSN_TOTP_ENCRYPTION_KEY    EXACTLY 32 random bytes, base64 — REQUIRED non-local.
#                              AES-256-GCM key for TOTP shared secrets at rest.
#                              `openssl rand -base64 32`, or the
#                              `set-osn-api-secret` workflow. Boot fails closed
#                              without it, so set it BEFORE the deploy that first
#                              needs it. KEEP YOUR COPY: rotating it requires
#                              handing the outgoing value back (below), and
#                              Cloudflare never returns a secret's value.
#   OSN_TOTP_ENCRYPTION_KEY_PREVIOUS
#                              The OUTGOING TOTP key, same 32-byte rule.
#                              OPTIONAL, and set only while a rotation drains:
#                              osn-api holds both keys, writes new ciphertext
#                              under the current one, and re-encrypts each
#                              credential the next time its owner enters a code.
#                              Set it BEFORE replacing OSN_TOTP_ENCRYPTION_KEY,
#                              and delete it once the drain is done. Present but
#                              malformed fails the boot, like the current key.
#                              Procedure: wiki/shared/production-deploy.md.
#   RESEND_API_KEY             Resend bearer key — REQUIRED non-local (preferred
#                              email transport; selected over CLOUDFLARE_* creds)
#   RESEND_API_URL             NEVER set here, as a var or a secret. Local
#                              Resend-emulator origin only (.env / .dev.vars);
#                              a non-local tier refuses to boot with it, the
#                              production deploy refuses while the secret exists,
#                              and tests/lib/email-layer.test.ts fails if a tier
#                              here sets it.
#   CLOUDFLARE_ACCOUNT_ID      legacy Cloudflare Email Service — optional fallback
#   CLOUDFLARE_EMAIL_API_TOKEN legacy Cloudflare Email Service — optional fallback
#   OSN_EMAIL_FROM             verified sender (also settable as a [vars])
#   INTERNAL_SERVICE_SECRET    S2S registration shared secret (optional)
#   CIRE_INTERNAL_REVOKE_SECRET bearer for cire-api's organiser-session revoke
#                              (optional, at least 32 characters). cire-api
#                              holds the SAME value; set both, or the revoke is
#                              skipped (unset here) or refused with 503 (unset
#                              on cire-api). Generate with
#                              `openssl rand -base64 32`.
#   PULSE_API_URL / ZAP_API_URL deletion fan-out targets (optional; also [vars])
#   TRUSTED_PROXY_COUNT        legacy XFF proxy-hop count. IGNORED in deployed
#                              tiers: the Workers entry sets trustCloudflare for
#                              non-local, so per-IP keying uses cf-connecting-ip
#                              exclusively (Part 1). Only consulted by the Bun
#                              dev server's XFF/socket path.
#   OTEL_EXPORTER_OTLP_HEADERS Grafana Cloud auth (optional, deferred export)

# ── OpenTelemetry export (deferred on workerd) ───────────────────────────────
# OTEL_SERVICE_NAME / OTEL_EXPORTER_OTLP_ENDPOINT are non-secret [vars]; the
# headers token is a secret. Metric/trace EXPORT on workerd is deferred — the
# redacting logger (osnLoggerLayer) is active, recording call-sites are no-ops
# until an exporter is attached.
