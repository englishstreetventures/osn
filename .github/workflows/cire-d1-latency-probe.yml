# Measure what the first D1 query of a request costs on the cire DEV tier, from
# a GitHub-hosted runner — a client far from the Oceania primary. Manual only.
#
# cire-api opens every request's D1 session `first-primary`, so a request's
# first query always goes to the primary. The script times one route with and
# without one extra SELECT and prints p10/p50/p90, the Cloudflare colo that
# served it and the runner's region, plus a row and a measured marker to paste
# into wiki/shared/d1-read-replication.md. The method is in the script's header:
# cire/api/scripts/d1-latency-probe.ts.
#
# It sends only requests any browser can send, to a public, rate-limited GET on
# the dev tier, and costs one D1 read per timed SELECT. The target is the dev
# cire-api origin, which `dev-hosts` derives from the dev Environment's
# DEV_DOMAIN. The script reads DEV_DOMAIN too and runs only against a host
# under it, refusing a DEV_DOMAIN that is a production zone or under one, so
# no spelling of a production host passes. The job holds no secret and no
# Cloudflare credential.
name: Probe cire dev D1 first-query latency

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Pairs to time, 25 to 100. Blank uses the script's default."
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Time the first D1 query on dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The dev Environment holds DEV_DOMAIN, the one input every dev host
    # comes from.
    environment: dev
    # Its own group, never the cire stack's deploy group: GitHub cancels the
    # pending job in a group when another joins it, so a probe there could
    # cancel a queued dev deploy. A dev deploy can therefore overlap a run; the
    # report prints its window so an overlapping run can be spotted and
    # repeated.
    concurrency:
      group: cire-d1-latency-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Its own key: this job installs @shared/infra alone, so the key a
      # full install restores is never one this job saved.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-shared-infra-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-shared-infra-

      # dev-hosts runs from the @shared/infra workspace, and nothing else this
      # job runs needs a package. @shared/infra depends on alchemy, so this
      # still installs the Alchemy tree; the cache above keeps that cheap.
      - name: Install @shared/infra
        run: bun install --frozen-lockfile --filter @shared/infra

      - name: Derive the dev hosts
        id: hosts
        run: bun run --cwd shared/infra dev-hosts -- --stage dev
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}

      # `--no-install`: the script imports only Bun and web built-ins and
      # scripts/smoke-check.ts, which imports only node:fs, so a stray
      # package import must fail here rather than be fetched from the public
      # registry.
      - name: Time the route pair
        run: bun --no-install cire/api/scripts/d1-latency-probe.ts
        env:
          CIRE_API_ORIGIN: ${{ steps.hosts.outputs.cire_api_origin }}
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          SAMPLES: ${{ inputs.samples }}
